name: Test and package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build standalone classroom file
        run: npm run release:build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Structural-Visualizer
          path: release/Structural-Visualizer.html
          if-no-files-found: error

      - name: Attach file to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Structural-Visualizer.html
