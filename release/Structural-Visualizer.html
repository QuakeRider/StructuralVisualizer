de a vector by its own length and you get a vector of length 1 that points the same way: the unit vector ${zd} (read "v hat"). Its tip always lands on the sphere of radius 1 around the origin. Structural geology uses unit vectors for pure directions such as plane normals, lineations, and fold hinges, where only the direction matters.`,task:`Drag ${ha} anywhere. ${zd} follows its direction but never leaves the unit sphere.`,visualKind:"vector-lab",dimension:3,controls:["components"],labOptions:{...Fs,showUnit:!0,view:"close"},initialLabState:{v:{x:2,y:-1,z:2}},equations:[{id:"unit-definition",html:ee(Od,Rt,Ln(Vi,wn(Vi)),Rt,Ln(fn(ci(Gi,Wi,Nr)),ce("magnitude","vector")))+ee(Rt,ce("unit","unit-vector")),symbols:[$e.unit,$e.v,$e.vx,$e.vy,$e.vz]},{id:"unit-length",html:ee(wn(Od),Rt,ce("unitMagnitude","unit-vector")),symbols:[$e.unit]}],prompt:"Which of these could be a unit vector?",choices:[{id:"ones",label:"(1, 1, 0)",correct:!1,feedback:"Its length is √(1 + 1) = √2 ≈ 1.41, not 1."},{id:"six-eight",label:"(0.6, 0, −0.8)",correct:!0,feedback:"Right. 0.6² + 0² + (−0.8)² = 0.36 + 0.64 = 1. Each component of a unit vector lies between −1 and 1, and their squares add to exactly 1."},{id:"halves",label:"(0.5, 0.5, 0.5)",correct:!1,feedback:"Its length is √0.75 ≈ 0.87. Small components are not enough: the squares must add to exactly 1."}]},{id:"add-vectors",label:"Adding vectors",title:"Add vectors tip to tail, or component by component",activeLabel:"Vector addition",body:`To add b to a, start b where a ends. The sum ${Ni} runs from the origin to the final tip. Now look along the axes: on each one, a’s part (solid bar) and b’s part (dashed bar) stack end to end, and the green dot marks their total. The two constructions always land on the same tip, because adding arrows tip to tail is the same as adding their matching components.`,task:`Predict ${Ni}, then drag either round handle and check that each stack ends at a corner of the sum’s dashed box.`,visualKind:"vector-lab",dime 4, 4).`},{id:"cancel-x",label:"b = (−3, 0, 0)",correct:!1,feedback:"That cancels the x part and leaves (0, 2, 2), which is off the x axis."}]},{id:"scale-vector",label:"Scaling",title:"Scaling stretches, shrinks, or reverses a vector",activeLabel:"Scalar multiple c v",body:"Multiplying a vector by a number c multiplies every component by c. The arrow stays on the same line through the origin. It grows when c is greater than 1, shrinks when c is between 0 and 1, and flips to point the opposite way when c is negative. Its length is |c| times the original length.",task:"Slide c through 1, 0.5, 0, and −1. Watch the green arrow and its components.",visualKind:"vector-lab",dimension:3,controls:["scalar","components"],labOptions:{...Fs,showScaled:!0},initialLabState:{v:{x:2,y:1,z:2},scalar:2},equations:[{id:"scaled-components",html:ee(Fd,Rt,fn(ci(Oe(P("c"),Gi),Oe(P("c"),Wi),Oe(P("c"),Nr))))+ee(Rt,ce("scaled","scaled-vector")),symbols:[$e.scaled,$e.vx,$e.vy,$e.vz]},{id:"scaled-length",html:ee(wn(Fd),Rt,wn(P("c")),wn(Vi))+ee(Rt,ce("absC"),de("×"),ce("magnitude","vector"),Rt,ce("scaledMagnitude","scaled-vector")),symbols:[$e.scaled,$e.v]}],prompt:"What does multiplying by c = −1 do to a vector?",choices:[{id:"reverse",label:"Reverses its direction and keeps its length",correct:!0,feedback:"Right. −v has the same length and points the opposite way. Later this is how a push becomes a pull, or how a fault’s slip sense is reversed."},{id:"shorter",label:"Makes it shorter",correct:!1,feedback:`Slide c to −1: the length stays |−1| × ${cs} = ${cs}. Only the direction flips.`},{id:"zero",label:"Makes it zero",correct:!1,feedback:"Only c = 0 gives the zero vector. c = −1 flips the vector without shrinking it."}]},{id:"where-vectors-show-up",label:"Vectors in geology",title:"Where this shows up: three vectors from geology",activeLabel:"Vectors in structural geology",body:"Every directional quantity in structural geology is a vector: the force pushing on a rock face, the slip of one fault block past another, the line along a fold’s hinge. Each is an arrow with components, exactly like the vectors you just built. Here z still points up; lesson O1 moves to the geological frame of north, east, and down.",task:"Pick each example. The components and the magnitude work the same way every time.",visualKind:"vector-lab",dimension:3,controls:["context","components"],labOptions:{...Fs,context:"rock-face"},initialLabState:{v:{x:.5,y:1,z:-3},context:"rock-face"},contexts:Gm,equations:[{...Gl,html:`${Gl.html}<small>The rock, fault, and fold are illustrative sketches. The vector and its components are exact.</small>`},Vl]}]},qm=be("vector",fe("v")),cr=be("vector",wn(fe("v"))),Xm=be("vector",Gn(fe("v"))),Ym=be("unit-vector",Gn(fe("v"))),qi=be("comp-x",ze(P("v"),P("x"))),Xi=be("comp-y",ze(P("v"),P("y"))),da=be("comp-z",ze(P("v"),P("z"))),Go=be("comp-x-prime",Cs("v","x")),Xc=be("comp-y-prime",Cs("v","y")),Xn=be("angle-alpha",P("α")),Wl=be("angle-beta",P("β")),ql=be("angle-gamma",P("γ")),ji=be("angle-theta",P("θ")),Xl=be("elevation-angle",P("ε")),jm=be("xy-diagonal",P("d")),Km=be("curve-cos2",Oe(Di(P("cos"),Ke("2")),P("θ"))),Zm=be("curve-sincos",Oe(P("sin"),P("θ"),P("cos"),P("θ"))),qe=de("="),jn=de("+"),Yi=i=>Oe(P("cos"),i),Ur=i=>Oe(P("sin"),i),hr=i=>Di(i,Ke("2")),Qa=i=>Oe(Di(P("cos"),Ke("2")),i),$d=Ln(Ke("1"),Ke("2")),Jm=Di(P("tan"),Oe(de("−"),Ke("1"))),eo=i=>`<small>${i}</small>`,ue={v:Q(fe("v")),absv:Q(wn(fe("v"))),vhat:Q(Gn(fe("v"))),vx:Q(ze(P("v"),P("x"))),vy:Q(ze(P("v"),P("y"))),vz:Q(ze(P("v"),P("z"))),vxp:Q(Cs("v","x")),vyp:Q(Cs("v","y")),alpha:Q(P("α")),beta:Q(P("β")),gamma:Q(P("γ")),theta:Q(P("θ")),eps:Q(P("ε")),xp:Q(P("x′")),yp:Q(P("y′"))},ot={v:{symbol:fe("v")},absv:{symbol:wn(fe("v")),sceneRef:"vector",description:"Length of the white arrow"},vhatUnit:{symbol:Gn(fe("v")),sceneRef:"vector",description:"The white arrow: length 1, so its tip stays on the circle"},vhat:{symbol:Gn(fe("v")),sceneRef:"unit-vector",description:"Green dotted arrow of length 1 along v, ending on the unit sphere"},vx:{symbol:ze(P("v"),P("x")),sceneRef:"comp-x",description:"Blue solid arrow along x: the side of the triangle next to α"},vy:{symbol:ze(P("v"),P("y")),sceneRef:"comp-y",description:"Orange solid arrow parallel to y: the side opposite α"},vz:{symbol:ze(P("v"),P("z")),sceneRef:"comp-z",description:"Pink arrow parallel to z: the vertical leg"},vxp:{symbol:Cs("v","x"),sceneRef:"comp-x-prime",description:"Blue dashed arrow along the turned axis x′"},vyp:{symbol:Cs("v","y"),sceneRef:"comp-y-prime",description:"Orange dashed arrow parallel to the turned axis y′"},alpha:{symbol:P("α"),sceneRef:"angle-alpha",description:"Blue arc: the angle from the +x axis to the arrow"},beta:{symbol:P("β"),sceneRef:"angle-beta",description:"Orange arc: the angle from the +y axis to the arrow"},gamma:{symbol:P("γ"),sceneRef:"angle-gamma",description:"Pink arc: the angle from the +z axis to the arrow"},theta:{symbol:P("θ"),sceneRef:"angle-theta",description:"Green arc: how far the dashed axes x′, y′ are turned from x, y"},eps:{symbol:P("ε"),sceneRef:"elevation-angle",description:"Violet arc: the angle between the floor and the arrow"},d:{symbol:P("d"),sceneRef:"xy-diagonal",description:"Gray dashed line on the floor: the arrow’s shadow"},cos2:{symbol:Oe(Di(P("cos"),Ke("2")),P("θ")),sceneRef:"curve-cos2",description:"Blue solid curve in the plot"},sincos:{symbol:Oe(P("sin"),P("θ"),P("cos"),P("θ")),sceneRef:"curve-sincos",description:"Pink dashed curve in the plot"}},Qm={id:"rotate-x",html:ee(Go,qe,qi,Yi(ji),jn,Xi,Ur(ji))+ee(qe,ce("vxpSub","comp-x-prime"))+ee(qe,ce("vxp","comp-x-prime")),symbols:[ot.vxp,ot.vx,ot.vy,ot.theta]},eg={id:"rotate-y",html:ee(Xc,qe,de("−"),qi,Ur(ji),jn,Xi,Yi(ji))+ee(qe,ce("vypSub","comp-y-prime"))+ee(qe,ce("vyp","comp-y-prime")),symbols:[ot.vyp]},ua={layout:"single",showComponents:!0,draggable:["v"]},Yl={layout:"single",showComponents:!0,draggable:[],rotatedAxes:!0,showPrimedComponents:!0},jl=Object.freeze([{id:"line-plunge",label:"A line and how steeply it plunges",usedIn:"O1",vector:{x:3,y:2,z:2.5},dimension:3,options:{showTriangles:!0,showElevation:!0}},{id:"tilted-plane",label:"A plane tilted inside a rock",usedIn:"S5",vector:{x:3,y:3.5,z:0},dimension:2,theta:30,options:{showComponents:!1,rotatedAxes:!0,showPrimedComponents:!0,planeTrace:!0}}]),tg={id:"M2",status:"built",steps:[{id:"unit-circle",label:"The unit circle",title:"A unit vector’s components are its cosine and sine",activeLabel:"The unit circle",body:`The white arrow has length 1 and makes an angle ${ue.alpha} with the +x axis, measured counterclockwise. Its tip always lies on the circle of radius 1. The arrow and its two components form a right triangle whose longest side is 1. By the definitions of cosine and sine, the side along x is cos ${ue.alpha} and the side along y is sin ${ue.alpha}. So the components of a unit vector are simply (cos ${ue.alpha}, sin ${ue.alpha}).`,task:"Drag the tip around the circle, or use the angle slider. Watch the signs of the components change from quadrant to quadrant.",visualKind:"vector-lab",dimension:2,controls:["angle"],labOptions:{...ua,polar:!0,fixedLength:1,showAngle:!0,showUnitCircle:!0,view:"close"},initialLabState:{v:un(1,40)},equations:[{id:"unit-components",html:ee(Xm,qe,fn(ci(qi,Xi)),qe,fn(ci(Yi(Xn),Ur(Xn))))+ee(qe,ce("v","vector"))+ee(Xn,qe,ce("alpha","angle-alpha")),symbols:[ot.vhatUnit,ot.vx,ot.vy,ot.alpha]},{id:"unit-pythagoras",html:ee(Qa(Xn),jn,Oe(Di(P("sin"),Ke("2")),Xn),qe,Ke("1"))+ee(ce("vx2","comp-x"),jn,ce("vy2","comp-y"),qe,ce("sumSquares","vector"))+eo("Pythagoras on a triangle whose longest side is 1."),symbols:[]}],prompt:`Drag the tip to ${ue.alpha} = 120°. Which component is negative?`,choices:[{id:"vx",label:`${ue.vx}`,correct:!0,feedback:"Right: cos 120° = −0.5. Past 90° the tip is left of the y axis, so the x component is negative, while sin 120° ≈ 0.87 is still positive."},{id:"vy",label:`${ue.vy}`,correct:!1,feedback:"sin α stays positive from 0° to 180°, because the tip is above the x axis. Drag to 120° and look at the blue arrow."},{id:"both",label:"Both",correct:!1,feedback:"Both are negative only in the third quadrant, from 180° to 270°. At 120° the tip is up and to the left."}]},{id:"length-and-angle",label:"Length and angle",title:"Components from a length and an angle",activeLabel:"Components from length and angle",body:`A vector of any length is a unit vector stretched by that length, so both components stretch too: ${ue.vx} = ${ue.absv} cos ${ue.alpha} and ${ue.vy} = ${ue.absv} sin ${ue.alpha}. This is the step you take whenever a measurement gives a size and a direction, such as a force of 5 kN pushing 30° above the horizontal. Set your calculator to degrees: cos 30 in radians is a completely different number.`,task:"Answer the question first. Then change the length and the angle and watch both components follow.",visualKind:"vector-lab",dimension:2,controls:["length","angle"],labOptions:{...ua,polar:!0,showAngle:!0},initialLabState:{v:un(5,30)},revealAfterAnswer:["vx","vy"],equations:[{id:"polar-x",html:ee(qi,qe,cr,Yi(Xn),qe,ce("vxSub","comp-x"),qe,ce("vx","comp-x")),symbols:[ot.vx,ot.absv,ot.alpha]},{id:"polar-y",html:ee(Xi,qe,cr,Ur(Xn),qe,ce("vySub","comp-y"),qe,ce("vy","comp-y")),symbols:[ot.vy]}],prompt:`A vector has length 5 and points 30° above the +x axis. What is ${ue.vx}?`,answer:{value:4.33,tolerance:.02,correctFeedback:"Correct: 5 cos 30° = 5 × 0.866 ≈ 4.33. The x component goes with cosine because it is the side next to the angle.",wrong:[{value:2.5,feedback:"That is 5 sin 30°, the y component. The x component is the side next to the angle, so it goes with cosine."},{value:.87,tolerance:.01,feedback:"0.866 is cos 30° by itself. Multiply by the length: vx = 5 × 0.866."},{value:.77,tolerance:.01,feedback:"Your calculator is in radians: 5 cos(30 radians) ≈ 0.77. Switch it to degrees."},{value:5,feedback:"5 is the whole length. Only a vector lying along the x axis has vx = |v|."}],fallbackFeedback:"Use vx = |v| cos α with |v| = 5 and α = 30°, with the calculator in degrees."}},{id:"angle-from-components",label:"Back to the angle",title:"From components back to the angle: check the quadrant",activeLabel:"The angle from components",body:`Going backward, tan ${ue.alpha} = ${ue.vy}/${ue.vx}. But the ratio cannot tell opposite directions apart: (3, 3) and (−3, −3) give the same ratio. A calculator’s tan⁻¹ key always answers between −90° and 90°, so for any vector pointing left (${ue.vx} < 0) it is off by 180°. The fix is to look at the signs of the components: if ${ue.vx} is negative, add 180°; if the result is still negative, add 360°. Programs do this in one step with a function called atan2.`,task:"Predict the angle first. Then drag the tip into each quadrant and compare the calculator’s answer with the true angle.",visualKind:"vector-lab",dimension:2,controls:["components"],labOptions:{...ua,showAngle:!0},initialLabState:{v:{x:-3,y:3,z:0}},revealAfterAnswer:["atanNaive","alpha"],equations:[{id:"tan-ratio",html:ee(P("tan"),Xn,qe,Ln(Xi,qi),qe,ce("tanRatio","vector")),symbols:[ot.alpha,ot.vx,ot.vy]},{id:"quadrant",html:ee(Jm,fn(Ln(Xi,qi)),qe,ce("atanNaive"))+eo("What the calculator’s tan⁻¹ key returns.")+ee(Xn,qe,ce("alpha","angle-alpha"))+eo("The true angle, found with the quadrant (atan2)."),symbols:[]}],prompt:`What is ${ue.alpha} for ${ue.v} = (−3, 3), measured counterclockwise from +x? (degrees)`,answer:{value:135,tolerance:1,correctFeedback:"Correct. tan⁻¹(3/−3) gives −45°, but the vector points up and to the left, into the second quadrant, so α = −45° + 180° = 135°.",wrong:[{value:-45,feedback:"−45° is what tan⁻¹(3/−3) returns, but that direction points down and to the right. This vector points up and to the left: add 180°."},{value:45,feedback:"45° points up and to the right, the direction of (3, 3). Here vx is negative, so the vector points left."},{value:315,feedback:"315° is the same direction as −45°: down and to the right. That is (3, −3)."},{value:225,feedback:"225° points down and to the left, the direction of (−3, −3). Here vy is positive."}],fallbackFeedback:"Find tan⁻¹(vy/vx), then use the signs of vx and vy to put the angle in the right quadrant."}},{id:"direction-angles-3d",label:"Direction angles in 3D",title:"In 3D: one angle to each axis",activeLabel:"Direction angles and cosines",body:`In 3D a single angle is not enough. Instead, measure the angle from the vector to each axis: ${ue.alpha} to x, ${ue.beta} to y, and ${ue.gamma} to z. These are the direction angles. The same right-triangle reasoning gives ${ue.vx} = ${ue.absv} cos ${ue.alpha}, ${ue.vy} = ${ue.absv} cos ${ue.beta}, and ${ue.vz} = ${ue.absv} cos ${ue.gamma}. Divide by ${ue.absv}: the direction cosines are exactly the components of the unit vector ${ue.vhat}. Because ${ue.vhat} has length 1, their squares add to 1. In the flat x–y plane, ${ue.beta} = 90° − ${ue.alpha}, so cos ${ue.beta} = sin ${ue.alpha}: the 2D formulas are a special case.`,task:"Drag the tip (Shift + drag moves it up or down). The three cosines change, but the sum of their squares stays 1.",visualKind:"vector-lab",dimension:3,controls:["components"],labOptions:{...ua,showDirectionAngles:!0,showUnit:!0},initialLabState:{v:{x:2,y:3,z:6}},equations:[{id:"direction-cosines",html:ee(Ym,qe,Ln(qm,cr),qe,fn(ci(Yi(Xn),Yi(Wl),Yi(ql))))+ee(qe,ce("unit","unit-vector"))+ee(fn(ci(Xn,Wl,ql)),qe,ce("directionAngles")),symbols:[ot.vhat,ot.alpha,ot.beta,ot.gamma]},{id:"cosine-identity",html:ee(Qa(Xn),jn,Qa(Wl),jn,Qa(ql),qe,Ke("1"))+ee(ce("cosSquares"),qe,ce("cosSquaresSum")),symbols:[]}],prompt:`Point ${ue.v} straight up the z axis. What are its direction angles (${ue.alpha}, ${ue.beta}, ${ue.gamma})?`,choices:[{id:"up",label:"(90°, 90°, 0°)",correct:!0,feedback:"Right. The vector lies along z, so it makes 0° with z and is perpendicular (90°) to x and y. The direction cosines are (0, 0, 1): the unit vector k̂."},{id:"flat",label:"(0°, 0°, 90°)",correct:!1,feedback:"A vector cannot make 0° with both x and y at once. Along z it is perpendicular to x and y, so those angles are 90°."},{id:"zeros",label:"(0°, 0°, 0°)",correct:!1,feedback:"The cosines would all be 1, and 1² + 1² + 1² = 3, not 1. A vector can lie along only one axis at a time."}]},{id:"rotate-axes",label:"Turn the axes",title:"Turn the axes, not the vector",activeLabel:"Rotating the axes",body:`Now keep the arrow still and turn the coordinate axes by an angle ${ue.theta}. The turned axes are ${ue.xp} and ${ue.yp} (dashed). The arrow does not move. Only its description changes: its components in the new axes, ${ue.vxp} and ${ue.vyp}, are its projections onto ${ue.xp} and ${ue.yp}. Each new component collects a piece of both old ones, which is what the two equations say.`,task:`Predict first, then drag ${ue.theta} to 30°.`,visualKind:"vector-lab",dimension:2,controls:["theta"],labOptions:Yl,initialLabState:{v:{x:4,y:2,z:0},theta:0},revealAfterAnswer:["vxp","vyp"],equations:[Qm,eg,{id:"theta",html:ee(ji,qe,ce("theta","angle-theta")),symbols:[ot.theta]}],prompt:`You will turn the axes 30° counterclockwise. Will ${ue.vxp} be larger or smaller than ${ue.vx} = 4?`,choices:[{id:"larger",label:"Larger",correct:!0,feedback:"Right: v′x = 4 cos 30° + 2 sin 30° ≈ 4.46. The arrow points about 27° above x, so turning x′ by 30° swings it almost onto the arrow, and more of the arrow lies along it."},{id:"smaller",label:"Smaller",correct:!1,feedback:"Turning the axes counterclockwise moves x′ toward the arrow, which points about 27° above x. The projection onto x′ grows. Drag θ and watch the dashed blue arrow."},{id:"same",label:"The same",correct:!1,feedback:"The arrow does not change, but its projection onto a different axis does. Only its length stays the same."}]},{id:"same-arrow",label:"Same arrow, new numbers",title:"Same arrow, different description",activeLabel:"One arrow, many descriptions",body:`Every choice of axes gives different components, but they all describe one arrow. Its length is the same in every frame. Turning about the z axis leaves the z component alone: ${ue.vz} does not change. One frame is special: turn ${ue.xp} until it lies under the arrow, and the horizontal part of the vector is a single component, ${ue.vyp} = 0. Stress uses the same idea. In S5 and S8 you will turn the axes until the shear components of stress vanish, and those special axes are the principal stress directions.`,task:"Reach the goal, then orbit the view: the arrow never moved.",visualKind:"vector-lab",dimension:3,controls:["theta","components"],labOptions:Yl,initialLabState:{v:{x:4,y:2,z:3},theta:0},goal:{text:`Turn the axes until ${ue.vyp} = 0 with ${ue.vxp} positive.`,check:i=>Math.abs(i.primed.y)<.05&&i.primed.x>0},equations:[{id:"invariant",html:ee(cr,qe,jr(hr(qi),jn,hr(Xi),jn,hr(da)))+ee(qe,jr(hr(Go),jn,hr(Xc),jn,hr(da)),qe,ce("magnitude","vector")),symbols:[ot.absv,ot.vx,ot.vy,ot.vz,ot.vxp,ot.vyp]},{id:"both-frames",html:ee(fn(ci(qi,Xi,da)),qe,ce("v","vector"))+ee(fn(ci(Go,Xc,da)),qe,ce("primed"))+ee(ji,qe,ce("theta","angle-theta")),symbols:[ot.theta]}]},{id:"double-angle",label:"Preview: double angles",title:"A preview: squares and products of sine and cosine",activeLabel:"Double-angle preview",body:`Project something twice and you get products such as cos²${ue.theta} and sin ${ue.theta} cos ${ue.theta}. Stress does exactly that. In S2 a force is projected onto a tilted plane and spread over an area that grows as the plane tilts, which gives cos²${ue.theta}. In S5 the shear stress on a tilted plane goes as sin ${ue.theta} cos ${ue.theta}. Both can be rewritten with the double angle 2${ue.theta}, which is why the Mohr circle (S6) uses 2${ue.theta}. You don’t need to derive these now; notice their shapes.`,task:`Sweep ${ue.theta} from 0° to 180° and follow the dots on both curves.`,visualKind:"vector-lab",dimension:2,controls:["theta"],labOptions:{...Yl,showComponents:!1,showUnitCircle:!0,view:"close",plot:"double-angle"},initialLabState:{v:{x:1,y:0,z:0},theta:30},equations:[{id:"cos-squared",html:ee(Km,qe,$d,fn(Ke("1"),jn,P("cos"),Ke("2"),P("θ")),qe,ce("cos2","curve-cos2")),symbols:[ot.cos2]},{id:"sin-cos",html:ee(Zm,qe,$d,P("sin"),Ke("2"),P("θ"),qe,ce("sincos","curve-sincos"))+ee(ji,qe,ce("theta","angle-theta")),symbols:[ot.sincos,ot.theta]}],prompt:`At which angle is sin ${ue.theta} cos ${ue.theta} largest?`,choices:[{id:"45",label:"45°",correct:!0,feedback:"Right: ½ sin 2θ is largest when 2θ = 90°. This is why the largest shear stress acts on planes at 45° to the principal stresses (S5)."},{id:"90",label:"90°",correct:!1,feedback:"At 90°, cos θ = 0, so the product is 0. It peaks halfway, where 2θ = 90°."},{id:"0",label:"0°",correct:!1,feedback:"At 0°, sin θ = 0, so the product is 0. It peaks at 45°, where 2θ = 90°."}]},{id:"where-trig-shows-up",label:"Trig in geology",title:"Where this shows up in geology",activeLabel:"Trigonometry in structural geology",body:`Field measurements are angles, and these relations turn them into vectors. A line in the field, such as a fold hinge, is recorded by its compass direction and by how steeply it plunges. Here z still points up, so its steepness is the angle ${ue.eps} between the line and the floor: ${ue.vz} = ${ue.absv} sin ${ue.eps} and its floor shadow is ${ue.absv} cos ${ue.eps}. O1 turns this into trend and plunge, with z pointing down. And whenever a plane is tilted inside a stressed rock (S5), the stress is described in axes turned to match the plane, with the rotation equations from step 5.`,task:"Pick each example.",visualKind:"vector-lab",dimension:3,controls:["context"],contexts:jl,labOptions:{...ua,draggable:[]},initialLabState:{v:jl[0].vector,context:jl[0].id},equations:[{id:"elevation",html:ee(da,qe,cr,Ur(Xl),qe,ce("vzFromElevation","comp-z"))+ee(jm,qe,cr,Yi(Xl),qe,ce("d","xy-diagonal"))+ee(Xl,qe,ce("elevation","elevation-angle")),symbols:[ot.vz,ot.d,ot.eps]},{id:"plane-normal",html:ee(Go,qe,qi,Yi(ji),jn,Xi,Ur(ji),qe,ce("vxp","comp-x-prime"))+eo("For the tilted plane: the part of the vector along the plane’s normal x′. The rest, v′y, lies in the plane."),symbols:[ot.vxp,ot.theta]}]}]},ng=[{symbol:vl(fe("t")),sceneRef:"traction",description:"Grid of short arrows spread over the patch"},{symbol:fe("F"),sceneRef:"force",description:"White arrow with a round drag handle"},{symbol:P("A"),sceneRef:"area",description:"Shaded patch on the selected face"}],Hd=be("traction",vl(fe("t"))),Vd={id:"average-traction",html:ee(Hd,de("="),Ln(be("force",fe("F")),be("area",P("A"))))+ee(wn(Hd),de("="),ce("tractionConversion"),de("="),ce("traction")),symbols:ng},Gd={showSurfaceNormal:!0,showArea:!0,showDistribution:!0,allowSurfaceSelection:!0,allowForceDrag:!0},ig={id:"S2",status:"seed",steps:[{id:"distribute-force-over-area",label:"Distribute the load",title:"A resultant force can stand for a load spread over an area",activeLabel:"Resultant and load distribution",body:"The white arrow is the resultant force. The small arrows show one idealized uniform distribution that produces it. Changing the area changes how concentrated the load is, without changing the resultant.",task:"Hold the force fixed and compare 50 cm² with 100 cm². Notice what changes—and what does not.",visualKind:"force-lab",quantity:"force",controls:["magnitude","area"],labOptions:Gd,initialLabState:{forceVector:{x:0,y:-5e3,z:0},surfaceNormal:{x:0,y:1,z:0},contactArea:100},presetId:"uniaxial-compression",magnitude:0,vectors:!1,outline:!1,grid:!1,spotlight:"area",equations:[Vd],prompt:"If the force stays fixed while the loaded area is halved, what happens to the average load intensity?",choices:[{id:"halves",label:"It is halved",correct:!1,feedback:"The same resultant is now concentrated on less area."},{id:"doubles",label:"It doubles",correct:!0,feedback:"Correct. Dividing the same force by half the area gives twice the intensity."},{id:"same",label:"It stays the same",correct:!1,feedback:"Area is in the denominator of F / A."}],responseOverride:"A resultant summarizes a load distribution; the area controls its average intensity."},{id:"calculate-average-traction",label:"Calculate traction",title:"Force divided by area gives average traction",activeLabel:"Average traction, t̄ = F / A",body:"Average traction is a vector with stress units (pascals). It describes the force intensity on one specified surface. It is not yet the complete stress state at a point—that needs every surface through the point.",task:"Set |F| = 5 kN and A = 100 cm². Follow the unit conversion to 0.50 MPa.",visualKind:"force-lab",quantity:"force",controls:["magnitude","area"],labOptions:Gd,initialLabState:{forceVector:{x:0,y:-5e3,z:0},surfaceNormal:{x:0,y:1,z:0},contactArea:100},presetId:"uniaxial-compression",magnitude:0,vectors:!1,outline:!1,grid:!1,spotlight:"traction",equations:[Vd],prompt:"What is |t̄| for 5 kN spread uniformly over 100 cm²?",choices:[{id:"point-zero-five",label:"0.05 MPa",correct:!1,feedback:"Check the conversion from square centimeters to square meters: 100 cm² = 0.01 m²."},{id:"point-five",label:"0.50 MPa",correct:!0,feedback:"Correct. 5,000 N / 0.01 m² = 500,000 Pa = 0.50 MPa."},{id:"five",label:"5.0 MPa",correct:!1,feedback:"That is ten times too large—recheck the area conversion."}],responseOverride:"Traction connects a force on a surface to the intensity of that force."}]},Wd=be("force",vl(fe("t"))),qd=be("surface-normal",fe("n")),Xd=be("normal",ze(P("t"),P("n"))),Yd=be("shear",fe("τ")),sg={id:"S3",status:"seed",steps:[{id:"decompose-traction",label:"Resolve normal and shear",title:"Traction has normal and shear components",activeLabel:"Traction decomposition",body:"Project the traction onto the surface normal. The signed projection is the normal traction; what remains lies in the surface and is the shear traction. Drag the force and watch both parts change with angle and magnitude.",task:"Choose Oblique, then adjust the direction until the normal and shear magnitudes are about equal.",visualKind:"force-lab",quantity:"force",controls:["components","area","presets"],labOptions:{showSurfaceNormal:!0,showArea:!0,showDecomposition:!0,allowSurfaceSelection:!0,allowForceDrag:!0},initialLabState:{forceVector:{x:3535,y:-3535,z:0},surfaceNormal:{x:0,y:1,z:0},contactArea:100},presetId:"pure-shear",magnitude:0,vectors:!1,outline:!1,grid:!1,spotlight:"decomposition",equations:[{id:"normal-part",html:ee(Xd,de("="),Wd,de("·"),qd,de("="),ce("normalTraction")),symbols:[{symbol:vl(fe("t")),sceneRef:"force",description:"White arrow with a round drag handle (traction direction)"},{symbol:fe("n"),sceneRef:"surface-normal",description:"Short arrow pointing straight out of the selected face"},{symbol:ze(P("t"),P("n")),sceneRef:"normal",description:"Arrow parallel to n, drawn from the tip of the shear arrow"}]},{id:"shear-part",html:ee(Yd,de("="),Wd,de("−"),Xd,qd)+ee(wn(Yd),de("="),ce("shearMagnitude")),symbols:[{symbol:fe("τ"),sceneRef:"shear",description:"Arrow lying in the face, starting at the tail of the white arrow"}]}],prompt:"At 45° to the surface normal, how do the normal and shear magnitudes compare?",choices:[{id:"normal-larger",label:"Normal is larger",correct:!1,feedback:"At 45°, the two projections have equal magnitudes."},{id:"equal",label:"They are equal",correct:!0,feedback:"Correct. cos 45° = sin 45°, so both projections are the same size."},{id:"shear-zero",label:"Shear is zero",correct:!1,feedback:"Shear vanishes only when the traction is exactly parallel to the normal."}],responseOverride:"Normal and shear traction are components of one surface-traction vector."}]},jd={id:"cauchy",html:ee(fe("t"),Oe(de("("),fe("n"),de(")")),de("="),de("−"),fe("σ"),fe("n"))+`<small>(compression-positive ${Q(fe("σ"))}, outward ${Q(fe("n"))})</small><output class="equation-matrix" data-live-html="tensor"></output>`,symbols:[]},rg={id:"S7",status:"seed",steps:[{id:"why-stress-needs-a-tensor",label:"Motivate the tensor",title:"Stress at a point must describe every plane orientation",activeLabel:"From traction to the stress tensor",body:"One traction vector describes one plane. A complete stress state must give the traction on every plane through the point. The stress tensor σ does that: it turns a plane’s normal n into that plane’s traction.",task:"Orbit the cube and find the single non-zero component in the matrix and the faces it acts on.",visualKind:"stress-state",presetId:"uniaxial-compression",magnitude:20,vectors:!0,outline:!0,grid:!0,equations:[jd],responseOverride:"The tensor compactly describes how traction depends on plane orientation."},{id:"compare-shear-and-combined-states",label:"Add shear components",title:"Shear and normal components can act together",activeLabel:"Combined stress state",body:"Off-diagonal components are shear tractions on the coordinate planes. A combined state has both normal and shear components; its effect cannot be read from a single external arrow.",task:"Identify at least one normal component and one shear component in the matrix.",visualKind:"stress-state",presetId:"simple-shear-triaxial-compression",magnitude:30,vectors:!0,outline:!0,grid:!0,equations:[jd],prompt:"Which representation completely specifies the displayed stress state at the point?",choices:[{id:"one-arrow",label:"One force arrow",correct:!1,feedback:"A single arrow describes force or traction on one surface, not the complete state."},{id:"tensor",label:"The stress tensor",correct:!0,feedback:"Correct. Its components determine the traction on every plane orientation."}],responseOverride:"Combined states require the full tensor, not a single force or traction vector."}]},Kd={id:"state-tensor",html:`${ee(fe("σ"),de("="))}<output class="equation-matrix" data-live-html="tensor"></output><small>MPa · compression positive, tension negative</small>`,symbols:[]},ag={id:"S10",status:"seed",steps:[{id:"compare-normal-stress-states",label:"Build normal states",title:"Normal components combine into different stress states",activeLabel:"Uniaxial tension",body:"Uniaxial, biaxial, and triaxial states differ in which normal components act together. In the geological convention used here, compression is positive and tension is negative.",task:"Read the matrix: which component is non-zero, and what is its sign?",visualKind:"stress-state",presetId:"uniaxial-tension",magnitude:28,vectors:!0,outline:!0,grid:!0,equations:[Kd],prompt:"What should be most visible along the loaded x-axis in uniaxial tension?",choices:[{id:"shorten",label:"Shortening",correct:!1,feedback:"Shortening goes with compression along x."},{id:"extend",label:"Extension",correct:!0,feedback:"Correct. The block extends parallel to the tensile direction."},{id:"unchanged",label:"No change",correct:!1,feedback:"The tensile component produces visible extension."}],responseOverride:"A stress state combines the normal and shear components acting at one point."},{id:"open-stress-explorer",label:"Open the laboratory",title:"Construct and compare complete stress states",activeLabel:"Stress-state laboratory",body:"Use Explore to compare the reference states and edit tensor components. Keep the chain of reasoning visible: force, traction on a surface, and finally the stress state at a point.",task:"Choose two states with similar magnitudes and explain why their block responses differ.",visualKind:"stress-state",presetId:"biaxial-tension-compression",magnitude:26,vectors:!0,outline:!0,grid:!0,equations:[Kd],responseOverride:"Continue into the open stress-state laboratory and build your own comparisons.",final:!0}]},Zs=i=>ze(P("σ"),Ke(String(i))),Mn=ze(P("σ"),P("n")),Vp=$p(P("σ"),P("n"),de("′")),Mi=ze(P("T"),P("s")),Zi=ze(P("μ"),P("s")),qh=ze(P("P"),P("f")),lt=de("="),Ir=de("−"),Or=de("+"),Pa=ut(" MPa"),to=be("sigma-1",Zs(1)),og=be("sigma-3",Zs(3)),Js=be("normal-stress",Mn),xl=be("shear-stress",P("τ")),Kl=be("pole",fe("n")),Zl=be("traction",fe("t")),Gp=be("friction",Zi),lg=be("intact",P("C")),Wp=be("ts-line",Mi),cg=be("ts-map",Mi),Zd=be("pf",qh),ht={s1:Q(Zs(1)),s2:Q(Zs(2)),s3:Q(Zs(3)),sn:Q(Mn),snEff:Q(Vp),tau:Q(P("τ")),mu:Q(P("μ")),mus:Q(Zi),c:Q(P("C")),ts:Q(Mi),pf:Q(qh),n:Q(fe("n")),t:Q(fe("t")),sigma:Q(fe("σ"))},zt={s1:{symbol:Zs(1),sceneRef:"sigma-1",description:"Largest compression: the vertical arrows on the block, and the right end of the big Mohr circle"},s3:{symbol:Zs(3),sceneRef:"sigma-3",description:"Smallest compression: the dotted east–west arrows, and the left end of the big circle"},sn:{symbol:Mn,sceneRef:"normal-stress",description:"Normal stress: the part of the push straight across the plane (violet, dashed)"},tau:{symbol:P("τ"),sceneRef:"shear-stress",description:"Shear stress: the part of the push along the plane (pink, dashed)"},n:{symbol:fe("n"),sceneRef:"pole",description:"Pole to the plane: the unit normal pointing down into the footwall"},t:{symbol:fe("t"),sceneRef:"traction",description:"Traction: the push of the hanging wall on the footwall, per unit area (orange)"},mus:{symbol:Zi,sceneRef:"friction",description:"Sliding friction: the slope of Byerlee’s line (green), 0.85 for most rocks"},sliding:{symbol:Oe(P("τ"),lt,Zi,Mn),sceneRef:"friction",description:"Byerlee’s friction line (green): the shear stress an existing plane can hold"},intact:{symbol:Oe(P("τ"),lt,P("C"),Or,P("μ"),Mn),sceneRef:"intact",description:"Coulomb line for intact rock (gray, dashed): the shear stress unbroken rock can hold"},c:{symbol:P("C"),sceneRef:"intact",description:"Cohesion: the extra strength of unbroken rock, where the dashed line meets the τ axis"},tsLine:{symbol:Mi,sceneRef:"ts-line",description:"Slip tendency: the slope of the dotted line from the origin to the plane’s point"},tsMap:{symbol:Mi,sceneRef:"ts-map",description:"Slip tendency of every plane: the color at each pole on the stereonet"},critical:{symbol:Oe(Mi,de("≥"),Zi),sceneRef:"critical",description:"Planes that would slip: the hatched part of the stereonet"},pf:{symbol:qh,sceneRef:"pf",description:"Pore-fluid pressure: it shifts every point left by Pf (blue arrow)"}},hg=be("friction",Oe(P("τ"),lt,Zi,Mn)),dg=be("intact",Oe(P("τ"),lt,P("C"),Or,P("μ"),Mn)),ug={id:"traction",html:ee(Zl,lt,fe("σ"),Kl,lt,ce("traction","traction"))+ee(Js,lt,Zl,de("⋅"),Kl,lt,ce("sigmaN","normal-stress"),Pa)+ee(xl,lt,wn(Zl,Ir,Js,Kl),lt,ce("tau","shear-stress"),Pa)+`<small>${ht.n} is the pole, pointing down into the footwall; ${ht.t} (NED components, MPa) is the hanging wall’s push on it. Compression is positive.</small>`,symbols:[zt.t,zt.n,zt.sn,zt.tau]},pg={id:"slip-tendency",html:ee(Wp,lt,Ln(xl,Js),lt,ce("ts","ts-line"))+ee(ut("slips when"),'<mspace width="0.4em"></mspace>',Mi,de("≥"),Gp,lt,Ke("0.85")),symbols:[zt.tsLine,zt.tau,zt.sn,zt.mus]},Jd={id:"map",html:ee(cg,lt,Ln(xl,Js))+ee(ut("hatched:"),'<mspace width="0.4em"></mspace>',be("critical",Oe(Mi,de("≥"),Zi)))+ee(ut("this plane:"),'<mspace width="0.2em"></mspace>',Mi,lt,ce("ts","pole"),de(","),'<mspace width="0.3em"></mspace>',ce("slipsText","critical")),symbols:[zt.tsMap,zt.critical,zt.n]},Qd=Object.freeze([{id:"A",label:"A",strike:0,dip:65,description:"000°/65° E"},{id:"B",label:"B",strike:90,dip:60,description:"090°/60° S"},{id:"C",label:"C",strike:0,dip:30,description:"000°/30° E"}]),pa={showStereonet:!1},fg={id:"B6",status:"built",steps:[{id:"weak-planes",label:"Old planes are weak",title:"Broken rock is weaker than intact rock",activeLabel:"Existing planes are weaker",body:`Crust is full of old breaks: faults, joints, and bedding planes. The tan plane in the block is one of them. On the Mohr diagram (right), intact rock fails on the Coulomb line ${Q(P("τ"),lt,P("C"),Or,P("μ"),Mn)} (gray, dashed; B3). An existing plane only has to overcome friction, so it follows ${Q(P("τ"),lt,Zi,Mn)} (green). The circle shows the stress: σ1 at the right end, σ3 at the left.`,task:"Hover each line and its equation to link them.",visualKind:"friction",controls:[],labOptions:{...pa,showPoint:!1,showRegion:!1,showTraction:!1,showPole:!1,showSlip:!1},initialLabState:{strike:0,dip:65,sigma1:130},equations:[{id:"two-lines",html:ee(ut("intact rock:"),'<mspace width="0.2em"></mspace>',dg)+ee(ut("old plane:"),'<mspace width="0.2em"></mspace>',hg)+ee(lg,lt,Ke("20"),Pa,de(","),'<mspace width="0.6em"></mspace>',P("μ"),lt,Gp,lt,Ke("0.85"))+"<small>Illustrative values: here both lines have the same slope.</small>",symbols:[zt.intact,zt.sliding,zt.c,zt.mus]}],prompt:"In this diagram both lines have the same slope. Why does the line for the existing plane sit lower?",choices:[{id:"no-cohesion",label:"The plane is already broken, so it has no cohesion",correct:!0,feedback:"Right. Cohesion C is the strength of the bonds that hold unbroken rock together. On an existing plane those bonds are already broken, so only friction resists sliding and the line starts at the origin."},{id:"less-friction",label:"Sliding has a lower friction coefficient",correct:!1,feedback:"Not here: both lines have the same slope, μ = 0.85. The whole gap between them is the cohesion C."},{id:"less-normal",label:"The normal stress on the plane is lower",correct:!1,feedback:"The comparison is at the same normal stress: pick any σn and read both lines above it. The existing plane holds less shear stress because it has no cohesion."}]},{id:"byerlee",label:"Byerlee’s law",title:"Byerlee’s law: nearly all rocks slide alike",activeLabel:"Byerlee’s friction law",body:`In 1978 James Byerlee gathered laboratory friction tests on many rock types. For normal stresses up to about 200 MPa (the upper crust), the shear stress needed to slide fits one line, ${Q(P("τ"),lt,Ke("0.85"),Mn)}, whatever the rock. At higher normal stress the fit is ${Q(P("τ"),lt,Ke("50"),Pa,Or,Ke("0.6"),Mn)}. Look for the slight bend in the green line at 200 MPa. The main exception is gouge rich in some clay minerals, which can slide at much lower friction.`,task:"Hover the green line. Then work out the shear stress needed to slide.",visualKind:"friction",controls:[],labOptions:{...pa,showPoint:!1,showRegion:!1,showTraction:!1,showPole:!1,showSlip:!1},initialLabState:{strike:0,dip:65,sigma1:130},equations:[{id:"byerlee",html:ee(be("friction",Oe(P("τ"),lt,Ke("0.85"),Mn)))+ee(be("friction",Oe(P("τ"),lt,Ke("50"),Or,Ke("0.6"),Mn)))+`<small>Stresses in MPa. The first line holds for ${ht.sn} below 200 MPa, the second above.</small>`,symbols:[zt.sliding]}],prompt:`An old fault carries a normal stress ${ht.sn} = 50 MPa. What shear stress ${ht.tau} makes it slide? (MPa)`,answer:{value:42.5,tolerance:.5,correctFeedback:"Correct: τ = 0.85 × 50 = 42.5 MPa. Below that the fault holds; at 42.5 MPa it slides.",wrong:[{value:62.5,feedback:"That is intact rock: 20 + 0.85 × 50. An existing fault has no cohesion, so drop the C."},{value:50,tolerance:1,feedback:"That would be μ = 1. Byerlee’s coefficient below 200 MPa is 0.85."},{value:30,feedback:"The 0.6 slope applies only above 200 MPa, and it comes with a 50 MPa intercept. At 50 MPa, use τ = 0.85σn."},{value:80,tolerance:1,feedback:"That is the high-stress line, 50 + 0.6 × 50, used outside its range. At 50 MPa, use τ = 0.85σn."}],fallbackFeedback:"Use the low-stress line: τ = 0.85 × σn with σn = 50 MPa."}},{id:"every-plane-a-point",label:"Every plane is a point",title:"Every plane is a point on the Mohr diagram",activeLabel:"Planes on the 3D Mohr diagram",body:`Turn the old plane with the strike and dip sliders. The stress pushes on it with a traction ${ht.t} = ${ht.sigma}${ht.n} (orange). That push has a part straight across the plane, ${ht.sn}, and a part along it, ${ht.tau}. Each plane plots as one point (${ht.sn}, ${ht.tau}). In 3D there are three Mohr circles, one for each pair of principal stresses, and every plane plots on them or in the shaded region between them (S9). Here σ1 is vertical, σ2 points north–south, and σ3 east–west.`,task:"Turn the plane and watch its point move. Find where it goes when the plane contains σ2.",visualKind:"friction",controls:["strike","dip"],labOptions:{...pa,showTraction:!0,showPole:!0,showProjections:!0,showSlip:!1},initialLabState:{strike:30,dip:50,sigma1:150},equations:[ug],prompt:"σ2 points north–south, so a plane striking 000° (or 180°) contains it. Where does such a plane plot?",choices:[{id:"big-circle",label:"On the big σ1–σ3 circle",correct:!0,feedback:"Right. A plane that contains σ2 feels only σ1 and σ3, so it lies on their circle. That is the 2D Mohr circle from S6 and B7. Every other plane plots inside the shaded region."},{id:"small-circle",label:"On one of the small circles",correct:!1,feedback:"Set strike to 000° and watch the point: it rides the outer circle. The small circles hold planes that contain σ3 (σ1–σ2 circle) or σ1 (σ2–σ3 circle)."},{id:"axis",label:"On the σn axis, with no shear",correct:!1,feedback:"Only planes perpendicular to a principal stress have no shear. A plane that contains σ2 feels both σ1 and σ3, so it has shear."}]},{id:"slip-tendency",label:"Slip tendency",title:"Slip tendency: will this plane slide?",activeLabel:"Slip tendency",body:`A plane slides when its shear stress reaches the friction line: ${Q(P("τ"),de("≥"),Zi,Mn)}. Divide both sides by ${ht.sn} to get the slip tendency, ${Q(Mi,lt,Ln(P("τ"),Mn))}. On the Mohr diagram, ${ht.ts} is the slope of the dotted line from the origin to the plane’s point. The plane slips when that line is as steep as the green friction line, ${ht.ts} ≥ ${ht.mus} = 0.85.`,task:"Turn the plane until it would slip, then press Slip.",visualKind:"friction",controls:["strike","dip","slip"],labOptions:{...pa,showTraction:!0,showPole:!0,showTsLine:!0,showSlip:!0},initialLabState:{strike:30,dip:50,sigma1:150},goal:{text:"Find a plane that would slip (Ts ≥ 0.85).",check:i=>!!i.slips},equations:[pg],prompt:`A plane carries ${ht.sn} = 60 MPa and ${ht.tau} = 45 MPa. What is its slip tendency ${ht.ts}?`,answer:{value:.75,tolerance:.01,correctFeedback:"Correct: Ts = 45/60 = 0.75. That is below 0.85, so this plane holds.",wrong:[{value:1.33,tolerance:.02,feedback:"That is σn/τ, upside down. Slip tendency is shear over normal: τ/σn."},{value:.85,tolerance:.005,feedback:"0.85 is the friction threshold μs. Compute this plane’s own ratio, τ/σn, and compare it with 0.85."},{value:15,tolerance:.5,feedback:"Slip tendency is a ratio, τ divided by σn, not a difference."}],fallbackFeedback:"Ts = τ/σn: divide 45 by 60."}},{id:"old-or-new",label:"Old plane or new fault?",title:"Reactivate the old plane, or break a new fault?",activeLabel:"Reactivation or a new fault",body:`Now raise ${ht.s1} and watch the circle grow. Two things can happen first: the old plane’s point reaches the green friction line and the plane slides, or the circle touches the gray intact line and a new fault breaks through the rock (B3). Whichever happens at the lower ${ht.s1} wins, and the stress stops rising there. A well-oriented plane slips long before a new fault can form. A badly oriented one may never slip at all: its point can never reach the friction line, however large the circle grows.`,task:`Predict first. Then raise ${ht.s1} and see what happens. Try dips of 65°, 45°, and 30°.`,visualKind:"friction",controls:["sigma1","strike","dip","slip"],labOptions:{...pa,showTraction:!0,showPole:!0,showTsLine:!1,showSlip:!0,stopAtFailure:!0},initialLabState:{strike:0,dip:45,sigma1:60},revealAfterAnswer:["reactivate","newFault","outcome"],equations:[{id:"which-first",html:ee(ze(to,ut("slip")),lt,ce("reactivate","plane-point"))+ee(ze(to,ut("new fault")),lt,ce("newFault","intact"))+ee(ut("first:"),'<mspace width="0.4em"></mspace>',ce("outcome","plane-point")),symbols:[zt.s1,{symbol:Oe(P("τ"),lt,P("C"),Or,P("μ"),Mn),sceneRef:"intact",description:"Intact-rock line: the circle touching it means a new fault"},{symbol:ut("plane"),sceneRef:"plane-point",description:"The old plane’s point: it slips when it reaches the green line"}]}],prompt:"The old plane dips 45° east and contains σ2. As σ1 rises, what happens first?",choices:[{id:"new-fault",label:"A new fault breaks through intact rock",correct:!0,feedback:"Right. A 45° plane needs σ1 = 370 MPa to slip, but intact rock breaks at about 227 MPa. The new fault forms at the Coulomb angle, dipping about 65°. Try a 65° dip: it slips at only 140 MPa. A 30° dip never slips."},{id:"old-slips",label:"The old plane slips",correct:!1,feedback:"Raise σ1 and watch the tan point: at 45° it climbs toward the friction line too slowly, and the circle reaches the intact line first. A weak plane only helps if it is well oriented."},{id:"nothing",label:"Nothing: the rock just gets more stressed",correct:!1,feedback:"The circle keeps growing as σ1 rises, and it must eventually reach one of the two lines. Raise σ1 and see which."}]},{id:"slip-tendency-map",label:"All planes at once",title:"A map of slip tendency for every plane",activeLabel:"Slip tendency on the stereonet",body:`A stereonet shows every plane orientation at once. Each point inside the circle is the pole of one plane: planes dipping gently have poles near the center, and steep planes have poles near the edge. Color each pole by ${ht.ts} and you get a map of which planes are closest to slipping. Hatching marks the planes that would slip. Click or drag on the stereonet to pick a plane, or use the sliders. Change which stress is vertical to see the map follow the stress axes.`,task:"Find the most dangerous planes, then switch regimes and look again.",visualKind:"friction",controls:["regime","strike","dip"],labOptions:{showStereonet:!0,showTraction:!1,showPole:!0,showTsLine:!0,showSlip:!1},initialLabState:{strike:30,dip:50,sigma1:150},equations:[Jd,{id:"dilation",html:ee(ze(P("T"),P("d")),lt,Ln(Oe(to,Ir,Js),Oe(to,Ir,og)),lt,ce("td","normal-stress"))+"<small>Aside: dilation tendency is how easily the plane opens instead. It is 1 for planes perpendicular to σ3, where joints and veins form (B5).</small>",symbols:[zt.s1,zt.sn,zt.s3]}],prompt:"Where are the planes most likely to slip?",choices:[{id:"coulomb",label:"Planes that contain σ2, about 25° from σ1",correct:!0,feedback:"Right. The two hatched patches are the conjugate Coulomb orientations: β = 45° − φ/2 ≈ 25° from σ1 with μ = 0.85, containing σ2. Old planes in those orientations are the first to slip."},{id:"perpendicular",label:"Planes perpendicular to σ1",correct:!1,feedback:"Those planes carry the largest normal stress and no shear at all: Ts = 0. In the normal regime their pole is the center of the net, the darkest spot."},{id:"forty-five",label:"Planes at 45° to σ1",correct:!1,feedback:"The 45° planes carry the most shear, but also a lot of normal stress. Friction favors planes turned toward σ1, about 25° from it, where τ/σn is largest."}]},{id:"rank-faults",label:"Rank the faults",title:"Which mapped fault is closest to slipping?",activeLabel:"Ranking faults by slip tendency",body:`A geologist maps three old faults near a planned reservoir (strike/dip, right-hand rule). The stress is a normal-faulting state with ${ht.s1} vertical and ${ht.s3} east–west. The letters on the stereonet are the faults’ poles, and the same letters on the Mohr diagram are their points. Ranking faults by ${ht.ts} this way is how engineers screen faults near dams, wells, and waste-injection sites.`,task:"Use the stereonet and the Mohr diagram to rank the faults. Select a fault to see its values.",visualKind:"friction",controls:["faults"],labOptions:{showStereonet:!0,showTraction:!1,showPole:!0,showTsLine:!0,showSlip:!1,showMarkers:!0},initialLabState:{strike:0,dip:65,sigma1:130,fault:"A"},mappedFaults:Qd,revealAfterAnswer:["ts"],equations:[Jd],prompt:"Which fault has the highest slip tendency?",choices:[{id:"A",label:"A: 000°/65° E",correct:!0,feedback:"Right: A contains σ2 and lies about 25° from the vertical σ1, the best orientation for slip (Ts ≈ 0.80). C is too gently dipping (Ts ≈ 0.41), and B strikes along σ3, so it carries little shear (Ts ≈ 0.23). None slips yet: all are below 0.85."},{id:"B",label:"B: 090°/60° S",correct:!1,feedback:"B strikes east–west, along σ3. Its point sits low on the Mohr diagram: little shear for its normal stress."},{id:"C",label:"C: 000°/30° E",correct:!1,feedback:"C contains σ2, but it dips only 30°: it is 60° from σ1, far from the best angle. Its pole is well away from the bright patches."}]},{id:"fluid-pressure",label:"Fluids wake faults",title:"Fluid pressure can wake up old faults",activeLabel:"Pore pressure and induced earthquakes",body:`So far the rock was dry. Water in pores and cracks pushes the fault walls apart and cancels part of the normal stress. What matters for friction is the effective normal stress ${ht.snEff} = ${ht.sn} − ${ht.pf} (B4). Pore pressure does not change the shear stress, so the Mohr circles slide left by ${ht.pf} and every point moves toward the friction line. Pumping fluid underground can raise ${ht.pf} enough to make a stable fault slip: waste injection near Denver in the 1960s and wastewater disposal in Oklahoma in the 2010s both set off earthquakes on old faults.`,task:`Raise ${ht.pf} slowly. How much does fault A need before it slips? Watch the hatched area grow on the stereonet.`,visualKind:"friction",controls:["pf","faults","slip"],labOptions:{showStereonet:!0,showTraction:!1,showPole:!0,showTsLine:!0,showSlip:!0,showMarkers:!0,effective:!0},initialLabState:{strike:0,dip:65,sigma1:130,pf:0,fault:"A"},mappedFaults:Qd,equations:[{id:"effective",html:ee(be("normal-stress",Vp),lt,Js,Ir,Zd)+ee(lt,ce("sigmaN","normal-stress"),Ir,ce("pf","pf"),lt,ce("sigmaNEff","normal-stress"),Pa)+ee(Wp,lt,Ln(xl,Oe(Js,Ir,Zd)),lt,ce("ts","ts-line")),symbols:[zt.pf,zt.sn,zt.tau,zt.tsLine]}],prompt:`Pumping raises ${ht.pf} on fault A. What happens to the shear stress ${ht.tau} on the fault?`,choices:[{id:"unchanged",label:"It stays the same",correct:!0,feedback:"Right. Fluid pressure pushes equally in all directions, so it has no shear part: τ is unchanged, and only σn′ drops. Fault A slips once Pf reaches about 3 MPa, a small change for a critically stressed fault."},{id:"increases",label:"It increases",correct:!1,feedback:"A fluid cannot push sideways, so it adds no shear. Watch the τ value while you raise Pf: it does not move. The point slides left, not up."},{id:"decreases",label:"It decreases",correct:!1,feedback:"Pore pressure lowers the normal stress, not the shear stress. The point slides left toward the friction line, which is why faults get weaker."}],final:!0}]},Es=i=>ze(P("σ"),Ke(String(i))),mg=be("sigma-1",Es(1)),gg=be("sigma-2",Es(2)),qp=be("vertical-axis",ze(P("σ"),P("v"))),eu=be("vertical-axis",Qn.k),vg=be("free-surface",ze(P("τ"),ut("ground"))),xg=be("envelope",P("μ")),Xh=be("phi",P("φ")),_g=be("two-theta",Oe(Ke("2"),P("θ"))),Qs=be("beta",P("β")),Oa=be("dip",P("δ")),yg=be("envelope",Oe(P("τ"),de("="),P("C"),de("+"),P("μ"),ze(P("σ"),P("n")))),qt=de("="),Yh=de("−"),Wa=i=>Ke(`${i}°`),we={s1:Q(Es(1)),s2:Q(Es(2)),s3:Q(Es(3)),mu:Q(P("μ")),phi:Q(P("φ")),beta:Q(P("β")),dip:Q(P("δ")),twoTheta:Q(Ke("2"),P("θ")),twoBeta:Q(Ke("2"),P("β")),k:Q(Qn.k),envelope:Q(P("τ"),de("="),P("C"),de("+"),P("μ"),ze(P("σ"),P("n")))},Kt={s1:{symbol:Es(1),sceneRef:"sigma-1",description:"Largest compression: the thick solid arrows, and the right end of the Mohr circle"},s2:{symbol:Es(2),sceneRef:"sigma-2",description:"Intermediate compression: the dashed arrows. Both faults contain this direction"},s3:{symbol:Es(3)},sv:{symbol:ze(P("σ"),P("v")),sceneRef:"vertical-axis",description:"The principal stress that points straight down into the ground"},k:{symbol:Qn.k,sceneRef:"vertical-axis",description:"Unit vector along z, which points down in the NED frame"},tauGround:{symbol:ze(P("τ"),ut("ground")),sceneRef:"free-surface",description:"Shear traction on the ground surface (the top of the block): zero, because air cannot push sideways"},mu:{symbol:P("μ"),sceneRef:"envelope",description:"Coefficient of internal friction: the slope of the Coulomb line"},envelope:{symbol:Oe(P("τ"),de("="),P("C"),de("+"),P("μ"),ze(P("σ"),P("n"))),sceneRef:"envelope",description:"Coulomb failure line (green): the shear stress the rock can bear at each normal stress"},phi:{symbol:P("φ"),sceneRef:"phi",description:"Friction angle: the tilt of the Coulomb line from horizontal"},twoTheta:{symbol:Oe(Ke("2"),P("θ")),sceneRef:"two-theta",description:"Angle on the Mohr circle from σ1 to the fault’s point (orange dashed)"},beta:{symbol:P("β"),sceneRef:"beta",description:"Angle between σ1 and the fault in the block (pink arc)"},dip:{symbol:P("δ"),sceneRef:"dip",description:"Dip: the angle from horizontal down to the fault (violet arc)"}},tu={id:"friction-angle",html:ee(Xh,qt,Di(P("tan"),Oe(de("−"),Ke("1"))),xg,qt,ce("phi","phi")),symbols:[Kt.phi,Kt.mu]},bg={id:"mohr-angle",html:ee(yg)+ee(_g,qt,Wa(90),de("+"),Xh,qt,ce("twoTheta","two-theta")),symbols:[Kt.envelope,Kt.twoTheta]},no={id:"beta-angle",html:ee(Qs,qt,Wa(45),Yh,Ln(Xh,Ke("2")),qt,ce("beta","beta")),symbols:[Kt.beta,Kt.phi]},nu={id:"dip-normal",html:ee(Oa,qt,Wa(90),Yh,Qs,qt,ce("dip","dip"))+`<small>${we.s1} is vertical, and ${we.beta} is measured from it; the dip is measured from horizontal.</small>`,symbols:[Kt.dip,Kt.beta]},Sg={id:"dip-thrust",html:ee(Oa,qt,Qs,qt,ce("dip","dip"))+`<small>${we.s1} is horizontal, so the angle from ${we.s1} is the dip.</small>`,symbols:[Kt.dip,Kt.beta]},Mg={id:"dip-both",html:ee(ze(Oa,ut("normal")),qt,Wa(90),Yh,Qs,qt,ce("dipNormal","dip"))+ee(ze(Oa,ut("thrust")),qt,Qs,qt,ce("dipThrust","dip")),symbols:[Kt.dip,Kt.beta]},iu={id:"vertical-rule",html:ee(qp,qt,ce("verticalName","vertical-axis"))+ee(ut("fault type:"),'<mspace width="0.4em"></mspace>',ce("faultType","fault")),symbols:[Kt.sv]},wg=Object.freeze([{id:"rift",label:"Rift",regime:"normal",examples:"East African Rift, Basin and Range"},{id:"thrust-belt",label:"Fold–thrust belt",regime:"thrust",examples:"Canadian Rockies, Zagros"},{id:"transform",label:"Transform",regime:"strike-slip",examples:"San Andreas, North Anatolian"}]),dr={showMohr:!0,showAxes:!0,showFaults:!0,showConjugate:!0,showAngles:!0,showSlip:!0},Eg={id:"B7",status:"built",steps:[{id:"free-surface",label:"The free surface",title:"At the ground, one principal stress must be vertical",activeLabel:"The free surface",body:`The block is a piece of crust in the geological frame: x points north, y east, and z down. Its top is the ground, a free surface. The air above cannot push sideways on the rock, so the shear traction on the ground is zero. A plane with no shear traction is a principal plane, and its normal is a principal direction. The normal to the ground is vertical (${we.k}), so one principal stress is vertical. Anderson’s theory assumes this stays true to the depths where faults form.`,task:"Hover the symbols in the equation to find the ground and the vertical principal stress in the block. Drag to orbit the block.",visualKind:"anderson",controls:[],labOptions:{showMohr:!1,showAxes:!0,showFaults:!1,showAngles:!1,showSlip:!1},initialLabState:{regime:"normal",mu:.6},equations:[{id:"free-surface",html:ee(vg,qt,Ke("0"),'<mspace width="0.5em"></mspace>',de("⇒"),'<mspace width="0.5em"></mspace>',fe("σ"),eu,qt,qp,eu)+`<small>An equation of the form ${Q(fe("σ"),fe("n"),de("="),P("λ"),fe("n"))} says that ${Q(fe("n"))} is a principal direction (an eigenvector of the stress tensor).</small>`,symbols:[Kt.tauGround,Kt.k,Kt.sv]}],prompt:"One principal stress is vertical. What does that mean for the other two?",choices:[{id:"horizontal",label:"Both are horizontal",correct:!0,feedback:"Right. Principal directions are mutually perpendicular, so the other two lie in the horizontal plane. The only question left is which of σ1, σ2, σ3 is the vertical one."},{id:"vertical",label:"They are vertical too",correct:!1,feedback:"Only one direction can be vertical. The three principal directions are perpendicular to each other."},{id:"anywhere",label:"They can point anywhere",correct:!1,feedback:"They must be perpendicular to the vertical one, so they are confined to the horizontal plane."}]},{id:"three-regimes",label:"Three choices",title:"Three ways to stand the stress axes up",activeLabel:"Which stress is vertical?",body:`With one axis vertical there are only three choices: the vertical stress is ${we.s1}, ${we.s2}, or ${we.s3}. A new shear fault forms on a Coulomb plane (B3). That plane contains ${we.s2} and lies at a small angle ${we.beta}, about 30°, from ${we.s1}. So each fault leans toward whichever axis is ${we.s1}.`,task:`Predict first. Then use the buttons to stand ${we.s2} and then ${we.s3} vertical, and compare the faults.`,visualKind:"anderson",controls:["regime"],labOptions:{showMohr:!1,showAxes:!0,showFaults:!0,faultsAfterAnswer:!0,showConjugate:!0,showAngles:!1,showSlip:!0},initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["faultType"],equations:[iu],prompt:`${we.s1} is vertical: the weight of the rock above is the largest compression. The faults contain ${we.s2} and lie about 30° from ${we.s1}. What kind of faults are they?`,choices:[{id:"normal",label:"Normal faults",correct:!0,feedback:"Right. The planes are steep, and the hanging wall slides down them: normal faults. Now stand σ2 and then σ3 vertical."},{id:"thrust",label:"Thrust faults",correct:!1,feedback:"Thrusts need σ1 horizontal, pushing the hanging wall up a gentle ramp. Here σ1 is vertical, so the planes are steep and the hanging wall moves down."},{id:"strike-slip",label:"Strike-slip faults",correct:!1,feedback:"Strike-slip faults are vertical, which needs σ1 and σ3 both horizontal. Here σ1 is vertical."}]},{id:"normal-regime",label:"σ1 vertical: normal",title:"σ1 vertical: normal faults dip about 60°",activeLabel:"Normal-fault regime",body:`The Mohr circle (right) grows until it touches the Coulomb line ${we.envelope}. The contact point is the plane that breaks first. It sits at ${we.twoTheta} = 90° + ${we.phi} around the circle, where ${we.phi} = tan⁻¹${we.mu} is the friction angle. In the block that plane lies at ${we.beta} = 45° − ${we.phi}/2 from ${we.s1}. With ${we.s1} vertical, ${we.beta} is measured from the vertical. The dip ${we.dip} is measured from the horizontal, so ${we.dip} = 90° − ${we.beta}.`,task:`Hover ${we.phi}, ${we.twoTheta}, ${we.beta}, and ${we.dip} to find each angle in the diagram and the block. Then work out the dip for ${we.mu} = 0.6.`,visualKind:"anderson",controls:["slip"],labOptions:dr,initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["dip"],equations:[tu,bg,no,nu],prompt:`With ${we.mu} = 0.6, what dip ${we.dip} does Anderson predict for the normal faults? (degrees)`,answer:{value:60.5,tolerance:1,correctFeedback:"Correct: φ = tan⁻¹0.6 ≈ 31.0°, β = 45° − 15.5° ≈ 29.5°, and δ = 90° − 29.5° ≈ 60.5°. Press Slip to watch the hanging wall move down the fault.",wrong:[{value:29.5,feedback:"29.5° is β, the angle from σ1 to the fault. σ1 is vertical here, so the dip from horizontal is 90° − β."},{value:31,tolerance:.5,feedback:"31° is φ, the friction angle. Use it to find β = 45° − φ/2, then δ = 90° − β."},{value:45,feedback:"45° is the plane of maximum shear stress. Friction turns the failure plane toward σ1, to 45° − φ/2 from it."},{value:121,tolerance:1.5,feedback:"That is 2θ, the angle on the Mohr circle. Angles on the circle are doubled; halve it to get θ, the angle from σ1 to the fault’s normal."}],fallbackFeedback:"Go one equation at a time: φ = tan⁻¹0.6, then β = 45° − φ/2, then δ = 90° − β."}},{id:"thrust-regime",label:"σ3 vertical: thrust",title:"σ3 vertical: thrust faults dip about 30°",activeLabel:"Thrust-fault regime",body:`Now the smallest compression is vertical and ${we.s1} is horizontal. The Mohr diagram has not changed: the same stresses, the same Coulomb line, the same ${we.beta}. Only the direction of ${we.s1} in the block has changed. Measured from a horizontal ${we.s1}, the angle ${we.beta} is the dip itself. The hanging wall is pushed up a gentle ramp: a reverse fault with a low dip, called a thrust. A common mistake is to picture thrusts under a vertical ${we.s1}, rock squashed from above. Thrusting needs the largest push to be horizontal.`,task:"Predict the dip, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:dr,initialLabState:{regime:"thrust",mu:.6},revealAfterAnswer:["dip"],equations:[no,Sg],prompt:"How steep are the thrust faults, compared with the normal faults in step 3?",choices:[{id:"thirty",label:"About 30°: shallower",correct:!0,feedback:"Right. δ = β ≈ 29.5° for μ = 0.6: the same Coulomb angle, measured from a horizontal σ1 instead of a vertical one."},{id:"sixty",label:"About 60°: the same",correct:!1,feedback:"The Mohr diagram is the same, but β is measured from σ1, which is now horizontal. The dip equals β, not 90° − β."},{id:"forty-five",label:"About 45°",correct:!1,feedback:"45° would need zero friction. With μ > 0 the fault turns toward σ1, which here is horizontal, so it gets shallower than 45°."}]},{id:"strike-slip-regime",label:"σ2 vertical: strike-slip",title:"σ2 vertical: vertical strike-slip faults",activeLabel:"Strike-slip regime",body:`With ${we.s2} vertical, ${we.s1} and ${we.s3} are both horizontal. The faults still contain ${we.s2}, so they are vertical. Seen from above, each one lies ${we.beta} from ${we.s1}, one on each side of it. The pair meets at an acute angle ${we.twoBeta} that ${we.s1} bisects. Slip is horizontal, along the strike. One fault of the pair is right-lateral (dextral) and the other is left-lateral (sinistral).`,task:"Orbit to look down on the block from above. Predict, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:dr,initialLabState:{regime:"strike-slip",mu:.6},equations:[no,{id:"strikes",html:ee(Oa,qt,Wa(90))+ee(ut("strike"),qt,ut("trend of"),'<mspace width="0.3em"></mspace>',mg,de("±"),Qs)+ee(qt,ce("strikes","fault")),symbols:[Kt.dip,Kt.s1,Kt.beta]}],prompt:"The solid fault strikes about 030°, clockwise from σ1. Standing on one side of it, which way does the far side move?",choices:[{id:"sinistral",label:"To the left: sinistral",correct:!0,feedback:"Right. σ1 drives the blocks in the acute angles together, and the blocks in the obtuse angles move out sideways. The fault clockwise of σ1 is sinistral; its conjugate at about 330° is dextral."},{id:"dextral",label:"To the right: dextral",correct:!1,feedback:"That is the conjugate, at about 330°. Press Slip and follow the green arrows: on the 030° fault the far block moves to your left."},{id:"down-dip",label:"Down the dip",correct:!1,feedback:"The faults are vertical and contain the vertical σ2, so there is no up-or-down slip. The motion is horizontal."}]},{id:"vary-friction",label:"Change the friction",title:"Friction sets the angles",activeLabel:"Friction and fault dip",body:`Every step so far used ${we.mu} = 0.6, typical of rock. Drag ${we.mu} and watch the Coulomb line tilt. As ${we.phi} grows, the contact point moves around the circle and ${we.beta} shrinks: the fault turns toward ${we.s1}. Switch regimes to see what that does to each dip. With no friction (${we.mu} = 0), the fault would lie on the plane of maximum shear stress, 45° from ${we.s1}, in every regime.`,task:`Try ${we.mu} = 0.2, 0.6, and 1.0 in the normal and thrust regimes.`,visualKind:"anderson",controls:["regime","mu","slip"],labOptions:dr,initialLabState:{regime:"normal",mu:.6},equations:[tu,no,Mg],prompt:`As ${we.mu} increases from 0.6 toward 1, what happens to the predicted dips?`,choices:[{id:"opposite",label:"Normal faults steepen, thrusts flatten",correct:!0,feedback:"Right. Higher friction makes β smaller. δ = 90° − β grows for normal faults and δ = β shrinks for thrusts: both turn toward σ1."},{id:"both-steepen",label:"Both get steeper",correct:!1,feedback:"Drag μ in the thrust regime and watch δ: it follows β, which shrinks as friction grows."},{id:"fixed",label:"Neither changes",correct:!1,feedback:"60° and 30° belong to μ ≈ 0.6. β = 45° − φ/2 depends on friction, so the dips do too."}]},{id:"limits",label:"Limits of the theory",title:"When real faults disagree with Anderson",activeLabel:"Assumptions and limits",body:"Anderson’s predictions rest on three assumptions: a new fault breaks intact rock that is equally strong in every direction; the ground is flat and horizontal, so one principal stress is vertical; and slip is small, so the fault keeps the orientation it formed with. Real faults often break these. Rock already contains weak planes such as bedding and older faults, and a weak plane at the “wrong” angle can slip before a new fault forms (B6). Normal faults in rifts rotate like tilting dominoes as they slip, so their dips decrease. Steep topography and layers of different stiffness tilt the stress axes away from vertical.",task:"Keep the normal regime and think about what could make a real fault shallower than the prediction.",visualKind:"anderson",controls:["regime","mu","slip"],labOptions:dr,initialLabState:{regime:"normal",mu:.6},equations:[nu],prompt:"A rift contains many normal faults dipping 35–45°, much shallower than the predicted 60°. What is the best explanation?",choices:[{id:"rotated",label:"They rotated during slip, or reused older weak planes",correct:!0,feedback:"Right. Anderson predicts the angle at which a fault forms in intact rock. Rotation after formation, and reactivation of weaker planes, both break that assumption."},{id:"horizontal-s1",label:"σ1 was horizontal when they formed",correct:!1,feedback:"With σ1 horizontal the faults would be thrusts or strike-slip faults, not normal faults."},{id:"high-friction",label:"Friction was very high",correct:!1,feedback:"Higher friction makes normal faults steeper, not shallower (step 6)."}]},{id:"infer-regime",label:"Read the stress",title:"Read the stress from the faults",activeLabel:"From faults back to stress",body:`In the field the reasoning runs backward: you map the faults and their slip, then infer the stress. The line where the conjugate faults intersect is ${we.s2}, ${we.s1} bisects the acute angle ${we.twoBeta} between the faults, and ${we.s3} bisects the obtuse angle. The stress arrows are hidden until you answer.`,task:"Orbit the block and press Slip to see the sense of motion.",visualKind:"anderson",controls:["slip"],labOptio
