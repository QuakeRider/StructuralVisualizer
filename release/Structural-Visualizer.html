el to the tensile direction."},{id:"unchanged",label:"No change",correct:!1,feedback:"The tensile component produces visible extension."}],responseOverride:"A stress state combines the normal and shear components acting at one point."},{id:"open-stress-explorer",label:"Open the laboratory",title:"Construct and compare complete stress states",activeLabel:"Stress-state laboratory",body:"Use Explore to compare the reference states and edit tensor components. Keep the chain of reasoning visible: force, traction on a surface, and finally the stress state at a point.",task:"Choose two states with similar magnitudes and explain why their block responses differ.",visualKind:"stress-state",presetId:"biaxial-tension-compression",magnitude:26,vectors:!0,outline:!0,grid:!0,equations:[fh],responseOverride:"Continue into the open stress-state laboratory and build your own comparisons.",final:!0}]},Li=i=>te(J("σ"),ze(String(i))),Hf=ie("sigma-1",Li(1)),Vf=ie("sigma-2",Li(2)),Wu=ie("vertical-axis",te(J("σ"),J("v"))),ph=ie("vertical-axis",Sn.k),Gf=ie("free-surface",te(J("τ"),gn("ground"))),Wf=ie("envelope",J("μ")),gc=ie("phi",J("φ")),$f=ie("two-theta",ye(ze("2"),J("θ"))),as=ie("beta",J("β")),wr=ie("dip",J("δ")),qf=ie("envelope",ye(J("τ"),Dt("="),J("C"),Dt("+"),J("μ"),te(J("σ"),J("n")))),Re=Dt("="),vc=Dt("−"),Ur=i=>ze(`${i}°`),mt={s1:Ht(Li(1)),s2:Ht(Li(2)),s3:Ht(Li(3)),mu:Ht(J("μ")),phi:Ht(J("φ")),beta:Ht(J("β")),dip:Ht(J("δ")),twoTheta:Ht(ze("2"),J("θ")),twoBeta:Ht(ze("2"),J("β")),k:Ht(Sn.k),envelope:Ht(J("τ"),Dt("="),J("C"),Dt("+"),J("μ"),te(J("σ"),J("n")))},De={s1:{symbol:Li(1),sceneRef:"sigma-1",description:"Largest compression: the thick solid arrows, and the right end of the Mohr circle"},s2:{symbol:Li(2),sceneRef:"sigma-2",description:"Intermediate compression: the dashed arrows. Both faults contain this direction"},s3:{symbol:Li(3)},sv:{symbol:te(J("σ"),J("v")),sceneRef:"vertical-axis",description:"The principal stress that points straight down into the ground"},k:{symbol:Sn.k,sceneRef:"vertical-axis",description:"Unit vector along z, which points down in the NED frame"},tauGround:{symbol:te(J("τ"),gn("ground")),sceneRef:"free-surface",description:"Shear traction on the ground surface (the top of the block): zero, because air cannot push sideways"},mu:{symbol:J("μ"),sceneRef:"envelope",description:"Coefficient of internal friction: the slope of the Coulomb line"},envelope:{symbol:ye(J("τ"),Dt("="),J("C"),Dt("+"),J("μ"),te(J("σ"),J("n"))),sceneRef:"envelope",description:"Coulomb failure line (green): the shear stress the rock can bear at each normal stress"},phi:{symbol:J("φ"),sceneRef:"phi",description:"Friction angle: the tilt of the Coulomb line from horizontal"},twoTheta:{symbol:ye(ze("2"),J("θ")),sceneRef:"two-theta",description:"Angle on the Mohr circle from σ1 to the fault’s point (orange dashed)"},beta:{symbol:J("β"),sceneRef:"beta",description:"Angle between σ1 and the fault in the block (pink arc)"},dip:{symbol:J("δ"),sceneRef:"dip",description:"Dip: the angle from horizontal down to the fault (violet arc)"}},mh={id:"friction-angle",html:zt(gc,Re,Ja(J("tan"),ye(Dt("−"),ze("1"))),Wf,Re,Zt("phi","phi")),symbols:[De.phi,De.mu]},Xf={id:"mohr-angle",html:zt(qf)+zt($f,Re,Ur(90),Dt("+"),gc,Re,Zt("twoTheta","two-theta")),symbols:[De.envelope,De.twoTheta]},Gr={id:"beta-angle",html:zt(as,Re,Ur(45),vc,Er(gc,ze("2")),Re,Zt("beta","beta")),symbols:[De.beta,De.phi]},gh={id:"dip-normal",html:zt(wr,Re,Ur(90),vc,as,Re,Zt("dip","dip"))+`<small>${mt.s1} is vertical, and ${mt.beta} is measured from it; the dip is measured from horizontal.</small>`,symbols:[De.dip,De.beta]},Yf={id:"dip-thrust",html:zt(wr,Re,as,Re,Zt("dip","dip"))+`<small>${mt.s1} is horizontal, so the angle from ${mt.s1} is the dip.</small>`,symbols:[De.dip,De.beta]},jf={id:"dip-both",html:zt(te(wr,gn("normal")),Re,Ur(90),vc,as,Re,Zt("dipNormal","dip"))+zt(te(wr,gn("thrust")),Re,as,Re,Zt("dipThrust","dip")),symbols:[De.dip,De.beta]},vh={id:"vertical-rule",html:zt(Wu,Re,Zt("verticalName","vertical-axis"))+zt(gn("fault type:"),'<mspace width="0.4em"></mspace>',Zt("faultType","fault")),symbols:[De.sv]},Kf=Object.freeze([{id:"rift",label:"Rift",regime:"normal",examples:"East African Rift, Basin and Range"},{id:"thrust-belt",label:"Fold–thrust belt",regime:"thrust",examples:"Canadian Rockies, Zagros"},{id:"transform",label:"Transform",regime:"strike-slip",examples:"San Andreas, North Anatolian"}]),ms={showMohr:!0,showAxes:!0,showFaults:!0,showConjugate:!0,showAngles:!0,showSlip:!0},Zf={id:"B7",status:"built",steps:[{id:"free-surface",label:"The free surface",title:"At the ground, one principal stress must be vertical",activeLabel:"The free surface",body:`The block is a piece of crust in the geological frame: x points north, y east, and z down. Its top is the ground, a free surface. The air above cannot push sideways on the rock, so the shear traction on the ground is zero. A plane with no shear traction is a principal plane, and its normal is a principal direction. The normal to the ground is vertical (${mt.k}), so one principal stress is vertical. Anderson’s theory assumes this stays true to the depths where faults form.`,task:"Hover the symbols in the equation to find the ground and the vertical principal stress in the block. Drag to orbit the block.",visualKind:"anderson",controls:[],labOptions:{showMohr:!1,showAxes:!0,showFaults:!1,showAngles:!1,showSlip:!1},initialLabState:{regime:"normal",mu:.6},equations:[{id:"free-surface",html:zt(Gf,Re,ze("0"),'<mspace width="0.5em"></mspace>',Dt("⇒"),'<mspace width="0.5em"></mspace>',Ct("σ"),ph,Re,Wu,ph)+`<small>An equation of the form ${Ht(Ct("σ"),Ct("n"),Dt("="),J("λ"),Ct("n"))} says that ${Ht(Ct("n"))} is a principal direction (an eigenvector of the stress tensor).</small>`,symbols:[De.tauGround,De.k,De.sv]}],prompt:"One principal stress is vertical. What does that mean for the other two?",choices:[{id:"horizontal",label:"Both are horizontal",correct:!0,feedback:"Right. Principal directions are mutually perpendicular, so the other two lie in the horizontal plane. The only question left is which of σ1, σ2, σ3 is the vertical one."},{id:"vertical",label:"They are vertical too",correct:!1,feedback:"Only one direction can be vertical. The three principal directions are perpendicular to each other."},{id:"anywhere",label:"They can point anywhere",correct:!1,feedback:"They must be perpendicular to the vertical one, so they are confined to the horizontal plane."}]},{id:"three-regimes",label:"Three choices",title:"Three ways to stand the stress axes up",activeLabel:"Which stress is vertical?",body:`With one axis vertical there are only three choices: the vertical stress is ${mt.s1}, ${mt.s2}, or ${mt.s3}. A new shear fault forms on a Coulomb plane (B3). That plane contains ${mt.s2} and lies at a small angle ${mt.beta}, about 30°, from ${mt.s1}. So each fault leans toward whichever axis is ${mt.s1}.`,task:`Predict first. Then use the buttons to stand ${mt.s2} and then ${mt.s3} vertical, and compare the faults.`,visualKind:"anderson",controls:["regime"],labOptions:{showMohr:!1,showAxes:!0,showFaults:!0,faultsAfterAnswer:!0,showConjugate:!0,showAngles:!1,showSlip:!0},initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["faultType"],equations:[vh],prompt:`${mt.s1} is vertical: the weight of the rock above is the largest compression. The faults contain ${mt.s2} and lie about 30° from ${mt.s1}. What kind of faults are they?`,choices:[{id:"normal",label:"Normal faults",correct:!0,feedback:"Right. The planes are steep, and the hanging wall slides down them: normal faults. Now stand σ2 and then σ3 vertical."},{id:"thrust",label:"Thrust faults",correct:!1,feedback:"Thrusts need σ1 horizontal, pushing the hanging wall up a gentle ramp. Here σ1 is vertical, so the planes are steep and the hanging wall moves down."},{id:"strike-slip",label:"Strike-slip faults",correct:!1,feedback:"Strike-slip faults are vertical, which needs σ1 and σ3 both horizontal. Here σ1 is vertical."}]},{id:"normal-regime",label:"σ1 vertical: normal",title:"σ1 vertical: normal faults dip about 60°",activeLabel:"Normal-fault regime",body:`The Mohr circle (right) grows until it touches the Coulomb line ${mt.envelope}. The contact point is the plane that breaks first. It sits at ${mt.twoTheta} = 90° + ${mt.phi} around the circle, where ${mt.phi} = tan⁻¹${mt.mu} is the friction angle. In the block that plane lies at ${mt.beta} = 45° − ${mt.phi}/2 from ${mt.s1}. With ${mt.s1} vertical, ${mt.beta} is measured from the vertical. The dip ${mt.dip} is measured from the horizontal, so ${mt.dip} = 90° − ${mt.beta}.`,task:`Hover ${mt.phi}, ${mt.twoTheta}, ${mt.beta}, and ${mt.dip} to find each angle in the diagram and the block. Then work out the dip for ${mt.mu} = 0.6.`,visualKind:"anderson",controls:["slip"],labOptions:ms,initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["dip"],equations:[mh,Xf,Gr,gh],prompt:`With ${mt.mu} = 0.6, what dip ${mt.dip} does Anderson predict for the normal faults? (degrees)`,answer:{value:60.5,tolerance:1,correctFeedback:"Correct: φ = tan⁻¹0.6 ≈ 31.0°, β = 45° − 15.5° ≈ 29.5°, and δ = 90° − 29.5° ≈ 60.5°. Press Slip to watch the hanging wall move down the fault.",wrong:[{value:29.5,feedback:"29.5° is β, the angle from σ1 to the fault. σ1 is vertical here, so the dip from horizontal is 90° − β."},{value:31,tolerance:.5,feedback:"31° is φ, the friction angle. Use it to find β = 45° − φ/2, then δ = 90° − β."},{value:45,feedback:"45° is the plane of maximum shear stress. Friction turns the failure plane toward σ1, to 45° − φ/2 from it."},{value:121,tolerance:1.5,feedback:"That is 2θ, the angle on the Mohr circle. Angles on the circle are doubled; halve it to get θ, the angle from σ1 to the fault’s normal."}],fallbackFeedback:"Go one equation at a time: φ = tan⁻¹0.6, then β = 45° − φ/2, then δ = 90° − β."}},{id:"thrust-regime",label:"σ3 vertical: thrust",title:"σ3 vertical: thrust faults dip about 30°",activeLabel:"Thrust-fault regime",body:`Now the smallest compression is vertical and ${mt.s1} is horizontal. The Mohr diagram has not changed: the same stresses, the same Coulomb line, the same ${mt.beta}. Only the direction of ${mt.s1} in the block has changed. Measured from a horizontal ${mt.s1}, the angle ${mt.beta} is the dip itself. The hanging wall is pushed up a gentle ramp: a reverse fault with a low dip, called a thrust. A common mistake is to picture thrusts under a vertical ${mt.s1}, rock squashed from above. Thrusting needs the largest push to be horizontal.`,task:"Predict the dip, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:ms,initialLabState:{regime:"thrust",mu:.6},revealAfterAnswer:["dip"],equations:[Gr,Yf],prompt:"How steep are the thrust faults, compared with the normal faults in step 3?",choices:[{id:"thirty",label:"About 30°: shallower",correct:!0,feedback:"Right. δ = β ≈ 29.5° for μ = 0.6: the same Coulomb angle, measured from a horizontal σ1 instead of a vertical one."},{id:"sixty",label:"About 60°: the same",correct:!1,feedback:"The Mohr diagram is the same, but β is measured from σ1, which is now horizontal. The dip equals β, not 90° − β."},{id:"forty-five",label:"About 45°",correct:!1,feedback:"45° would need zero friction. With μ > 0 the fault turns toward σ1, which here is horizontal, so it gets shallower than 45°."}]},{id:"strike-slip-regime",label:"σ2 vertical: strike-slip",title:"σ2 vertical: vertical strike-slip faults",activeLabel:"Strike-slip regime",body:`With ${mt.s2} vertical, ${mt.s1} and ${mt.s3} are both horizontal. The faults still contain ${mt.s2}, so they are vertical. Seen from above, each one lies ${mt.beta} from ${mt.s1}, one on each side of it. The pair meets at an acute angle ${mt.twoBeta} that ${mt.s1} bisects. Slip is horizontal, along the strike. One fault of the pair is right-lateral (dextral) and the other is left-lateral (sinistral).`,task:"Orbit to look down on the block from above. Predict, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:ms,initialLabState:{regime:"strike-slip",mu:.6},equations:[Gr,{id:"strikes",html:zt(wr,Re,Ur(90))+zt(gn("strike"),Re,gn("trend of"),'<mspace width="0.3em"></mspace>',Hf,Dt("±"),as)+zt(Re,Zt("strikes","fault")),symbols:[De.dip,De.s1,De.beta]}],prompt:"The solid fault strikes about 030°, clockwise from σ1. Standing on one side of it, which way does the far side move?",choices:[{id:"sinistral",label:"To the left: sinistral",correct:!0,feedback:"Right. σ1 drives the blocks in the acute angles together, and the blocks in the obtuse angles move out sideways. The fault clockwise of σ1 is sinistral; its conjugate at about 330° is dextral."},{id:"dextral",label:"To the right: dextral",correct:!1,feedback:"That is the conjugate, at about 330°. Press Slip and follow the green arrows: on the 030° fault the far block moves to your left."},{id:"down-dip",label:"Down the dip",correct:!1,feedback:"The faults are vertical and contain the vertical σ2, so there is no up-or-down slip. The motion is horizontal."}]},{id:"vary-friction",label:"Change the friction",title:"Friction sets the angles",activeLabel:"Friction and fault dip",body:`Every step so far used ${mt.mu} = 0.6, typical of rock. Drag ${mt.mu} and watch the Coulomb line tilt. As ${mt.phi} grows, the contact point moves around the circle and ${mt.beta} shrinks: the fault turns toward ${mt.s1}. Switch regimes to see what that does to each dip. With no friction (${mt.mu} = 0), the fault would lie on the plane of maximum shear stress, 45° from ${mt.s1}, in every regime.`,task:`Try ${mt.mu} = 0.2, 0.6, and 1.0 in the normal and thrust regimes.`,visualKind:"anderson",controls:["regime","mu","slip"],labOptions:ms,initialLabState:{regime:"normal",mu:.6},equations:[mh,Gr,jf],prompt:`As ${mt.mu} increases from 0.6 toward 1, what happens to the predicted dips?`,choices:[{id:"opposite",label:"Normal faults steepen, thrusts flatten",correct:!0,feedback:"Right. Higher friction makes β smaller. δ = 90° − β grows for normal faults and δ = β shrinks for thrusts: both turn toward σ1."},{id:"both-steepen",label:"Both get steeper",correct:!1,feedback:"Drag μ in the thrust regime and watch δ: it follows β, which shrinks as friction grows."},{id:"fixed",label:"Neither changes",correct:!1,feedback:"60° and 30° belong to μ ≈ 0.6. β = 45° − φ/2 depends on friction, so the dips do too."}]},{id:"limits",label:"Limits of the theory",title:"When real faults disagree with Anderson",activeLabel:"Assumptions and limits",body:"Anderson’s predictions rest on three assumptions: a new fault breaks intact rock that is equally strong in every direction; the ground is flat and horizontal, so one principal stress is vertical; and slip is small, so the fault keeps the orientation it formed with. Real faults often break these. Rock already contains weak planes such as bedding and older faults, and a weak plane at the “wrong” angle can slip before a new fault forms (B6). Normal faults in rifts rotate like tilting dominoes as they slip, so their dips decrease. Steep topography and layers of different stiffness tilt the stress axes away from vertical.",task:"Keep the normal regime and think about what could make a real fault shallower than the prediction.",visualKind:"anderson",controls:["regime","mu","slip"],labOptions:ms,initialLabState:{regime:"normal",mu:.6},equations:[gh],prompt:"A rift contains many normal faults dipping 35–45°, much shallower than the predicted 60°. What is the best explanation?",choices:[{id:"rotated",label:"They rotated during slip, or reused older weak planes",correct:!0,feedback:"Right. Anderson predicts the angle at which a fault forms in intact rock. Rotation after formation, and reactivation of weaker planes, both break that assumption."},{id:"horizontal-s1",label:"σ1 was horizontal when they formed",correct:!1,feedback:"With σ1 horizontal the faults would be thrusts or strike-slip faults, not normal faults."},{id:"high-friction",label:"Friction was very high",correct:
