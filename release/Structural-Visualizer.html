sured counterclockwise. Its tip always lies on the circle of radius 1. The arrow and its two components form a right triangle whose longest side is 1. By the definitions of cosine and sine, the side along x is cos ${le.alpha} and the side along y is sin ${le.alpha}. So the components of a unit vector are simply (cos ${le.alpha}, sin ${le.alpha}).`,task:"Drag the tip around the circle, or use the angle slider. Watch the signs of the components change from quadrant to quadrant.",visualKind:"vector-lab",dimension:2,controls:["angle"],labOptions:{...Ur,polar:!0,fixedLength:1,showAngle:!0,showUnitCircle:!0,view:"close"},initialLabState:{v:sn(1,40)},equations:[{id:"unit-components",html:oe(wp,Ge,rn(Xn(Ai,Ri)),Ge,rn(Xn(Ci(Un),lr(Un))))+oe(Ge,ge("v","vector"))+oe(Un,Ge,ge("alpha","angle-alpha")),symbols:[it.vhatUnit,it.vx,it.vy,it.alpha]},{id:"unit-pythagoras",html:oe(_a(Un),On,Ze(pi(N("sin"),lt("2")),Un),Ge,lt("1"))+oe(ge("vx2","comp-x"),On,ge("vy2","comp-y"),Ge,ge("sumSquares","vector"))+xa("Pythagoras on a triangle whose longest side is 1."),symbols:[]}],prompt:`Drag the tip to ${le.alpha} = 120°. Which component is negative?`,choices:[{id:"vx",label:`${le.vx}`,correct:!0,feedback:"Right: cos 120° = −0.5. Past 90° the tip is left of the y axis, so the x component is negative, while sin 120° ≈ 0.87 is still positive."},{id:"vy",label:`${le.vy}`,correct:!1,feedback:"sin α stays positive from 0° to 180°, because the tip is above the x axis. Drag to 120° and look at the blue arrow."},{id:"both",label:"Both",correct:!1,feedback:"Both are negative only in the third quadrant, from 180° to 270°. At 120° the tip is up and to the left."}]},{id:"length-and-angle",label:"Length and angle",title:"Components from a length and an angle",activeLabel:"Components from length and angle",body:`A vector of any length is a unit vector stretched by that length, so both components stretch too: ${le.vx} = ${le.absv} cos ${le.alpha} and ${le.vy} = ${le.absv} sin ${le.alpha}. This is the step you take whenever a measurement gives a size and a direction, such as a force of 5 kN pushing 30° above the horizontal. Set your calculator to degrees: cos 30 in radians is a completely different number.`,task:"Answer the question first. Then change the length and the angle and watch both components follow.",visualKind:"vector-lab",dimension:2,controls:["length","angle"],labOptions:{...Ur,polar:!0,showAngle:!0},initialLabState:{v:sn(5,30)},revealAfterAnswer:["vx","vy"],equations:[{id:"polar-x",html:oe(Ai,Ge,Fs,Ci(Un),Ge,ge("vxSub","comp-x"),Ge,ge("vx","comp-x")),symbols:[it.vx,it.absv,it.alpha]},{id:"polar-y",html:oe(Ri,Ge,Fs,lr(Un),Ge,ge("vySub","comp-y"),Ge,ge("vy","comp-y")),symbols:[it.vy]}],prompt:`A vector has length 5 and points 30° above the +x axis. What is ${le.vx}?`,answer:{value:4.33,tolerance:.02,correctFeedback:"Correct: 5 cos 30° = 5 × 0.866 ≈ 4.33. The x component goes with cosine because it is the side next to the angle.",wrong:[{value:2.5,feedback:"That is 5 sin 30°, the y component. The x component is the side next to the angle, so it goes with cosine."},{value:.87,tolerance:.01,feedback:"0.866 is cos 30° by itself. Multiply by the length: vx = 5 × 0.866."},{value:.77,tolerance:.01,feedback:"Your calculator is in radians: 5 cos(30 radians) ≈ 0.77. Switch it to degrees."},{value:5,feedback:"5 is the whole length. Only a vector lying along the x axis has vx = |v|."}],fallbackFeedback:"Use vx = |v| cos α with |v| = 5 and α = 30°, with the calculator in degrees."}},{id:"angle-from-components",label:"Back to the angle",title:"From components back to the angle: check the quadrant",activeLabel:"The angle from components",body:`Going backward, tan ${le.alpha} = ${le.vy}/${le.vx}. But the ratio cannot tell opposite directions apart: (3, 3) and (−3, −3) give the same ratio. A calculator’s tan⁻¹ key always answers between −90° and 90°, so for any vector pointing left (${le.vx} < 0) it is off by 180°. The fix is to look at the signs of the components: if ${le.vx} is negative, add 180°; if the result is still negative, add 360°. Programs do this in one step with a function called atan2.`,task:"Predict the angle first. Then drag the tip into each quadrant and compare the calculator’s answer with the true angle.",visualKind:"vector-lab",dimension:2,controls:["components"],labOptions:{...Ur,showAngle:!0},initialLabState:{v:{x:-3,y:3,z:0}},revealAfterAnswer:["atanNaive","alpha"],equations:[{id:"tan-ratio",html:oe(N("tan"),Un,Ge,oi(Ri,Ai),Ge,ge("tanRatio","vector")),symbols:[it.alpha,it.vx,it.vy]},{id:"quadrant",html:oe(Cp,rn(oi(Ri,Ai)),Ge,ge("atanNaive"))+xa("What the calculator’s tan⁻¹ key returns.")+oe(Un,Ge,ge("alpha","angle-alpha"))+xa("The true angle, found with the quadrant (atan2)."),symbols:[]}],prompt:`What is ${le.alpha} for ${le.v} = (−3, 3), measured counterclockwise from +x? (degrees)`,answer:{value:135,tolerance:1,correctFeedback:"Correct. tan⁻¹(3/−3) gives −45°, but the vector points up and to the left, into the second quadrant, so α = −45° + 180° = 135°.",wrong:[{value:-45,feedback:"−45° is what tan⁻¹(3/−3) returns, but that direction points down and to the right. This vector points up and to the left: add 180°."},{value:45,feedback:"45° points up and to the right, the direction of (3, 3). Here vx is negative, so the vector points left."},{value:315,feedback:"315° is the same direction as −45°: down and to the right. That is (3, −3)."},{value:225,feedback:"225° points down and to the left, the direction of (−3, −3). Here vy is positive."}],fallbackFeedback:"Find tan⁻¹(vy/vx), then use the signs of vx and vy to put the angle in the right quadrant."}},{id:"direction-angles-3d",label:"Direction angles in 3D",title:"In 3D: one angle to each axis",activeLabel:"Direction angles and cosines",body:`In 3D a single angle is not enough. Instead, measure the angle from the vector to each axis: ${le.alpha} to x, ${le.beta} to y, and ${le.gamma} to z. These are the direction angles. The same right-triangle reasoning gives ${le.vx} = ${le.absv} cos ${le.alpha}, ${le.vy} = ${le.absv} cos ${le.beta}, and ${le.vz} = ${le.absv} cos ${le.gamma}. Divide by ${le.absv}: the direction cosines are exactly the components of the unit vector ${le.vhat}. Because ${le.vhat} has length 1, their squares add to 1. In the flat x–y plane, ${le.beta} = 90° − ${le.alpha}, so cos ${le.beta} = sin ${le.alpha}: the 2D formulas are a special case.`,task:"Drag the tip (Shift + drag moves it up or down). The three cosines change, but the sum of their squares stays 1.",visualKind:"vector-lab",dimension:3,controls:["components"],labOptions:{...Ur,showDirectionAngles:!0,showUnit:!0},initialLabState:{v:{x:2,y:3,z:6}},equations:[{id:"direction-cosines",html:oe(Ep,Ge,oi(Mp,Fs),Ge,rn(Xn(Ci(Un),Ci(sl),Ci(rl))))+oe(Ge,ge("unit","unit-vector"))+oe(rn(Xn(Un,sl,rl)),Ge,ge("directionAngles")),symbols:[it.vhat,it.alpha,it.beta,it.gamma]},{id:"cosine-identity",html:oe(_a(Un),On,_a(sl),On,_a(rl),Ge,lt("1"))+oe(ge("cosSquares"),Ge,ge("cosSquaresSum")),symbols:[]}],prompt:`Point ${le.v} straight up the z axis. What are its direction angles (${le.alpha}, ${le.beta}, ${le.gamma})?`,choices:[{id:"up",label:"(90°, 90°, 0°)",correct:!0,feedback:"Right. The vector lies along z, so it makes 0° with z and is perpendicular (90°) to x and y. The direction cosines are (0, 0, 1): the unit vector k̂."},{id:"flat",label:"(0°, 0°, 90°)",correct:!1,feedback:"A vector cannot make 0° with both x and y at once. Along z it is perpendicular to x and y, so those angles are 90°."},{id:"zeros",label:"(0°, 0°, 0°)",correct:!1,feedback:"The cosines would all be 1, and 1² + 1² + 1² = 3, not 1. A vector can lie along only one axis at a time."}]},{id:"rotate-axes",label:"Turn the axes",title:"Turn the axes, not the vector",activeLabel:"Rotating the axes",body:`Now keep the arrow still and turn the coordinate axes by an angle ${le.theta}. The turned axes are ${le.xp} and ${le.yp} (dashed). The arrow does not move. Only its description changes: its components in the new axes, ${le.vxp} and ${le.vyp}, are its projections onto ${le.xp} and ${le.yp}. Each new component collects a piece of both old ones, which is what the two equations say.`,task:`Predict first, then drag ${le.theta} to 30°.`,visualKind:"vector-lab",dimension:2,controls:["theta"],labOptions:ol,initialLabState:{v:{x:4,y:2,z:0},theta:0},revealAfterAnswer:["vxp","vyp"],equations:[Pp,Lp,{id:"theta",html:oe(Pi,Ge,ge("theta","angle-theta")),symbols:[it.theta]}],prompt:`You will turn the axes 30° counterclockwise. Will ${le.vxp} be larger or smaller than ${le.vx} = 4?`,choices:[{id:"larger",label:"Larger",correct:!0,feedback:"Right: v′x = 4 cos 30° + 2 sin 30° ≈ 4.46. The arrow points about 27° above x, so turning x′ by 30° swings it almost onto the arrow, and more of the arrow lies along it."},{id:"smaller",label:"Smaller",correct:!1,feedback:"Turning the axes counterclockwise moves x′ toward the arrow, which points about 27° above x. The projection onto x′ grows. Drag θ and watch the dashed blue arrow."},{id:"same",label:"The same",correct:!1,feedback:"The arrow does not change, but its projection onto a different axis does. Only its length stays the same."}]},{id:"same-arrow",label:"Same arrow, new numbers",title:"Same arrow, different description",activeLabel:"One arrow, many descriptions",body:`Every choice of axes gives different components, but they all describe one arrow. Its length is the same in every frame. Turning about the z axis leaves the z component alone: ${le.vz} does not change. One frame is special: turn ${le.xp} until it lies under the arrow, and the horizontal part of the vector is a single component, ${le.vyp} = 0. Stress uses the same idea. In S5 and S8 you will turn the axes until the shear components of stress vanish, and those special axes are the principal stress directions.`,task:"Reach the goal, then orbit the view: the arrow never moved.",visualKind:"vector-lab",dimension:3,controls:["theta","components"],labOptions:ol,initialLabState:{v:{x:4,y:2,z:3},theta:0},goal:{text:`Turn the axes until ${le.vyp} = 0 with ${le.vxp} positive.`,check:i=>Math.abs(i.primed.y)<.05&&i.primed.x>0},equations:[{id:"invariant",html:oe(Fs,Ge,xr(zs(Ai),On,zs(Ri),On,zs(Ir)))+oe(Ge,xr(zs(lo),On,zs(ec),On,zs(Ir)),Ge,ge("magnitude","vector")),symbols:[it.absv,it.vx,it.vy,it.vz,it.vxp,it.vyp]},{id:"both-frames",html:oe(rn(Xn(Ai,Ri,Ir)),Ge,ge("v","vector"))+oe(rn(Xn(lo,ec,Ir)),Ge,ge("primed"))+oe(Pi,Ge,ge("theta","angle-theta")),symbols:[it.theta]}]},{id:"double-angle",label:"Preview: double angles",title:"A preview: squares and products of sine and cosine",activeLabel:"Double-angle preview",body:`Project something twice and you get products such as cos²${le.theta} and sin ${le.theta} cos ${le.theta}. Stress does exactly that. In S2 a force is projected onto a tilted plane and spread over an area that grows as the plane tilts, which gives cos²${le.theta}. In S5 the shear stress on a tilted plane goes as sin ${le.theta} cos ${le.theta}. Both can be rewritten with the double angle 2${le.theta}, which is why the Mohr circle (S6) uses 2${le.theta}. You don’t need to derive these now; notice their shapes.`,task:`Sweep ${le.theta} from 0° to 180° and follow the dots on both curves.`,visualKind:"vector-lab",dimension:2,controls:["theta"],labOptions:{...ol,showComponents:!1,showUnitCircle:!0,view:"close",plot:"double-angle"},initialLabState:{v:{x:1,y:0,z:0},theta:30},equations:[{id:"cos-squared",html:oe(Ap,Ge,Vh,rn(lt("1"),On,N("cos"),lt("2"),N("θ")),Ge,ge("cos2","curve-cos2")),symbols:[it.cos2]},{id:"sin-cos",html:oe(Rp,Ge,Vh,N("sin"),lt("2"),N("θ"),Ge,ge("sincos","curve-sincos"))+oe(Pi,Ge,ge("theta","angle-theta")),symbols:[it.sincos,it.theta]}],prompt:`At which angle is sin ${le.theta} cos ${le.theta} largest?`,choices:[{id:"45",label:"45°",correct:!0,feedback:"Right: ½ sin 2θ is largest when 2θ = 90°. This is why the largest shear stress acts on planes at 45° to the principal stresses (S5)."},{id:"90",label:"90°",correct:!1,feedback:"At 90°, cos θ = 0, so the product is 0. It peaks halfway, where 2θ = 90°."},{id:"0",label:"0°",correct:!1,feedback:"At 0°, sin θ = 0, so the product is 0. It peaks at 45°, where 2θ = 90°."}]},{id:"where-trig-shows-up",label:"Trig in geology",title:"Where this shows up in geology",activeLabel:"Trigonometry in structural geology",body:`Field measurements are angles, and these relations turn them into vectors. A line in the field, such as a fold hinge, is recorded by its compass direction and by how steeply it plunges. Here z still points up, so its steepness is the angle ${le.eps} between the line and the floor: ${le.vz} = ${le.absv} sin ${le.eps} and its floor shadow is ${le.absv} cos ${le.eps}. O1 turns this into trend and plunge, with z pointing down. And whenever a plane is tilted inside a stressed rock (S5), the stress is described in axes turned to match the plane, with the rotation equations from step 5.`,task:"Pick each example.",visualKind:"vector-lab",dimension:3,controls:["context"],contexts:ll,labOptions:{...Ur,draggable:[]},initialLabState:{v:ll[0].vector,context:ll[0].id},equations:[{id:"elevation",html:oe(Ir,Ge,Fs,lr(al),Ge,ge("vzFromElevation","comp-z"))+oe(Tp,Ge,Fs,Ci(al),Ge,ge("d","xy-diagonal"))+oe(al,Ge,ge("elevation","elevation-angle")),symbols:[it.vz,it.d,it.eps]},{id:"plane-normal",html:oe(lo,Ge,Ai,Ci(Pi),On,Ri,lr(Pi),Ge,ge("vxp","comp-x-prime"))+xa("For the tilted plane: the part of the vector along the plane’s normal x′. The rest, v′y, lies in the plane."),symbols:[it.vxp,it.theta]}]}]},Ip=[{symbol:Do(ye("t")),sceneRef:"traction",description:"Grid of short arrows spread over the patch"},{symbol:ye("F"),sceneRef:"force",description:"White arrow with a round drag handle"},{symbol:N("A"),sceneRef:"area",description:"Shaded patch on the selected face"}],Gh=ke("traction",Do(ye("t"))),$h={id:"average-traction",html:oe(Gh,ve("="),oi(ke("force",ye("F")),ke("area",N("A"))))+oe(gn(Gh),ve("="),ge("tractionConversion"),ve("="),ge("traction")),symbols:Ip},Wh={showSurfaceNormal:!0,showArea:!0,showDistribution:!0,allowSurfaceSelection:!0,allowForceDrag:!0},Up={id:"S2",status:"seed",steps:[{id:"distribute-force-over-area",label:"Distribute the load",title:"A resultant force can stand for a load spread over an area",activeLabel:"Resultant and load distribution",body:"The white arrow is the resultant force. The small arrows show one idealized uniform distribution that produces it. Changing the area changes how concentrated the load is, without changing the resultant.",task:"Hold the force fixed and compare 50 cm² with 100 cm². Notice what changes—and what does not.",visualKind:"force-lab",quantity:"force",controls:["magnitude","area"],labOptions:Wh,initialLabState:{forceVector:{x:0,y:-5e3,z:0},surfaceNormal:{x:0,y:1,z:0},contactArea:100},presetId:"uniaxial-compression",magnitude:0,vectors:!1,outline:!1,grid:!1,spotlight:"area",equations:[$h],prompt:"If the force stays fixed while the loaded area is halved, what happens to the average load intensity?",choices:[{id:"halves",label:"It is halved",correct:!1,feedback:"The same resultant is now concentrated on less area."},{id:"doubles",label:"It doubles",correct:!0,feedback:"Correct. Dividing the same force by half the area gives twice the intensity."},{id:"same",label:"It stays the same",correct:!1,feedback:"Area is in the denominator of F / A."}],responseOverride:"A resultant summarizes a load distribution; the area controls its average intensity."},{id:"calculate-average-traction",label:"Calculate traction",title:"Force divided by area gives average traction",activeLabel:"Average traction, t̄ = F / A",body:"Average traction is a vector with stress units (pascals). It describes the force intensity on one specified surface. It is not yet the complete stress state at a point—that needs every surface through the point.",task:"Set |F| = 5 kN and A = 100 cm². Follow the unit conversion to 0.50 MPa.",visualKind:"force-lab",quantity:"force",controls:["magnitude","area"],labOptions:Wh,initialLabState:{forceVector:{x:0,y:-5e3,z:0},surfaceNormal:{x:0,y:1,z:0},contactArea:100},presetId:"uniaxial-compression",magnitude:0,vectors:!1,outline:!1,grid:!1,spotlight:"traction",equations:[$h],prompt:"What is |t̄| for 5 kN spread uniformly over 100 cm²?",choices:[{id:"point-zero-five",label:"0.05 MPa",correct:!1,feedback:"Check the conversion from square centimeters to square meters: 100 cm² = 0.01 m²."},{id:"point-five",label:"0.50 MPa",correct:!0,feedback:"Correct. 5,000 N / 0.01 m² = 500,000 Pa = 0.50 MPa."},{id:"five",label:"5.0 MPa",correct:!1,feedback:"That is ten times too large—recheck the area conversion."}],responseOverride:"Traction connects a force on a surface to the intensity of that force."}]},qh=ke("force",Do(ye("t"))),Xh=ke("surface-normal",ye("n")),Yh=ke("normal",Xe(N("t"),N("n"))),jh=ke("shear",ye("τ")),Np={id:"S3",status:"seed",steps:[{id:"decompose-traction",label:"Resolve normal and shear",title:"Traction has normal and shear components",activeLabel:"Traction decomposition",body:"Project the traction onto the surface normal. The signed projection is the normal traction; what remains lies in the surface and is the shear traction. Drag the force and watch both parts change with angle and magnitude.",task:"Choose Oblique, then adjust the direction until the normal and shear magnitudes are about equal.",visualKind:"force-lab",quantity:"force",controls:["components","area","presets"],labOptions:{showSurfaceNormal:!0,showArea:!0,showDecomposition:!0,allowSurfaceSelection:!0,allowForceDrag:!0},initialLabState:{forceVector:{x:3535,y:-3535,z:0},surfaceNormal:{x:0,y:1,z:0},contactArea:100},presetId:"pure-shear",magnitude:0,vectors:!1,outline:!1,grid:!1,spotlight:"decomposition",equations:[{id:"normal-part",html:oe(Yh,ve("="),qh,ve("·"),Xh,ve("="),ge("normalTraction")),symbols:[{symbol:Do(ye("t")),sceneRef:"force",description:"White arrow with a round drag handle (traction direction)"},{symbol:ye("n"),sceneRef:"surface-normal",description:"Short arrow pointing straight out of the selected face"},{symbol:Xe(N("t"),N("n")),sceneRef:"normal",description:"Arrow parallel to n, drawn from the tip of the shear arrow"}]},{id:"shear-part",html:oe(jh,ve("="),qh,ve("−"),Yh,Xh)+oe(gn(jh),ve("="),ge("shearMagnitude")),symbols:[{symbol:ye("τ"),sceneRef:"shear",description:"Arrow lying in the face, starting at the tail of the white arrow"}]}],prompt:"At 45° to the surface normal, how do the normal and shear magnitudes compare?",choices:[{id:"normal-larger",label:"Normal is larger",correct:!1,feedback:"At 45°, the two projections have equal magnitudes."},{id:"equal",label:"They are equal",correct:!0,feedback:"Correct. cos 45° = sin 45°, so both projections are the same size."},{id:"shear-zero",label:"Shear is zero",correct:!1,feedback:"Shear vanishes only when the traction is exactly parallel to the normal."}],responseOverride:"Normal and shear traction are components of one surface-traction vector."}]},Kh={id:"cauchy",html:oe(ye("t"),Ze(ve("("),ye("n"),ve(")")),ve("="),ve("−"),ye("σ"),ye("n"))+`<small>(compression-positive ${me(ye("σ"))}, outward ${me(ye("n"))})</small><output class="equation-matrix" data-live-html="tensor"></output>`,symbols:[]},Op={id:"S7",status:"seed",steps:[{id:"why-stress-needs-a-tensor",label:"Motivate the tensor",title:"Stress at a point must describe every plane orientation",activeLabel:"From traction to the stress tensor",body:"One traction vector describes one plane. A complete stress state must give the traction on every plane through the point. The stress tensor σ does that: it turns a plane’s normal n into that plane’s traction.",task:"Orbit the cube and find the single non-zero component in the matrix and the faces it acts on.",visualKind:"stress-state",presetId:"uniaxial-compression",magnitude:20,vectors:!0,outline:!0,grid:!0,equations:[Kh],responseOverride:"The tensor compactly describes how traction depends on plane orientation."},{id:"compare-shear-and-combined-states",label:"Add shear components",title:"Shear and normal components can act together",activeLabel:"Combined stress state",body:"Off-diagonal components are shear tractions on the coordinate planes. A combined state has both normal and shear components; its effect cannot be read from a single external arrow.",task:"Identify at least one normal component and one shear component in the matrix.",visualKind:"stress-state",presetId:"simple-shear-triaxial-compression",magnitude:30,vectors:!0,outline:!0,grid:!0,equations:[Kh],prompt:"Which representation completely specifies the displayed stress state at the point?",choices:[{id:"one-arrow",label:"One force arrow",correct:!1,feedback:"A single arrow describes force or traction on one surface, not the complete state."},{id:"tensor",label:"The stress tensor",correct:!0,feedback:"Correct. Its components determine the traction on every plane orientation."}],responseOverride:"Combined states require the full tensor, not a single force or traction vector."}]},Zh={id:"state-tensor",html:`${oe(ye("σ"),ve("="))}<output class="equation-matrix" data-live-html="tensor"></output><small>MPa · compression positive, tension negative</small>`,symbols:[]},Fp={id:"S10",status:"seed",steps:[{id:"compare-normal-stress-states",label:"Build normal states",title:"Normal components combine into different stress states",activeLabel:"Uniaxial tension",body:"Uniaxial, biaxial, and triaxial states differ in which normal components act together. In the geological convention used here, compression is positive and tension is negative.",task:"Read the matrix: which component is non-zero, and what is its sign?",visualKind:"stress-state",presetId:"uniaxial-tension",magnitude:28,vectors:!0,outline:!0,grid:!0,equations:[Zh],prompt:"What should be most visible along the loaded x-axis in uniaxial tension?",choices:[{id:"shorten",label:"Shortening",correct:!1,feedback:"Shortening goes with compression along x."},{id:"extend",label:"Extension",correct:!0,feedback:"Correct. The block extends parallel to the tensile direction."},{id:"unchanged",label:"No change",correct:!1,feedback:"The tensile component produces visible extension."}],responseOverride:"A stress state combines the normal and shear components acting at one point."},{id:"open-stress-explorer",label:"Open the laboratory",title:"Construct and compare complete stress states",activeLabel:"Stress-state laboratory",body:"Use Explore to compare the reference states and edit tensor components. Keep the chain of reasoning visible: force, traction on a surface, and finally the stress state at a point.",task:"Choose two states with similar magnitudes and explain why their block responses differ.",visualKind:"stress-state",presetId:"biaxial-tension-compression",magnitude:26,vectors:!0,outline:!0,grid:!0,equations:[Zh],responseOverride:"Continue into the open stress-state laboratory and build your own comparisons.",final:!0}]},Qi=i=>Xe(N("σ"),lt(String(i))),zp=ke("sigma-1",Qi(1)),kp=ke("sigma-2",Qi(2)),Pd=ke("vertical-axis",Xe(N("σ"),N("v"))),Jh=ke("vertical-axis",kn.k),Bp=ke("free-surface",Xe(N("τ"),en("ground"))),Hp=ke("envelope",N("μ")),Qc=ke("phi",N("φ")),Vp=ke("two-theta",Ze(lt("2"),N("θ"))),Rs=ke("beta",N("β")),ea=ke("dip",N("δ")),Gp=ke("envelope",Ze(N("τ"),ve("="),N("C"),ve("+"),N("μ"),Xe(N("σ"),N("n")))),Ft=ve("="),eh=ve("−"),ca=i=>lt(`${i}°`),be={s1:me(Qi(1)),s2:me(Qi(2)),s3:me(Qi(3)),mu:me(N("μ")),phi:me(N("φ")),beta:me(N("β")),dip:me(N("δ")),twoTheta:me(lt("2"),N("θ")),twoBeta:me(lt("2"),N("β")),k:me(kn.k),envelope:me(N("τ"),ve("="),N("C"),ve("+"),N("μ"),Xe(N("σ"),N("n")))},Vt={s1:{symbol:Qi(1),sceneRef:"sigma-1",description:"Largest compression: the thick solid arrows, and the right end of the Mohr circle"},s2:{symbol:Qi(2),sceneRef:"sigma-2",description:"Intermediate compression: the dashed arrows. Both faults contain this direction"},s3:{symbol:Qi(3)},sv:{symbol:Xe(N("σ"),N("v")),sceneRef:"vertical-axis",description:"The principal stress that points straight down into the ground"},k:{symbol:kn.k,sceneRef:"vertical-axis",description:"Unit vector along z, which points down in the NED frame"},tauGround:{symbol:Xe(N("τ"),en("ground")),sceneRef:"free-surface",description:"Shear traction on the ground surface (the top of the block): zero, because air cannot push sideways"},mu:{symbol:N("μ"),sceneRef:"envelope",description:"Coefficient of internal friction: the slope of the Coulomb line"},envelope:{symbol:Ze(N("τ"),ve("="),N("C"),ve("+"),N("μ"),Xe(N("σ"),N("n"))),sceneRef:"envelope",description:"Coulomb failure line (green): the shear stress the rock can bear at each normal stress"},phi:{symbol:N("φ"),sceneRef:"phi",description:"Friction angle: the tilt of the Coulomb line from horizontal"},twoTheta:{symbol:Ze(lt("2"),N("θ")),sceneRef:"two-theta",description:"Angle on the Mohr circle from σ1 to the fault’s point (orange dashed)"},beta:{symbol:N("β"),sceneRef:"beta",description:"Angle between σ1 and the fault in the block (pink arc)"},dip:{symbol:N("δ"),sceneRef:"dip",description:"Dip: the angle from horizontal down to the fault (violet arc)"}},Qh={id:"friction-angle",html:oe(Qc,Ft,pi(N("tan"),Ze(ve("−"),lt("1"))),Hp,Ft,ge("phi","phi")),symbols:[Vt.phi,Vt.mu]},$p={id:"mohr-angle",html:oe(Gp)+oe(Vp,Ft,ca(90),ve("+"),Qc,Ft,ge("twoTheta","two-theta")),symbols:[Vt.envelope,Vt.twoTheta]},ya={id:"beta-angle",html:oe(Rs,Ft,ca(45),eh,oi(Qc,lt("2")),Ft,ge("beta","beta")),symbols:[Vt.beta,Vt.phi]},eu={id:"dip-normal",html:oe(ea,Ft,ca(90),eh,Rs,Ft,ge("dip","dip"))+`<small>${be.s1} is vertical, and ${be.beta} is measured from it; the dip is measured from horizontal.</small>`,symbols:[Vt.dip,Vt.beta]},Wp={id:"dip-thrust",html:oe(ea,Ft,Rs,Ft,ge("dip","dip"))+`<small>${be.s1} is horizontal, so the angle from ${be.s1} is the dip.</small>`,symbols:[Vt.dip,Vt.beta]},qp={id:"dip-both",html:oe(Xe(ea,en("normal")),Ft,ca(90),eh,Rs,Ft,ge("dipNormal","dip"))+oe(Xe(ea,en("thrust")),Ft,Rs,Ft,ge("dipThrust","dip")),symbols:[Vt.dip,Vt.beta]},tu={id:"vertical-rule",html:oe(Pd,Ft,ge("verticalName","vertical-axis"))+oe(en("fault type:"),'<mspace width="0.4em"></mspace>',ge("faultType","fault")),symbols:[Vt.sv]},Xp=Object.freeze([{id:"rift",label:"Rift",regime:"normal",examples:"East African Rift, Basin and Range"},{id:"thrust-belt",label:"Fold–thrust belt",regime:"thrust",examples:"Canadian Rockies, Zagros"},{id:"transform",label:"Transform",regime:"strike-slip",examples:"San Andreas, North Anatolian"}]),ks={showMohr:!0,showAxes:!0,showFaults:!0,showConjugate:!0,showAngles:!0,showSlip:!0},Yp={id:"B7",status:"built",steps:[{id:"free-surface",label:"The free surface",title:"At the ground, one principal stress must be vertical",activeLabel:"The free surface",body:`The block is a piece of crust in the geological frame: x points north, y east, and z down. Its top is the ground, a free surface. The air above cannot push sideways on the rock, so the shear traction on the ground is zero. A plane with no shear traction is a principal plane, and its normal is a principal direction. The normal to the ground is vertical (${be.k}), so one principal stress is vertical. Anderson’s theory assumes this stays true to the depths where faults form.`,task:"Hover the symbols in the equation to find the ground and the vertical principal stress in the block. Drag to orbit the block.",visualKind:"anderson",controls:[],labOptions:{showMohr:!1,showAxes:!0,showFaults:!1,showAngles:!1,showSlip:!1},initialLabState:{regime:"normal",mu:.6},equations:[{id:"free-surface",html:oe(Bp,Ft,lt("0"),'<mspace width="0.5em"></mspace>',ve("⇒"),'<mspace width="0.5em"></mspace>',ye("σ"),Jh,Ft,Pd,Jh)+`<small>An equation of the form ${me(ye("σ"),ye("n"),ve("="),N("λ"),ye("n"))} says that ${me(ye("n"))} is a principal direction (an eigenvector of the stress tensor).</small>`,symbols:[Vt.tauGround,Vt.k,Vt.sv]}],prompt:"One principal stress is vertical. What does that mean for the other two?",choices:[{id:"horizontal",label:"Both are horizontal",correct:!0,feedback:"Right. Principal directions are mutually perpendicular, so the other two lie in the horizontal plane. The only question left is which of σ1, σ2, σ3 is the vertical one."},{id:"vertical",label:"They are vertical too",correct:!1,feedback:"Only one direction can be vertical. The three principal directions are perpendicular to each other."},{id:"anywhere",label:"They can point anywhere",correct:!1,feedback:"They must be perpendicular to the vertical one, so they are confined to the horizontal plane."}]},{id:"three-regimes",label:"Three choices",title:"Three ways to stand the stress axes up",activeLabel:"Which stress is vertical?",body:`With one axis vertical there are only three choices: the vertical stress is ${be.s1}, ${be.s2}, or ${be.s3}. A new shear fault forms on a Coulomb plane (B3). That plane contains ${be.s2} and lies at a small angle ${be.beta}, about 30°, from ${be.s1}. So each fault leans toward whichever axis is ${be.s1}.`,task:`Predict first. Then use the buttons to stand ${be.s2} and then ${be.s3} vertical, and compare the faults.`,visualKind:"anderson",controls:["regime"],labOptions:{showMohr:!1,showAxes:!0,showFaults:!0,faultsAfterAnswer:!0,showConjugate:!0,showAngles:!1,showSlip:!0},initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["faultType"],equations:[tu],prompt:`${be.s1} is vertical: the weight of the rock above is the largest compression. The faults contain ${be.s2} and lie about 30° from ${be.s1}. What kind of faults are they?`,choices:[{id:"normal",label:"Normal faults",correct:!0,feedback:"Right. The planes are steep, and the hanging wall slides down them: normal faults. Now stand σ2 and then σ3 vertical."},{id:"thrust",label:"Thrust faults",correct:!1,feedback:"Thrusts need σ1 horizontal, pushing the hanging wall up a gentle ramp. Here σ1 is vertical, so the planes are steep and the hanging wall moves down."},{id:"strike-slip",label:"Strike-slip faults",correct:!1,feedback:"Strike-slip faults are vertical, which needs σ1 and σ3 both horizontal. Here σ1 is vertical."}]},{id:"normal-regime",label:"σ1 vertical: normal",title:"σ1 vertical: normal faults dip about 60°",activeLabel:"Normal-fault regime",body:`The Mohr circle (right) grows until it touches the Coulomb line ${be.envelope}. The contact point is the plane that breaks first. It sits at ${be.twoTheta} = 90° + ${be.phi} around the circle, where ${be.phi} = tan⁻¹${be.mu} is the friction angle. In the block that plane lies at ${be.beta} = 45° − ${be.phi}/2 from ${be.s1}. With ${be.s1} vertical, ${be.beta} is measured from the vertical. The dip ${be.dip} is measured from the horizontal, so ${be.dip} = 90° − ${be.beta}.`,task:`Hover ${be.phi}, ${be.twoTheta}, ${be.beta}, and ${be.dip} to find each angle in the diagram and the block. Then work out the dip for ${be.mu} = 0.6.`,visualKind:"anderson",controls:["slip"],labOptions:ks,initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["dip"],equations:[Qh,$p,ya,eu],prompt:`With ${be.mu} = 0.6, what dip ${be.dip} does Anderson predict for the normal faults? (degrees)`,answer:{value:60.5,tolerance:1,correctFeedback:"Correct: φ = tan⁻¹0.6 ≈ 31.0°, β = 45° − 15.5° ≈ 29.5°, and δ = 90° − 29.5° ≈ 60.5°. Press Slip to watch the hanging wall move down the fault.",wrong:[{value:29.5,feedback:"29.5° is β, the angle from σ1 to the fault. σ1 is vertical here, so the dip from horizontal is 90° − β."},{value:31,tolerance:.5,feedback:"31° is φ, the friction angle. Use it to find β = 45° − φ/2, then δ = 90° − β."},{value:45,feedback:"45° is the plane of maximum shear stress. Friction turns the failure plane toward σ1, to 45° − φ/2 from it."},{value:121,tolerance:1.5,feedback:"That is 2θ, the angle on the Mohr circle. Angles on the circle are doubled; halve it to get θ, the angle from σ1 to the fault’s normal."}],fallbackFeedback:"Go one equation at a time: φ = tan⁻¹0.6, then β = 45° − φ/2, then δ = 90° − β."}},{id:"thrust-regime",label:"σ3 vertical: thrust",title:"σ3 vertical: thrust faults dip about 30°",activeLabel:"Thrust-fault regime",body:`Now the smallest compression is vertical and ${be.s1} is horizontal. The Mohr diagram has not changed: the same stresses, the same Coulomb line, the same ${be.beta}. Only the direction of ${be.s1} in the block has changed. Measured from a horizontal ${be.s1}, the angle ${be.beta} is the dip itself. The hanging wall is pushed up a gentle ramp: a reverse fault with a low dip, called a thrust. A common mistake is to picture thrusts under a vertical ${be.s1}, rock squashed from above. Thrusting needs the largest push to be horizontal.`,task:"Predict the dip, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:ks,initialLabState:{regime:"thrust",mu:.6},revealAfterAnswer:["dip"],equations:[ya,Wp],prompt:"How steep are the thrust faults, compared with the normal faults in step 3?",choices:[{id:"thirty",label:"About 30°: shallower",correct:!0,feedback:"Right. δ = β ≈ 29.5° for μ = 0.6: the same Coulomb angle, measured from a horizontal σ1 instead of a vertical one."},{id:"sixty",label:"About 60°: the same",correct:!1,feedback:"The Mohr diagram is the same, but β is measured from σ1, which is now horizontal. The dip equals β, not 90° − β."},{id:"forty-five",label:"About 45°",correct:!1,feedback:"45° would need zero friction. With μ > 0 the fault turns toward σ1, which here is horizontal, so it gets shallower than 45°."}]},{id:"strike-slip-regime",label:"σ2 vertical: strike-slip",title:"σ2 vertical: vertical strike-slip faults",activeLabel:"Strike-slip regime",body:`With ${be.s2} vertical, ${be.s1} and ${be.s3} are both horizontal. The faults still contain ${be.s2}, so they are vertical. Seen from above, each one lies ${be.beta} from ${be.s1}, one on each side of it. The pair meets at an acute angle ${be.twoBeta} that ${be.s1} bisects. Slip is horizontal, along the strike. One fault of the pair is right-lateral (dextral) and the other is left-lateral (sinistral).`,task:"Orbit to look down on the block from above. Predict, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:ks,initialLabState:{regime:"strike-slip",mu:.6},equations:[ya,{id:"strikes",html:oe(ea,Ft,ca(90))+oe(en("strike"),Ft,en("trend of"),'<mspace width="0.3em"></mspace>',zp,ve("±"),Rs)+oe(Ft,ge("strikes","fault")),symbols:[Vt.dip,Vt.s1,Vt.beta]}],prompt:"The solid fault strikes about 030°, clockwise from σ1. Standing on one side of it, which way does the far side move?",choices:[{id:"sinistral",label:"To the left: sinistral",correct:!0,feedback:"Right. σ1 drives the blocks in the acute angles together, and the blocks in the obtuse angles move out sideways. The fault clockwise of σ1 is sinistral; its conjugate at about 330° is dextral."},{id:"dextral",label:"To the right: dextral",correct:!1,feedback:"That is the conjugate, at about 330°. Press Slip and follow the green arrows: on the 030° fault the far block moves to your left."},{id:"down-dip",label:"Down the dip",correct:!1,feedback:"The faults are vertical and contain the vertical σ2, so there is no up-or-down slip. The motion is horizontal."}]},{id:"vary-friction",label:"Change the friction",title:"Friction sets the angles",activeLabel:"Friction and fault dip",body:`Every step so far used ${be.mu} = 0.6, typical of rock. Drag ${be.mu} and watch the Coulomb line tilt. As ${be.phi} grows, the contact point moves around the circle and ${be.beta} shrinks: the fault turns toward ${be.s1}. Switch regimes to see what that does to each dip. With no friction (${be.mu} = 0), the fault would lie on the plane of maximum shear stress, 45° from ${be.s1}, in every regime.`,task:`Try ${be.mu} = 0.2, 0.6, and 1.0 in the normal and thrust regimes.`,visualKind:"anderson",controls:["regime","mu","slip"],labOptions:ks,initialLabState:{regime:"normal",mu:.6},equations:[Qh,ya,qp],prompt:`As ${be.mu} increases from 0.6 toward 1, what happens to the predicted dips?`,choices:[{id:"opposite",label:"Normal faults steepen, thrusts flatten",correct:!0,feedback:"Right. Higher friction makes β smaller. δ = 90° − β grows for normal faults and δ = β shrinks for thrusts: both turn toward σ1."},{id:"both-steepen",label:"Both get steeper",correct:!1,feedback:"Drag μ in the thrust regime and watch δ: it follows β, which shrinks as friction grows."},{id:"fixed",label:"Neither changes",correct:!1,feedback:"60° and 30° belong to μ ≈ 0.6. β = 45° − φ/2 depends on friction, so the dips do too."}]},{id:"limits",label:"Limits of the theory",title:"When real faults disagree with Anderson",activeLabel:"Assumptions and limits",body:"Anderson’s predictions rest on three assumptions: a new fault breaks intact rock that is equally strong in every direction; the ground is flat and horizontal, so one principal stress is vertical; and slip is small, so the fault keeps the orientation it formed with. Real faults often break these. Rock already contains weak planes such as bedding and older faults, and a weak plane at the “wrong” angle can slip before a new fault forms (B6). Normal faults in rifts rotate like tilting dominoes as they slip, so their dips decrease. Steep topography and layers of different stiffness tilt the stress axes away from vertical.",task:"Keep the normal regime and think about what could make a real fault shallower than the prediction.",visualKind:"anderson",controls:["regime","mu","slip"],labOptions:ks,initialLabState:{regime:"normal",mu:.6},equations:[eu],prompt:"A rift contains many normal faults dipping 35–45°, much shallower than the predicted 60°. What is the best explanation?",choices:[{id:"rotated",label:"They rotated during slip, or reused older weak planes",correct:!0,feedback:"Right. Anderson predicts the angle at which a fault forms in intact rock. Rotation after formation, and reactivation of weaker planes, both break that assumption."},{id:"horizontal-s1",label:"σ1 was horizontal when they formed",correct:!1,feedback:"With σ1 horizontal the faults would be thrusts or strike-slip faults, not normal faults."},{id:"high-friction",label:"Friction was ve
