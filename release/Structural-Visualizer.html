ntact",description:"Cohesion: the extra strength of unbroken rock, where the dashed line meets the τ axis"},tsLine:{symbol:Wi,sceneRef:"ts-line",description:"Slip tendency: the slope of the dotted line from the origin to the plane’s point"},tsMap:{symbol:Wi,sceneRef:"ts-map",description:"Slip tendency of every plane: the color at each pole on the stereonet"},critical:{symbol:Le(Wi,J("≥"),xs),sceneRef:"critical",description:"Planes that would slip: the hatched part of the stereonet"},pf:{symbol:jd,sceneRef:"pf",description:"Pore-fluid pressure: it shifts every point left by Pf (blue arrow)"}},D0=ce("friction",Le(E("τ"),_t,xs,Bn)),k0=ce("intact",Le(E("τ"),_t,E("C"),mr,E("μ"),Bn)),I0={id:"traction",html:Y(Gc,_t,ne("σ"),Vc,_t,ee("traction","traction"))+Y(Ma,_t,Gc,J("⋅"),Vc,_t,ee("sigmaN","normal-stress"),uo)+Y(hc,_t,$n(Gc,ur,Ma,Vc),_t,ee("tau","shear-stress"),uo)+`<small>${St.n} is the pole, pointing down into the footwall; ${St.t} (NED components, MPa) is the hanging wall’s push on it. Compression is positive.</small>`,symbols:[Kt.t,Kt.n,Kt.sn,Kt.tau]},N0={id:"slip-tendency",html:Y(Zf,_t,Mn(hc,Ma),_t,ee("ts","ts-line"))+Y(ve("slips when"),'<mspace width="0.4em"></mspace>',Wi,J("≥"),Kf,_t,Je("0.85")),symbols:[Kt.tsLine,Kt.tau,Kt.sn,Kt.mus]},ip={id:"map",html:Y(P0,_t,Mn(hc,Ma))+Y(ve("hatched:"),'<mspace width="0.4em"></mspace>',ce("critical",Le(Wi,J("≥"),xs)))+Y(ve("this plane:"),'<mspace width="0.2em"></mspace>',Wi,_t,ee("ts","pole"),J(","),'<mspace width="0.3em"></mspace>',ee("slipsText","critical")),symbols:[Kt.tsMap,Kt.critical,Kt.n]},sp=Object.freeze([{id:"A",label:"A",strike:0,dip:65,description:"000°/65° E"},{id:"B",label:"B",strike:90,dip:60,description:"090°/60° S"},{id:"C",label:"C",strike:0,dip:30,description:"000°/30° E"}]),Wr={showStereonet:!1},U0={id:"B6",status:"built",steps:[{id:"weak-planes",label:"Old planes are weak",title:"Broken rock is weaker than intact rock",activeLabel:"Existing planes are weaker",body:`Crust is full of old breaks: faults, joints, and bedding planes. The tan plane in the block is one of them. On the Mohr diagram (right), intact rock fails on the Coulomb line ${K(E("τ"),_t,E("C"),mr,E("μ"),Bn)} (gray, dashed; B3). An existing plane only has to overcome friction, so it follows ${K(E("τ"),_t,xs,Bn)} (green). The circle shows the stress: σ1 at the right end, σ3 at the left.`,task:"Hover each line and its equation to link them.",visualKind:"friction",controls:[],labOptions:{...Wr,showPoint:!1,showRegion:!1,showTraction:!1,showPole:!1,showSlip:!1},initialLabState:{strike:0,dip:65,sigma1:130},equations:[{id:"two-lines",html:Y(ve("intact rock:"),'<mspace width="0.2em"></mspace>',k0)+Y(ve("old plane:"),'<mspace width="0.2em"></mspace>',D0)+Y(L0,_t,Je("20"),uo,J(","),'<mspace width="0.6em"></mspace>',E("μ"),_t,Kf,_t,Je("0.85"))+"<small>Illustrative values: here both lines have the same slope.</small>",symbols:[Kt.intact,Kt.sliding,Kt.c,Kt.mus]}],prompt:"In this diagram both lines have the same slope. Why does the line for the existing plane sit lower?",choices:[{id:"no-cohesion",label:"The plane is already broken, so it has no cohesion",correct:!0,feedback:"Right. Cohesion C is the strength of the bonds that hold unbroken rock together. On an existing plane those bonds are already broken, so only friction resists sliding and the line starts at the origin."},{id:"less-friction",label:"Sliding has a lower friction coefficient",correct:!1,feedback:"Not here: both lines have the same slope, μ = 0.85. The whole gap between them is the cohesion C."},{id:"less-normal",label:"The normal stress on the plane is lower",correct:!1,feedback:"The comparison is at the same normal stress: pick any σn and read both lines above it. The existing plane holds less shear stress because it has no cohesion."}]},{id:"byerlee",label:"Byerlee’s law",title:"Byerlee’s law: nearly all rocks slide alike",activeLabel:"Byerlee’s friction law",body:`In 1978 James Byerlee gathered laboratory friction tests on many rock types. For normal stresses up to about 200 MPa (the upper crust), the shear stress needed to slide fits one line, ${K(E("τ"),_t,Je("0.85"),Bn)}, whatever the rock. At higher normal stress the fit is ${K(E("τ"),_t,Je("50"),uo,mr,Je("0.6"),Bn)}. Look for the slight bend in the green line at 200 MPa. The main exception is gouge rich in some clay minerals, which can slide at much lower friction.`,task:"Hover the green line. Then work out the shear stress needed to slide.",visualKind:"friction",controls:[],labOptions:{...Wr,showPoint:!1,showRegion:!1,showTraction:!1,showPole:!1,showSlip:!1},initialLabState:{strike:0,dip:65,sigma1:130},equations:[{id:"byerlee",html:Y(ce("friction",Le(E("τ"),_t,Je("0.85"),Bn)))+Y(ce("friction",Le(E("τ"),_t,Je("50"),mr,Je("0.6"),Bn)))+`<small>Stresses in MPa. The first line holds for ${St.sn} below 200 MPa, the second above.</small>`,symbols:[Kt.sliding]}],prompt:`An old fault carries a normal stress ${St.sn} = 50 MPa. What shear stress ${St.tau} makes it slide? (MPa)`,answer:{value:42.5,tolerance:.5,correctFeedback:"Correct: τ = 0.85 × 50 = 42.5 MPa. Below that the fault holds; at 42.5 MPa it slides.",wrong:[{value:62.5,feedback:"That is intact rock: 20 + 0.85 × 50. An existing fault has no cohesion, so drop the C."},{value:50,tolerance:1,feedback:"That would be μ = 1. Byerlee’s coefficient below 200 MPa is 0.85."},{value:30,feedback:"The 0.6 slope applies only above 200 MPa, and it comes with a 50 MPa intercept. At 50 MPa, use τ = 0.85σn."},{value:80,tolerance:1,feedback:"That is the high-stress line, 50 + 0.6 × 50, used outside its range. At 50 MPa, use τ = 0.85σn."}],fallbackFeedback:"Use the low-stress line: τ = 0.85 × σn with σn = 50 MPa."}},{id:"every-plane-a-point",label:"Every plane is a point",title:"Every plane is a point on the Mohr diagram",activeLabel:"Planes on the 3D Mohr diagram",body:`Turn the old plane with the strike and dip sliders. The stress pushes on it with a traction ${St.t} = ${St.sigma}${St.n} (orange). That push has a part straight across the plane, ${St.sn}, and a part along it, ${St.tau}. Each plane plots as one point (${St.sn}, ${St.tau}). In 3D there are three Mohr circles, one for each pair of principal stresses, and every plane plots on them or in the shaded region between them (S9). Here σ1 is vertical, σ2 points north–south, and σ3 east–west.`,task:"Turn the plane and watch its point move. Find where it goes when the plane contains σ2.",visualKind:"friction",controls:["strike","dip"],labOptions:{...Wr,showTraction:!0,showPole:!0,showProjections:!0,showSlip:!1},initialLabState:{strike:30,dip:50,sigma1:150},equations:[I0],prompt:"σ2 points north–south, so a plane striking 000° (or 180°) contains it. Where does such a plane plot?",choices:[{id:"big-circle",label:"On the big σ1–σ3 circle",correct:!0,feedback:"Right. A plane that contains σ2 feels only σ1 and σ3, so it lies on their circle. That is the 2D Mohr circle from S6 and B7. Every other plane plots inside the shaded region."},{id:"small-circle",label:"On one of the small circles",correct:!1,feedback:"Set strike to 000° and watch the point: it rides the outer circle. The small circles hold planes that contain σ3 (σ1–σ2 circle) or σ1 (σ2–σ3 circle)."},{id:"axis",label:"On the σn axis, with no shear",correct:!1,feedback:"Only planes perpendicular to a principal stress have no shear. A plane that contains σ2 feels both σ1 and σ3, so it has shear."}]},{id:"slip-tendency",label:"Slip tendency",title:"Slip tendency: will this plane slide?",activeLabel:"Slip tendency",body:`A plane slides when its shear stress reaches the friction line: ${K(E("τ"),J("≥"),xs,Bn)}. Divide both sides by ${St.sn} to get the slip tendency, ${K(Wi,_t,Mn(E("τ"),Bn))}. On the Mohr diagram, ${St.ts} is the slope of the dotted line from the origin to the plane’s point. The plane slips when that line is as steep as the green friction line, ${St.ts} ≥ ${St.mus} = 0.85.`,task:"Turn the plane until it would slip, then press Slip.",visualKind:"friction",controls:["strike","dip","slip"],labOptions:{...Wr,showTraction:!0,showPole:!0,showTsLine:!0,showSlip:!0},initialLabState:{strike:30,dip:50,sigma1:150},goal:{text:"Find a plane that would slip (Ts ≥ 0.85).",check:i=>!!i.slips},equations:[N0],prompt:`A plane carries ${St.sn} = 60 MPa and ${St.tau} = 45 MPa. What is its slip tendency ${St.ts}?`,answer:{value:.75,tolerance:.01,correctFeedback:"Correct: Ts = 45/60 = 0.75. That is below 0.85, so this plane holds.",wrong:[{value:1.33,tolerance:.02,feedback:"That is σn/τ, upside down. Slip tendency is shear over normal: τ/σn."},{value:.85,tolerance:.005,feedback:"0.85 is the friction threshold μs. Compute this plane’s own ratio, τ/σn, and compare it with 0.85."},{value:15,tolerance:.5,feedback:"Slip tendency is a ratio, τ divided by σn, not a difference."}],fallbackFeedback:"Ts = τ/σn: divide 45 by 60."}},{id:"old-or-new",label:"Old plane or new fault?",title:"Reactivate the old plane, or break a new fault?",activeLabel:"Reactivation or a new fault",body:`Now raise ${St.s1} and watch the circle grow. Two things can happen first: the old plane’s point reaches the green friction line and the plane slides, or the circle touches the gray intact line and a new fault breaks through the rock (B3). Whichever happens at the lower ${St.s1} wins, and the stress stops rising there. A well-oriented plane slips long before a new fault can form. A badly oriented one may never slip at all: its point can never reach the friction line, however large the circle grows.`,task:`Predict first. Then raise ${St.s1} and see what happens. Try dips of 65°, 45°, and 30°.`,visualKind:"friction",controls:["sigma1","strike","dip","slip"],labOptions:{...Wr,showTraction:!0,showPole:!0,showTsLine:!1,showSlip:!0,stopAtFailure:!0},initialLabState:{strike:0,dip:45,sigma1:60},revealAfterAnswer:["reactivate","newFault","outcome"],equations:[{id:"which-first",html:Y(Ae(Ho,ve("slip")),_t,ee("reactivate","plane-point"))+Y(Ae(Ho,ve("new fault")),_t,ee("newFault","intact"))+Y(ve("first:"),'<mspace width="0.4em"></mspace>',ee("outcome","plane-point")),symbols:[Kt.s1,{symbol:Le(E("τ"),_t,E("C"),mr,E("μ"),Bn),sceneRef:"intact",description:"Intact-rock line: the circle touching it means a new fault"},{symbol:ve("plane"),sceneRef:"plane-point",description:"The old plane’s point: it slips when it reaches the green line"}]}],prompt:"The old plane dips 45° east and contains σ2. As σ1 rises, what happens first?",choices:[{id:"new-fault",label:"A new fault breaks through intact rock",correct:!0,feedback:"Right. A 45° plane needs σ1 = 370 MPa to slip, but intact rock breaks at about 227 MPa. The new fault forms at the Coulomb angle, dipping about 65°. Try a 65° dip: it slips at only 140 MPa. A 30° dip never slips."},{id:"old-slips",label:"The old plane slips",correct:!1,feedback:"Raise σ1 and watch the tan point: at 45° it climbs toward the friction line too slowly, and the circle reaches the intact line first. A weak plane only helps if it is well oriented."},{id:"nothing",label:"Nothing: the rock just gets more stressed",correct:!1,feedback:"The circle keeps growing as σ1 rises, and it must eventually reach one of the two lines. Raise σ1 and see which."}]},{id:"slip-tendency-map",label:"All planes at once",title:"A map of slip tendency for every plane",activeLabel:"Slip tendency on the stereonet",body:`A stereonet shows every plane orientation at once. Each point inside the circle is the pole of one plane: planes dipping gently have poles near the center, and steep planes have poles near the edge. Color each pole by ${St.ts} and you get a map of which planes are closest to slipping. Hatching marks the planes that would slip. Click or drag on the stereonet to pick a plane, or use the sliders. Change which stress is vertical to see the map follow the stress axes.`,task:"Find the most dangerous planes, then switch regimes and look again.",visualKind:"friction",controls:["regime","strike","dip"],labOptions:{showStereonet:!0,showTraction:!1,showPole:!0,showTsLine:!0,showSlip:!1},initialLabState:{strike:30,dip:50,sigma1:150},equations:[ip,{id:"dilation",html:Y(Ae(E("T"),E("d")),_t,Mn(Le(Ho,ur,Ma),Le(Ho,ur,C0)),_t,ee("td","normal-stress"))+"<small>Aside: dilation tendency is how easily the plane opens instead. It is 1 for planes perpendicular to σ3, where joints and veins form (B5).</small>",symbols:[Kt.s1,Kt.sn,Kt.s3]}],prompt:"Where are the planes most likely to slip?",choices:[{id:"coulomb",label:"Planes that contain σ2, about 25° from σ1",correct:!0,feedback:"Right. The two hatched patches are the conjugate Coulomb orientations: β = 45° − φ/2 ≈ 25° from σ1 with μ = 0.85, containing σ2. Old planes in those orientations are the first to slip."},{id:"perpendicular",label:"Planes perpendicular to σ1",correct:!1,feedback:"Those planes carry the largest normal stress and no shear at all: Ts = 0. In the normal regime their pole is the center of the net, the darkest spot."},{id:"forty-five",label:"Planes at 45° to σ1",correct:!1,feedback:"The 45° planes carry the most shear, but also a lot of normal stress. Friction favors planes turned toward σ1, about 25° from it, where τ/σn is largest."}]},{id:"rank-faults",label:"Rank the faults",title:"Which mapped fault is closest to slipping?",activeLabel:"Ranking faults by slip tendency",body:`A geologist maps three old faults near a planned reservoir (strike/dip, right-hand rule). The stress is a normal-faulting state with ${St.s1} vertical and ${St.s3} east–west. The letters on the stereonet are the faults’ poles, and the same letters on the Mohr diagram are their points. Ranking faults by ${St.ts} this way is how engineers screen faults near dams, wells, and waste-injection sites.`,task:"Use the stereonet and the Mohr diagram to rank the faults. Select a fault to see its values.",visualKind:"friction",controls:["faults"],labOptions:{showStereonet:!0,showTraction:!1,showPole:!0,showTsLine:!0,showSlip:!1,showMarkers:!0},initialLabState:{strike:0,dip:65,sigma1:130,fault:"A"},mappedFaults:sp,revealAfterAnswer:["ts"],equations:[ip],prompt:"Which fault has the highest slip tendency?",choices:[{id:"A",label:"A: 000°/65° E",correct:!0,feedback:"Right: A contains σ2 and lies about 25° from the vertical σ1, the best orientation for slip (Ts ≈ 0.80). C is too gently dipping (Ts ≈ 0.41), and B strikes along σ3, so it carries little shear (Ts ≈ 0.23). None slips yet: all are below 0.85."},{id:"B",label:"B: 090°/60° S",correct:!1,feedback:"B strikes east–west, along σ3. Its point sits low on the Mohr diagram: little shear for its normal stress."},{id:"C",label:"C: 000°/30° E",correct:!1,feedback:"C contains σ2, but it dips only 30°: it is 60° from σ1, far from the best angle. Its pole is well away from the bright patches."}]},{id:"fluid-pressure",label:"Fluids wake faults",title:"Fluid pressure can wake up old faults",activeLabel:"Pore pressure and induced earthquakes",body:`So far the rock was dry. Water in pores and cracks pushes the fault walls apart and cancels part of the normal stress. What matters for friction is the effective normal stress ${St.snEff} = ${St.sn} − ${St.pf} (B4). Pore pressure does not change the shear stress, so the Mohr circles slide left by ${St.pf} and every point moves toward the friction line. Pumping fluid underground can raise ${St.pf} enough to make a stable fault slip: waste injection near Denver in the 1960s and wastewater disposal in Oklahoma in the 2010s both set off earthquakes on old faults.`,task:`Raise ${St.pf} slowly. How much does fault A need before it slips? Watch the hatched area grow on the stereonet.`,visualKind:"friction",controls:["pf","faults","slip"],labOptions:{showStereonet:!0,showTraction:!1,showPole:!0,showTsLine:!0,showSlip:!0,showMarkers:!0,effective:!0},initialLabState:{strike:0,dip:65,sigma1:130,pf:0,fault:"A"},mappedFaults:sp,equations:[{id:"effective",html:Y(ce("normal-stress",Yf),_t,Ma,ur,np)+Y(_t,ee("sigmaN","normal-stress"),ur,ee("pf","pf"),_t,ee("sigmaNEff","normal-stress"),uo)+Y(Zf,_t,Mn(hc,Le(Ma,ur,np)),_t,ee("ts","ts-line")),symbols:[Kt.pf,Kt.sn,Kt.tau,Kt.tsLine]}],prompt:`Pumping raises ${St.pf} on fault A. What happens to the shear stress ${St.tau} on the fault?`,choices:[{id:"unchanged",label:"It stays the same",correct:!0,feedback:"Right. Fluid pressure pushes equally in all directions, so it has no shear part: τ is unchanged, and only σn′ drops. Fault A slips once Pf reaches about 3 MPa, a small change for a critically stressed fault."},{id:"increases",label:"It increases",correct:!1,feedback:"A fluid cannot push sideways, so it adds no shear. Watch the τ value while you raise Pf: it does not move. The point slides left, not up."},{id:"decreases",label:"It decreases",correct:!1,feedback:"Pore pressure lowers the normal stress, not the shear stress. The point slides left toward the friction line, which is why faults get weaker."}],final:!0}]},Ws=i=>Ae(E("σ"),Je(String(i))),O0=ce("sigma-1",Ws(1)),F0=ce("sigma-2",Ws(2)),Jf=ce("vertical-axis",Ae(E("σ"),E("v"))),ap=ce("vertical-axis",yi.k),z0=ce("free-surface",Ae(E("τ"),ve("ground"))),B0=ce("envelope",E("μ")),Yd=ce("phi",E("φ")),$0=ce("two-theta",Le(Je("2"),E("θ"))),Ra=ce("beta",E("β")),bo=ce("dip",E("δ")),H0=ce("envelope",Le(E("τ"),J("="),E("C"),J("+"),E("μ"),Ae(E("σ"),E("n")))),on=J("="),Kd=J("−"),Ao=i=>Je(`${i}°`),Re={s1:K(Ws(1)),s2:K(Ws(2)),s3:K(Ws(3)),mu:K(E("μ")),phi:K(E("φ")),beta:K(E("β")),dip:K(E("δ")),twoTheta:K(Je("2"),E("θ")),twoBeta:K(Je("2"),E("β")),k:K(yi.k),envelope:K(E("τ"),J("="),E("C"),J("+"),E("μ"),Ae(E("σ"),E("n")))},hn={s1:{symbol:Ws(1),sceneRef:"sigma-1",description:"Largest compression: the thick solid arrows, and the right end of the Mohr circle"},s2:{symbol:Ws(2),sceneRef:"sigma-2",description:"Intermediate compression: the dashed arrows. Both faults contain this direction"},s3:{symbol:Ws(3)},sv:{symbol:Ae(E("σ"),E("v")),sceneRef:"vertical-axis",description:"The principal stress that points straight down into the ground"},k:{symbol:yi.k,sceneRef:"vertical-axis",description:"Unit vector along z, which points down in the NED frame"},tauGround:{symbol:Ae(E("τ"),ve("ground")),sceneRef:"free-surface",description:"Shear traction on the ground surface (the top of the block): zero, because air cannot push sideways"},mu:{symbol:E("μ"),sceneRef:"envelope",description:"Coefficient of internal friction: the slope of the Coulomb line"},envelope:{symbol:Le(E("τ"),J("="),E("C"),J("+"),E("μ"),Ae(E("σ"),E("n"))),sceneRef:"envelope",description:"Coulomb failure line (green): the shear stress the rock can bear at each normal stress"},phi:{symbol:E("φ"),sceneRef:"phi",description:"Friction angle: the tilt of the Coulomb line from horizontal"},twoTheta:{symbol:Le(Je("2"),E("θ")),sceneRef:"two-theta",description:"Angle on the Mohr circle from σ1 to the fault’s point (orange dashed)"},beta:{symbol:E("β"),sceneRef:"beta",description:"Angle between σ1 and the fault in the block (pink arc)"},dip:{symbol:E("δ"),sceneRef:"dip",description:"Dip: the angle from horizontal down to the fault (violet arc)"}},rp={id:"friction-angle",html:Y(Yd,on,es(E("tan"),Le(J("−"),Je("1"))),B0,on,ee("phi","phi")),symbols:[hn.phi,hn.mu]},V0={id:"mohr-angle",html:Y(H0)+Y($0,on,Ao(90),J("+"),Yd,on,ee("twoTheta","two-theta")),symbols:[hn.envelope,hn.twoTheta]},Vo={id:"beta-angle",html:Y(Ra,on,Ao(45),Kd,Mn(Yd,Je("2")),on,ee("beta","beta")),symbols:[hn.beta,hn.phi]},op={id:"dip-normal",html:Y(bo,on,Ao(90),Kd,Ra,on,ee("dip","dip"))+`<small>${Re.s1} is vertical, and ${Re.beta} is measured from it; the dip is measured from horizontal.</small>`,symbols:[hn.dip,hn.beta]},G0={id:"dip-thrust",html:Y(bo,on,Ra,on,ee("dip","dip"))+`<small>${Re.s1} is horizontal, so the angle from ${Re.s1} is the dip.</small>`,symbols:[hn.dip,hn.beta]},W0={id:"dip-both",html:Y(Ae(bo,ve("normal")),on,Ao(90),Kd,Ra,on,ee("dipNormal","dip"))+Y(Ae(bo,ve("thrust")),on,Ra,on,ee("dipThrust","dip")),symbols:[hn.dip,hn.beta]},lp={id:"vertical-rule",html:Y(Jf,on,ee("verticalName","vertical-axis"))+Y(ve("fault type:"),'<mspace width="0.4em"></mspace>',ee("faultType","fault")),symbols:[hn.sv]},q0=Object.freeze([{id:"rift",label:"Rift",regime:"normal",examples:"East African Rift, Basin and Range"},{id:"thrust-belt",label:"Fold–thrust belt",regime:"thrust",examples:"Canadian Rockies, Zagros"},{id:"transform",label:"Transform",regime:"strike-slip",examples:"San Andreas, North Anatolian"}]),Ha={showMohr:!0,showAxes:!0,showFaults:!0,showConjugate:!0,showAngles:!0,showSlip:!0},X0={id:"B7",status:"built",steps:[{id:"free-surface",label:"The free surface",title:"At the ground, one principal stress must be vertical",activeLabel:"The free surface",body:`The block is a piece of crust in the geological frame: x points north, y east, and z down. Its top is the ground, a free surface. The air above cannot push sideways on the rock, so the shear traction on the ground is zero. A plane with no shear traction is a principal plane, and its normal is a principal direction. The normal to the ground is vertical (${Re.k}), so one principal stress is vertical. Anderson’s theory assumes this stays true to the depths where faults form.`,task:"Hover the symbols in the equation to find the ground and the vertical principal stress in the block. Drag to orbit the block.",visualKind:"anderson",controls:[],labOptions:{showMohr:!1,showAxes:!0,showFaults:!1,showAngles:!1,showSlip:!1},initialLabState:{regime:"normal",mu:.6},equations:[{id:"free-surface",html:Y(z0,on,Je("0"),'<mspace width="0.5em"></mspace>',J("⇒"),'<mspace width="0.5em"></mspace>',ne("σ"),ap,on,Jf,ap)+`<small>An equation of the form ${K(ne("σ"),ne("n"),J("="),E("λ"),ne("n"))} says that ${K(ne("n"))} is a principal direction (an eigenvector of the stress tensor).</small>`,symbols:[hn.tauGround,hn.k,hn.sv]}],prompt:"One principal stress is vertical. What does that mean for the other two?",choices:[{id:"horizontal",label:"Both are horizontal",correct:!0,feedback:"Right. Principal directions are mutually perpendicular, so the other two lie in the horizontal plane. The only question left is which of σ1, σ2, σ3 is the vertical one."},{id:"vertical",label:"They are vertical too",correct:!1,feedback:"Only one direction can be vertical. The three principal directions are perpendicular to each other."},{id:"anywhere",label:"They can point anywhere",correct:!1,feedback:"They must be perpendicular to the vertical one, so they are confined to the horizontal plane."}]},{id:"three-regimes",label:"Three choices",title:"Three ways to stand the stress axes up",activeLabel:"Which stress is vertical?",body:`With one axis vertical there are only three choices: the vertical stress is ${Re.s1}, ${Re.s2}, or ${Re.s3}. A new shear fault forms on a Coulomb plane (B3). That plane contains ${Re.s2} and lies at a small angle ${Re.beta}, about 30°, from ${Re.s1}. So each fault leans toward whichever axis is ${Re.s1}.`,task:`Predict first. Then use the buttons to stand ${Re.s2} and then ${Re.s3} vertical, and compare the faults.`,visualKind:"anderson",controls:["regime"],labOptions:{showMohr:!1,showAxes:!0,showFaults:!0,faultsAfterAnswer:!0,showConjugate:!0,showAngles:!1,showSlip:!0},initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["faultType"],equations:[lp],prompt:`${Re.s1} is vertical: the weight of the rock above is the largest compression. The faults contain ${Re.s2} and lie about 30° from ${Re.s1}. What kind of faults are they?`,choices:[{id:"normal",label:"Normal faults",correct:!0,feedback:"Right. The planes are steep, and the hanging wall slides down them: normal faults. Now stand σ2 and then σ3 vertical."},{id:"thrust",label:"Thrust faults",correct:!1,feedback:"Thrusts need σ1 horizontal, pushing the hanging wall up a gentle ramp. Here σ1 is vertical, so the planes are steep and the hanging wall moves down."},{id:"strike-slip",label:"Strike-slip faults",correct:!1,feedback:"Strike-slip faults are vertical, which needs σ1 and σ3 both horizontal. Here σ1 is vertical."}]},{id:"normal-regime",label:"σ1 vertical: normal",title:"σ1 vertical: normal faults dip about 60°",activeLabel:"Normal-fault regime",body:`The Mohr circle (right) grows until it touches the Coulomb line ${Re.envelope}. The contact point is the plane that breaks first. It sits at ${Re.twoTheta} = 90° + ${Re.phi} around the circle, where ${Re.phi} = tan⁻¹${Re.mu} is the friction angle. In the block that plane lies at ${Re.beta} = 45° − ${Re.phi}/2 from ${Re.s1}. With ${Re.s1} vertical, ${Re.beta} is measured from the vertical. The dip ${Re.dip} is measured from the horizontal, so ${Re.dip} = 90° − ${Re.beta}.`,task:`Hover ${Re.phi}, ${Re.twoTheta}, ${Re.beta}, and ${Re.dip} to find each angle in the diagram and the block. Then work out the dip for ${Re.mu} = 0.6.`,visualKind:"anderson",controls:["slip"],labOptions:Ha,initialLabState:{regime:"normal",mu:.6},revealAfterAnswer:["dip"],equations:[rp,V0,Vo,op],prompt:`With ${Re.mu} = 0.6, what dip ${Re.dip} does Anderson predict for the normal faults? (degrees)`,answer:{value:60.5,tolerance:1,correctFeedback:"Correct: φ = tan⁻¹0.6 ≈ 31.0°, β = 45° − 15.5° ≈ 29.5°, and δ = 90° − 29.5° ≈ 60.5°. Press Slip to watch the hanging wall move down the fault.",wrong:[{value:29.5,feedback:"29.5° is β, the angle from σ1 to the fault. σ1 is vertical here, so the dip from horizontal is 90° − β."},{value:31,tolerance:.5,feedback:"31° is φ, the friction angle. Use it to find β = 45° − φ/2, then δ = 90° − β."},{value:45,feedback:"45° is the plane of maximum shear stress. Friction turns the failure plane toward σ1, to 45° − φ/2 from it."},{value:121,tolerance:1.5,feedback:"That is 2θ, the angle on the Mohr circle. Angles on the circle are doubled; halve it to get θ, the angle from σ1 to the fault’s normal."}],fallbackFeedback:"Go one equation at a time: φ = tan⁻¹0.6, then β = 45° − φ/2, then δ = 90° − β."}},{id:"thrust-regime",label:"σ3 vertical: thrust",title:"σ3 vertical: thrust faults dip about 30°",activeLabel:"Thrust-fault regime",body:`Now the smallest compression is vertical and ${Re.s1} is horizontal. The Mohr diagram has not changed: the same stresses, the same Coulomb line, the same ${Re.beta}. Only the direction of ${Re.s1} in the block has changed. Measured from a horizontal ${Re.s1}, the angle ${Re.beta} is the dip itself. The hanging wall is pushed up a gentle ramp: a reverse fault with a low dip, called a thrust. A common mistake is to picture thrusts under a vertical ${Re.s1}, rock squashed from above. Thrusting needs the largest push to be horizontal.`,task:"Predict the dip, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:Ha,initialLabState:{regime:"thrust",mu:.6},revealAfterAnswer:["dip"],equations:[Vo,G0],prompt:"How steep are the thrust faults, compared with the normal faults in step 3?",choices:[{id:"thirty",label:"About 30°: shallower",correct:!0,feedback:"Right. δ = β ≈ 29.5° for μ = 0.6: the same Coulomb angle, measured from a horizontal σ1 instead of a vertical one."},{id:"sixty",label:"About 60°: the same",correct:!1,feedback:"The Mohr diagram is the same, but β is measured from σ1, which is now horizontal. The dip equals β, not 90° − β."},{id:"forty-five",label:"About 45°",correct:!1,feedback:"45° would need zero friction. With μ > 0 the fault turns toward σ1, which here is horizontal, so it gets shallower than 45°."}]},{id:"strike-slip-regime",label:"σ2 vertical: strike-slip",title:"σ2 vertical: vertical strike-slip faults",activeLabel:"Strike-slip regime",body:`With ${Re.s2} vertical, ${Re.s1} and ${Re.s3} are both horizontal. The faults still contain ${Re.s2}, so they are vertical. Seen from above, each one lies ${Re.beta} from ${Re.s1}, one on each side of it. The pair meets at an acute angle ${Re.twoBeta} that ${Re.s1} bisects. Slip is horizontal, along the strike. One fault of the pair is right-lateral (dextral) and the other is left-lateral (sinistral).`,task:"Orbit to look down on the block from above. Predict, then press Slip.",visualKind:"anderson",controls:["slip"],labOptions:Ha,initialLabState:{regime:"strike-slip",mu:.6},equations:[Vo,{id:"strikes",html:Y(bo,on,Ao(90))+Y(ve("strike"),on,ve("trend of"),'<mspace width="0.3em"></mspace>',O0,J("±"),Ra)+Y(on,ee("strikes","fault")),symbols:[hn.dip,hn.s1,hn.beta]}],prompt:"The solid fault strikes about 030°, clockwise from σ1. Standing on one side of it, which way does the far side move?",choices:[{id:"sinistral",label:"To the left: sinistral",correct:!0,feedback:"Right. σ1 drives the blocks in the acute angles together, and the blocks in the obtuse angles move out sideways. The fault clockwise of σ1 is sinistral; its conjugate at about 330° is dextral."},{id:"dextral",label:"To the right: dextral",correct:!1,feedback:"That is the conjugate, at about 330°. Press Slip and follow the green arrows: on the 030° fault the far block moves to your left."},{id:"down-dip",label:"Down the dip",correct:!1,feedback:"The faults are vertical and contain the vertical σ2, so there is no up-or-down slip. The motion is horizontal."}]},{id:"vary-friction",label:"Change the friction",title:"Friction sets the angles",activeLabel:"Friction and fault dip",body:`Every step so far used ${Re.mu} = 0.6, typical of rock. Drag ${Re.mu} and watch the Coulomb line tilt. As ${Re.phi} grows, the contact point moves around the circle and ${Re.beta} shrinks: the fault turns toward ${Re.s1}. Switch regimes to see what that does to each dip. With no friction (${Re.mu} = 0), the fault would lie on the plane of maximum shear stress, 45° from ${Re.s1}, in every regime.`,task:`Try ${Re.mu} = 0.2, 0.6, and 1.0 in the normal and thrust regimes.`,visualKind:"anderson",controls:["regime","mu","slip"],labOptions:Ha,initialLabState:{regime:"normal",mu:.6},equations:[rp,Vo,W0],prompt:`As ${Re.mu} increases from 0.6 toward 1, what happens to the predicted dips?`,choices:[{id:"opposite",label:"Normal faults steepen, thrusts flatten",correct:!0,feedback:"Right. Higher friction makes β smaller. δ = 90° − β grows for normal faults and δ = β shrinks for thrusts: both turn toward σ1."},{id:"both-steepen",label:"Both get steeper",correct:!1,feedback:"Drag μ in the thrust regime and watch δ: it follows β, which shrinks as friction grows."},{id:"fixed",label:"Neither changes",correct:!1,feedback:"60° and 30° belong to μ ≈ 0.6. β = 45° − φ/2 depends on friction, so the dips do too."}]},{id:"limits",label:"Limits of the theory",title:"When real faults disagree with Anderson",activeLabel:"Assumptions and limits",body:"Anderson’s predictions rest on three assumptions: a new fault breaks intact rock that is equally strong in every direction; the ground is flat and horizontal, so one principal stress is vertical; and slip is small, so the fault keeps the orientation it formed with. Real faults often break these. Rock already contains weak planes such as bedding and older faults, and a weak plane at the “wrong” angle can slip before a new fault forms (B6). Normal faults in rifts rotate like tilting dominoes as they slip, so their dips decrease. Steep topography and layers of different stiffness tilt the stress axes away from vertical.",task:"Keep the normal regime and think about what could make a real fault shallower than the prediction.",visualKind:"anderson",controls:["regime","mu","slip"],labOptions:Ha,initialLabState:{regime:"normal",mu:.6},equations:[op],prompt:"A rift contains many normal faults dipping 35–45°, much shallower than the predicted 60°. What is the best explanation?",choices:[{id:"rotated",label:"They rotated during slip, or reused older weak planes",correct:!0,feedback:"Right. Anderson predicts the angle at which a fault forms in intact rock. Rotation after formation, and reactivation of weaker planes, both break that assumption."},{id:"horizontal-s1",label:"σ1 was horizontal when they formed",correct:!1,feedback:"With σ1 horizontal the faults would be thrusts or strike-slip faults, not normal faults."},{id:"high-friction",label:"Friction was very high",correct:!1,feedback:"Higher friction makes normal faults steeper, not shallower (step 6)."}]},{id:"infer-regime",label:"Read the stress",title:"Read the stress from the faults",activeLabel:"From faults back to stress",body:`In the field the reasoning runs backward: you map the faults and their slip, then infer the stress. The line where the conjugate faults intersect is ${Re.s2}, ${Re.s1} bisects the acute angle ${Re.twoBeta} between the faults, and ${Re.s3} bisects the obtuse angle. The stress arrows are hidden until you answer.`,task:"Orbit the block and press Slip to see the sense of motion.",visualKind:"anderson",controls:["slip"],labOptions:{showMohr:!1,showAxes:!0,axesAfterAnswer:!0,showFaults:!0,showConjugate:!0,showAngles:!1,showSlip:!0},initialLabState:{regime:"thrust",mu:.6},equations:[{id:"read-stress",html:Y(F0,J("∥"),ve("intersection line"))+Y(ve("acute angle"),on,Je("2"),Ra,on,ee("acute","beta")),symbols:[hn.s2,hn.beta]}],prompt:"This conjugate pair strikes east–west and dips about 30° north and south, with reverse slip. Which stress state formed it?",choices:[{id:"s3-vertical-ns",label:"σ3 vertical, σ1 north–south",correct:!0,feedback:"Right. Gentle dips with reverse slip mean σ3 is vertical. σ1 bisects the acute angle between the faults, so it is horizontal and perpendicular to their strike: north–south."},{id:"s3-vertical-ew",label:"σ3 vertical, σ1 east–west",correct:!1,feedback:"The faults intersect along an east–west line, and that line is σ2. σ1 is perpendicular to it: north–south."},{id:"s1-vertical",label:"σ1 vertical",correct:!1,feedback:"A vertical σ1 gives steep normal faults. These dip gently with reverse slip."},{id:"s2-vertical",label:"σ2 vertical",correct:!1,feedback:"A vertical σ2 gives vertical strike-slip faults. These dip about 30°."}]},{id:"tectonic-settings",label:"Tectonic settings",title:"Where each regime shows up",activeLabel:"Stress regimes and tectonics",body:"Each regime matches a tectonic setting. Where the crust is stretched, the vertical load is the largest stress and normal faults form: continental rifts and the Basin and Range. Where the crust is shortened, σ1 is horizontal and σ3 vertical: fold–thrust belts. Where blocks slide past each other, σ2 is vertical: transform and wrench zones. Real mountain belts often mix regimes, with thrusting in one place and strike-slip or normal faulting nearby or at another time. Oblique combinations are called transpression and transtension.",task:"Choose a setting. The block switches to its stress regime.",visualKind:"anderson",controls:["setting","mu","slip"],labOptions:Ha,initialLabState:{regime:"normal",mu:.6,setting:"rift"},settings:q0,equations:[lp],final:!0}]},Ri=i=>Ae(E("σ"),Je(String(i))),pt=J("="),Xl=J("−"),Qf=J("+"),yt=(i=.4)=>`<mspace width="${i}em"></mspace>`,em=Ae(Tn(ne("e")),ve("strike")),tm=Ae(Tn(ne("e")),ve("up")),Zd=Tn(ne("s")),Jd=Ae(E("s"),ve("strike")),Qd=Ae(E("s"),ve("dip")),Bh=Ae(E("τ"),ve("strike")),$h=Ae(E("τ"),ve("up")),Pi=ce("pole",ne("n")),nm=ce("slip",ne("s")),wr=ce("slip",Zd),qs=ce("rake",E("λ")),Hh=ce("strike-slip",Jd),Vh=ce("dip-slip",Qd),Pl=ce("traction",ne("t")),po=ce("shear-stress",ne("τ")),Dl=ce("p-axis",E("P")),im=ce("t-axis",E("T")),j0=ce("b-axis",E("B")),cp=ce("dike",ne("m")),Me={n:K(ne("n")),s:K(ne("s")),sHat:K(Zd),t:K(ne("t")),tau:K(ne("τ")),sigma:K(ne("σ")),lambda:K(E("λ")),s1:K(Ri(1)),s2:K(Ri(2)),s3:K(Ri(3)),sStrike:K(Jd),sDip:K(Qd),tauStrike:K(Bh),tauUp:K($h)},Qe={n:{symbol:ne("n"),sceneRef:"pole",description:"Pole to the fault: the unit normal pointing down into the footwall (white)"},hanging:{symbol:ve("hanging wall"),sceneRef:"hanging-wall",description:"The block above the fault"},foot:{symbol:ve("footwall"),sceneRef:"footwall",description:"The block below the fault"},s:{symbol:ne("s"),sceneRef:"slip",description:"Slip vector: how far and which way the hanging wall moved relative to the footwall (green)"},sHat:{symbol:Zd,sceneRef:"slip",description:"Unit slip vector: the direction of slip (green)"},sStrike:{symbol:Jd,sceneRef:"strike-slip",description:"Strike-slip part of the slip: along the strike line (yellow, dashed)"},sDip:{symbol:Qd,sceneRef:"dip-slip",description:"Dip-slip part of the slip: up or down the dip (blue, dotted)"},lambda:{symbol:E("λ"),sceneRef:"rake",description:"Rake: the angle in the fault plane from the strike direction to the slip, positive up the dip (violet arc)"},m:{symbol:ne("m"),sceneRef:"dike",description:"Pole of the dike, the offset marker (dark sheet with white edges)"},separation:{symbol:Ae(E("d"),ve("map")),sceneRef:"separation",description:"Map separation: the apparent offset of the dike along the fault trace (pink arrow)"},throw:{symbol:ve("throw"),sceneRef:"strat-gap",description:"Throw: the vertical part of the slip; for flat beds it equals the missing or repeated thickness in the well"},well:{symbol:ve("well"),sceneRef:"well",description:"A vertical well drilled through the faulted block, and its log"},t:{symbol:ne("t"),sceneRef:"traction",description:"Traction: the hanging wall’s push on the footwall, per unit area (orange)"},tau:{symbol:ne("τ"),sceneRef:"shear-stress",description:"Shear traction: the part of 𝐭 along the fault (pink, dashed)"},s1:{symbol:Ri(1),sceneRef:"sigma-1",description:"Largest compression: the thick solid arrows and the square on the stereonet"},s3:{symbol:Ri(3),sceneRef:"sigma-3",description:"Smallest compression: the thin dotted arrows and the triangle on the stereonet"},p:{symbol:E("P"),sceneRef:"p-axis",description:"P axis: the direction of shortening, 45° from the fault (violet, arrows pointing in)"},tAxis:{symbol:E("T"),sceneRef:"t-axis",description:"T axis: the direction of lengthening, 45° from the fault (pink, arrows pointing out)"},b:{symbol:E("B"),sceneRef:"b-axis",description:"B axis: in the fault at right angles to the slip (gray, dashed)"},ball:{symbol:ve("shaded"),sceneRef:"beach-ball",description:"The shaded quadrants of the beach ball: compressional first motions, containing T"},auxiliary:{symbol:ve("auxiliary plane"),sceneRef:"auxiliary",description:"Auxiliary plane: the second nodal plane, whose pole is the slip vector (dashed)"}},Y0={id:"components",html:Y(nm,pt,Hh,em,Qf,Vh,tm)+Y(Hh,pt,E("s"),E("cos"),qs,pt,ee("sStrike","strike-slip"))+Y(Vh,pt,E("s"),E("sin"),qs,pt,ee("sDip","dip-slip"))+Y(E("s"),pt,ee("slipLength","slip"),J(","),yt(.6),qs,pt,ee("rake","rake"))+`<small>${K(Tn(ne("e")))}<sub>strike</sub> points along strike (right-hand rule) and ${K(Tn(ne("e")))}<sub>up</sub> up the dip. Positive ${Me.lambda} means the hanging wall went up the dip.</small>`,symbols:[Qe.s,Qe.sStrike,Qe.sDip,Qe.lambda]},K0={id:"naming",html:Y(qs,pt,ee("rake","rake"),J("→"),yt(.3),ee("slipName","slip"))+Y(Hh,pt,ee("sStrike","strike-slip"))+Y(Vh,pt,ee("sDip","dip-slip"))+`<small>${Me.sDip} &gt; 0: reverse (a thrust if the dip is under 45°); ${Me.sDip} &lt; 0: normal. ${Me.sStrike} &gt; 0: sinistral; ${Me.sStrike} &lt; 0: dextral.</small>`,symbols:[Qe.lambda,Qe.s,Qe.sStrike,Qe.sDip]},Z0={id:"traction",html:Y(Pl,pt,ne("σ"),Pi,pt,ee("traction","traction"))+Y(po,pt,Pl,Xl,Le(J("("),Pl,J("⋅"),Pi,J(")")),Pi)+Y(pt,ee("tauVec","shear-stress"))+Y(wr,pt,Mn(po,Le(J("|"),po,J("|"))),J("→"),yt(.3),qs,pt,ee("rake","rake"))+Y(ve("slip:"),yt(.3),ee("slipName","slip"))+"<small>NED components (north, east, down) in MPa. 𝐧 points down into the footwall, so 𝐭 is the hanging wall’s push on it.</small>",symbols:[Qe.t,Qe.n,Qe.tau,Qe.sHat,Qe.lambda]},J0={id:"kinematic",html:Y(Dl,J("∝"),Pi,Qf,wr,J(":"),yt(),ee("pLine","p-axis"))+Y(im,J("∝"),Pi,Xl,wr,J(":"),yt(),ee("tLine","t-axis"))+Y(j0,pt,Pi,J("×"),wr,J(":"),yt(),ee("bLine","b-axis"))+"<small>Trend/plunge of the lower end of each axis.</small>",symbols:[Qe.p,Qe.tAxis,Qe.b,Qe.n,Qe.sHat]},Q0=Object.freeze([{id:"normal",label:"Normal",detail:"000°/60° E, λ −90°",strike:0,dip:60,rake:-90},{id:"thrust",label:"Thrust",detail:"000°/30° E, λ 90°",strike:0,dip:30,rake:90},{id:"strike-slip",label:"Strike-slip",detail:"000°/90°, λ 180°",strike:0,dip:90,rake:180},{id:"oblique",label:"Oblique",detail:"045°/60° SE, λ −55°",strike:45,dip:60,rake:-55}]),ev=Object.freeze({strike:90,dip:30,point:{x:-250,y:0,z:250}}),tv=Object.freeze({x:-300,y:50}),nv={id:"B8",status:"built",steps:[{id:"hanging-wall",label:"Hanging wall and footwall",title:"Which block is which?",activeLabel:"Hanging wall and footwall",body:`A fault is a surface the rock has slipped along. The block above it is the <strong>hanging wall</strong> and the block below it is the <strong>footwall</strong>. The names come from miners: in a tunnel dug along a fault, the hanging wall hangs over your head and the footwall is under your feet. As in B6, ${Me.n} is the pole of the fault pointing down into the footwall. A vertical fault has no block above the other, so it needs a convention: here the hanging wall is the block on the dip-direction side, 90° clockwise from strike.`,task:"Turn the fault with the strike and dip sliders. Hover each block and its name.",visualKind:"fault",controls:["strike","dip"],labOptions:{showWallLabels:!0,showPole:!0,showSlipVector:!1,slipped:!1},initialLabState:{strike:0,dip:60,rake:-90},equations:[{id:"walls",html:Y(Pi,pt,ee("nVec","pole"),J(":"),yt(),ee("nLine","pole"))+Y(ce("hanging-wall",ve("hanging wall")),J(":"),yt(.3),ve("above the fault"))+Y(ce("footwall",ve("footwall")),J(":"),yt(.3),ve("below it;"),yt(.3),Pi,yt(.2),ve("points in"))+"<small>NED components (north, east, down) and the pole’s trend/plunge.</small>",symbols:[Qe.n,Qe.hanging,Qe.foot]}],prompt:"A miner digs a tunnel along this fault, which dips 60° east. Which block is over the miner’s head?",choices:[{id:"hanging",label:"The hanging wall: the east block, above the fault",correct:!0,feedback:"Right. The hanging wall is the block above the fault plane, so it is overhead in the tunnel. On a fault dipping east it is the east block."},{id:"foot",label:"The footwall",correct:!1,feedback:"The footwall is under the miner’s feet: it is the block below the fault, the side the pole 𝐧 points into."},{id:"moved",label:"Whichever block moved down",correct:!1,feedback:"The names describe position, not motion. Either block can move up or down; the hanging wall is always the one above the fault."}]},{id:"slip-vector",label:"The slip vector",title:"The slip vector and its two parts",activeLabel:"Slip vector components",body:`When a fault slips, the hanging wall moves relative to the footwall by the <strong>slip vector</strong> ${Me.s} (green). ${Me.s} lies in the fault plane, so two directions in the plane are enough to describe it: along strike (the horizontal line in the plane) and up or down the dip. Split ${Me.s} into those parts, as you split vectors into components in M1 and M2: the strike-slip part ${Me.sStrike} and the dip-slip part ${Me.sDip}. The angle from the strike direction to ${Me.s}, measured in the fault plane, is the <strong>rake</strong> ${Me.lambda} (O4 measures the rake of a line; here the slip also has a sense, so ${Me.lambda} runs from −180° to 180°).`,task:`Change the rake ${Me.lambda}. Watch the hanging wall move and the two parts change.`,visualKind:"fault",controls:["rake"],labOptions:{showComponents:!0,showRake:!0,showWallLabels:!0,slipped:!0},initialLabState:{strike:0,dip:60,rake:-60},equations:[Y0],prompt:`A fault slipped 120 m at rake ${Me.lambda} = 30°. How long is its strike-slip part ${Me.sStrike}? (m)`,answer:{value:103.9,tolerance:.5,correctFeedback:"Correct: s cos λ = 120 × cos 30° = 103.9 m along strike. The other 60 m (120 × sin 30°) is up the dip.",wrong:[{value:60,tolerance:.5,feedback:"That is s sin λ, the dip-slip part. The rake is measured from the strike line, so the strike-slip part uses the cosine."},{value:120,tolerance:.5,feedback:"That is the whole slip. Only part of it runs along strike: project it with cos λ."},{value:69.3,tolerance:.5,feedback:"That is 120 × tan 30°. Projecting onto the strike line uses cos λ."},{value:138.6,tolerance:.5,feedback:"A component can never be longer than the vector: multiply by cos λ, don’t divide."}],fallbackFeedback:"Project the slip onto the strike line: s cos λ with s = 120 m and λ = 30°."}},{id:"classify",label:"Naming faults",title:"Name the fault from its slip",activeLabel:"Classifying fault slip",body:`Faults are named by their slip vector. <strong>Dip-slip</strong> faults move up or down the dip: <strong>normal</strong> if the hanging wall goes down (${Me.lambda} = −90°), <strong>reverse</strong> if it goes up (${Me.lambda} = 90°), and a reverse fault dipping less than 45° is a <strong>thrust</strong>. <strong>Strike-slip</strong> faults move along strike: standing on one block, if the other block moves to your right the fault is <strong>dextral</strong> (right-lateral, ${Me.lambda} = 180°), and if it moves left it is <strong>sinistral</strong> (${Me.lambda} = 0°). Slip with both parts is <strong>oblique</strong>, named by both. Here slip within 20° of a pure direction takes the pure name.`,task:"Make a thrust fault. Then try each quadrant of the rake.",visualKind:"fault",controls:["rake","dip"],labOptions:{showComponents:!0,showRake:!0,showWallLabels:!0,slipped:!0},initialLabState:{strike:0,dip:60,rake:-90},goal:{text:"Make a thrust: reverse slip on a fault dipping less than 45°.",check:i=>i.slipName==="thrust"},equations:[K0],prompt:`The hanging wall slips with ${Me.lambda} = −135°. What kind of fault is it?`,choices:[{id:"normal-dextral",label:"Oblique normal–dextral",correct:!0,feedback:"Right. sin(−135°) < 0, so the dip-slip part goes down the dip (normal), and cos(−135°) < 0, so the strike-slip part points against the strike direction (dextral). Set λ = −135° to see it."},{id:"normal-sinistral",label:"Oblique normal–sinistral",correct:!1,feedback:"The dip-slip part is normal, but check the strike-slip part: cos(−135°) is negative, so it points against the strike direction. That is dextral."},{id:"reverse-dextral",label:"Oblique reverse–dextral",correct:!1,feedback:"A negative rake sends the hanging wall down the dip: sin(−135°) < 0, so the dip-slip part is normal."},{id:"reverse-sinistral",label:"Oblique reverse–sinistral",correct:!1,feedback:"Both signs are negative: sin(−135°) < 0 means normal, and cos(−135°) < 0 means dextral."}]},{id:"separation",label:"Slip vs separation",title:"Separation is not slip",activeLabel:"Slip and separation",body:"We rarely see the slip vector itself. We see a marker that the fault cut: here a dike (a sheet of igneous rock) dipping 30° south. After the fault slipped, erosion planed the land flat, and the block now shows a map on top and cross-sections on its sides. On each, the two pieces of the dike are offset along the fault trace. That apparent offset is the <strong>separation</strong>. It depends on the slip and on how the marker is oriented, so it can be large when the slip is small, or point the wrong way.",task:`Look from above (Map) with ${Me.lambda} = −90°. Then find a slip direction that leaves the dike unbroken on the map.`,visualKind:"fault",controls:["rake","view"],labOptions:{blockMode:"cut",showDike:!0,dike:ev,showSeparation:!0,showSlipVector:!0,slipped:!0,slipLength:200},initialLabState:{strike:0,dip:60,rake:-90,view:"3d"},goal:{text:"Find a slip that leaves no separation on the map (under 10 m).",check:i=>i.mapSeparation!==null&&Math.abs(i.mapSeparation)<10},equations:[{id:"separation",html:Y(ce("separation",Ae(E("d"),ve("map"))),pt,Mn(Le(cp,J("⋅"),nm),Le(cp,J("⋅"),ne("u"))),pt,ee("mapSeparation","separation"))+Y(ve("looks like:"),yt(.3),ee("mapSense","separation"))+Y(ve("true slip:"),yt(.3),qs,pt,ee("rake","rake"))+Y(yt(0),ee("slipName","slip"))+`<small>${K(ne("m"))} is the dike’s pole and ${K(ne("u"))} the direction of the fault trace on the map (along strike). If ${Me.s} lies in the dike, ${K(ne("m"),J("⋅"),ne("s"))} = 0: no separation at all, however far the fault slipped.</small>`,symbols:[Qe.separation,Qe.m,Qe.s,Qe.lambda]}],prompt:`With ${Me.lambda} = −90°, the hanging wall slid straight down the dip. Which way does the offset dike on the map make the fault look?`,choices:[{id:"sinistral",label:"Sinistral (left-lateral)",correct:!0,feedback:"Right: the map shows 300 m of apparent left-lateral separation, though the slip had no strike-slip part at all. Dropping the hanging wall and eroding it flat moves the outcrop of the south-dipping dike north. A map alone cannot give the slip."},{id:"dextral",label:"Dextral (right-lateral)",correct:!1,feedback:"Look from above (Map). Standing on the west block and facing the fault, the east piece of the dike lies to your left: that looks sinistral."},{id:"normal",label:"Normal: the map shows the drop",correct:!1,feedback:"A map is a horizontal surface. It shows where the dike’s trace meets the fault, not how far the block dropped, and here that offset runs along the fault."}]},{id:"well",label:"Missing and repeated beds",title:"Faults in a well: missing and repeated beds",activeLabel:"Stratigraphic separation",body:"Below ground, geologists find faults in wells. A vertical well that crosses a fault passes from the hanging wall into the footwall. Across a <strong>normal</strong> fault the hanging wall dropped, so the well skips part of the sequence: beds are <strong>missing</strong>. Across a <strong>reverse</strong> fault the hanging wall rose, so the well meets part of the sequence twice: beds are <strong>repeated</strong>. For flat-lying beds the missing or repeated thickness, the stratigraphic separation, equals the <strong>throw</strong>, the vertical part of the slip.",task:"Switch between normal and reverse slip and compare the well with the normal sequence.",visualKind:"fault",controls:["rake","view"],labOptions:{blockMode:"cut",showWell:!0,well:tv,showSlipVector:!0,slipped:!0,panel:"well",slipLength:150},initialLabState:{strike:0,dip:60,rake:-90,view:"3d"},equations:[{id:"throw",html:Y(ce("strat-gap",ve("throw")),pt,Le(J("|"),Ae(E("s"),E("D")),J("|")),pt,ee("throw","strat-gap"))+Y(ce("well",ve("in the well:")),yt(.3),ee("wellGap","strat-gap"))+`<small>${K(Ae(E("s"),E("D")))} is the down (D) component of ${Me.s}. Here s = 150 m on a fault dipping 60°; the log beside the block names the beds.</small>`,symbols:[Qe.throw,Qe.well,Qe.s]}],prompt:"A well log shows beds C and D twice. What kind of fault did the well cross?",choices:[{id:"reverse",label:"A reverse fault",correct:!0,feedback:"Right. The hanging wall rose, so the well drills through C and D in the hanging wall, crosses the fault, and meets C and D again in the footwall. Set λ = 90°: in this block beds F to H appear twice."},{id:"normal",label:"A normal fault",correct:!1,feedback:"A normal fault drops the hanging wall, so the well goes from higher beds straight into lower ones: part of the sequence is missing, not repeated."},{id:"strike-slip",label:"A strike-slip fault",correct:!1,feedback:"Pure strike-slip moves flat beds sideways, so both walls hold each bed at the same depth: nothing is missing or repeated. Try λ = 180°."}]},{id:"slickenlines",label:"Slickenlines",title:"Slickenlines record the slip",activeLabel:"Slickenlines and rake",body:"Where a fault surface is exposed, slip leaves marks on it. <strong>Slickenlines</strong> are grooves and mineral fibers parallel to the slip. Here the hanging wall is lifted away so you can see the footwall’s surface, and the stereonet shows the fault as a great circle with the slip as a point. A slickenline is a line, so it gives a rake r from 0° to 180° (O4), measured from strike toward the dip, but not which way the block moved. For that, geologists read small steps on the surface: on many surfaces it feels smooth when you rub it the way the missing block moved. The steps drawn here are schematic.",task:`Change ${Me.lambda} and follow the slickenlines, the arrow on the stereonet, and the plunge.`,visualKind:"fault",controls:["rake"],labOptions:{showHangingWall:!1,showSlickenlines:!0,showRake:!0,showSlipVector:!1,slipped:!1,panel:"net",net:{slip:!0,pole:!1}},initialLabState:{strike:0,dip:60,rake:-60},equations:[{id:"plunge",html:Y(E("sin"),E("p"),pt,E("sin"),E("r"),yt(.2),E("sin"),E("δ"),J("→"),yt(.3),E("p"),pt,ee("plunge","slip"))+Y(ve("slickenline:"),yt(.3),E("r"),pt,ee("lineRake","rake"))+Y(ve("trend/plunge:"),yt(.3),ee("slipLine","slip"))+"<small>r is the rake of the line (0–180°), δ the fault’s dip, p the plunge. From the slip’s rake: r = −λ when λ ≤ 0, and r = 180° − λ when λ &gt; 0.</small>",symbols:[Qe.lambda,Qe.s]}],prompt:"Slickenlines on a fault dipping 60° have rake r = 40°. What is their plunge? (degrees)",answer:{value:33.8,tolerance:.5,correctFeedback:"Correct: sin p = sin 40° × sin 60° = 0.557, so p = 33.8°. The plunge is always less than both the rake and the dip.",wrong:[{value:40,tolerance:.5,feedback:"That is the rake, measured inside the fault plane. The plunge is measured down from horizontal: sin p = sin r sin δ."},{value:34.6,tolerance:.3,feedback:"That is 40 × sin 60°. Multiply the sines, then take the inverse sine: sin p = sin r sin δ."},{value:60,tolerance:.5,feedback:"That is the dip. Only a line straight down the dip (r = 90°) plunges as steeply as the fault dips."},{value:20,tolerance:.5,feedback:"Use the sines: sin p = sin 40° × sin 60° = 0.557."}],fallbackFeedback:"Use sin p = sin r sin δ with r = 40° and δ = 60°, then take the inverse sine."}},{id:"wallace-bott",label:"Which way does it slip?",title:"Stress sets the slip direction",activeLabel:"The Wallace–Bott hypothesis",body:`What sets the direction of slip? In B6 the stress pushed on a plane with a traction ${Me.t} = ${Me.sigma}${Me.n} (orange), and its shear part ${Me.tau} (pink) pointed the way the hanging wall would slide. The <strong>Wallace–Bott hypothesis</strong> says the fault slips exactly that way: ${Me.sHat} is parallel to ${Me.tau}. It assumes a planar fault and one uniform stress. On a fault that is oblique to the stress axes, ${Me.tau} is usually oblique too, so the slip is oblique.`,task:"Turn the fault and change the stress ratio. Watch the slip on the stereonet. Press Slip to move the hanging wall.",visualKind:"fault",controls:["regime","ratio","strike","dip","slip"],labOptions:{stress:!0,slipSource:"stress",showStress:!0,showTraction:!0,showSlipVector:!0,slipped:!1,panel:"net",net:{slip:!0,axes:!0,pickable:!0}},initialLabState:{strike:135,dip:60,regime:"normal",ratio:.5},equations:[Z0,{id:"ratio",html:Y(E("φ"),pt,Mn(Le(Ri(2),Xl,Ri(3)),Le(Ri(1),Xl,Ri(3))),pt,ee("ratio","sigma-1"))+"<small>The slip direction depends only on the directions of the principal stresses and on φ, not on how large the stresses are.</small>",symbols:[Qe.s1,Qe.s3]}],prompt:`${Me.s1} is vertical and ${Me.s3} points east–west. A fault strikes 135° and dips 60° to the southwest. Which way does the hanging wall slide?`,choices:[{id:"oblique",label:"Down the dip, but swung toward the west (oblique)",correct:!0,feedback:"Right: λ ≈ −124°, oblique normal–dextral. The least compression σ3 points east–west, so the shear traction pulls the hanging wall west of straight down-dip (southwest)."},{id:"down-dip",label:"Straight down the dip (pure normal)",correct:!1,feedback:"Pure dip-slip needs the fault to contain σ2 (strike north–south here). This fault is oblique to σ2 and σ3, so τ is oblique: look at the pink arrow."},{id:"along-strike",label:"Horizontally along strike",correct:!1,feedback:"With σ1 vertical the shear traction always has a large down-dip part. Look at the pink τ arrow and the green slip point on the stereonet."}]},{id:"pt-axes",label:"P and T axes",title:"Kinematic axes: P, T, and B",activeLabel:"P, T, and B axes",body:`Seismologists sum up a fault’s motion with three axes. The <strong>P axis</strong> is the direction of shortening and the <strong>T axis</strong> the direction of lengthening. Both lie at 45° to the fault, in the plane that holds ${Me.n} and ${Me.sHat}, and they are built from those two unit vectors: P ∝ ${Me.n} + ${Me.sHat} and T ∝ ${Me.n} − ${Me.sHat}. The hanging wall pushes across the fault along ${Me.n} and drags along ${Me.sHat}, and P lies halfway between the push and the drag. The <strong>B axis</strong>, ${Me.n} × ${Me.sHat}, lies in the fault at right angles to the slip; nothing moves along it.`,task:"Change the fault and the slip. Watch P and T stay 45° from the fault.",visualKind:"fault",controls:["strike","dip","rake"],labOptions:{showKinematic:!0,showConstruction:!0,showPole:!0,showSlipVector:!1,slipped:!1,panel:"net",net:{slip:!0,kinematic:!0,pole:!0}},initialLabState:{strike:0,dip:60,rake:-90},equations:[J0],prompt:`A normal fault dips 60° east and slips straight down the dip (${Me.lambda} = −90°). Where is its P axis?`,choices:[{id:"steep",label:"Plunging 75°: nearly vertical",correct:!0,feedback:"Right: P plunges 75° west, 45° from the fault. T is nearly horizontal (15° toward the east). A normal fault shortens the crust vertically and stretches it horizontally."},{id:"horizontal",label:"Horizontal, across the strike",correct:!1,feedback:"That is close to T, the lengthening axis (plunging 15° east). P is 90° from T."},{id:"dip",label:"Down the dip of the fault",correct:!1,feedback:"That is the slip direction itself. P is 45° from the fault, between the push 𝐧 and the slip 𝐬̂."}]},{id:"beach-ball",label:"Beach balls",title:"Fault-plane solutions: the beach ball",activeLabel:"Beach balls",body:"An earthquake is a fault slipping suddenly. Seismometers around the world record whether the first ground motion was a push (compressional) or a pull (dilatational). The pattern splits the sphere into four quadrants, separated by two <strong>nodal planes</strong>: the fault and the <strong>auxiliary plane</strong>, whose pole is the slip vector. Shading the compressional quadrants on a stereonet gives the <strong>fault-plane solution</strong>, or beach ball. The shaded quadrants hold T and the white ones hold P. Shaded does not mean the rock is squeezed there: it marks where the first motion pushed outward.",task:"Pick each fault type and compare the beach balls. Then change the slip.",visualKind:"fault",controls:["presets","rake","strike","dip"],labOptions:{showKinematic:!0,showSlipVector:!1,slipped:!1,panel:"net",net:{slip:!0,kinematic:!0,auxiliary:!0,ball:!0}},initialLabState:{strike:0,dip:60,rake:-90,preset:"normal"},presets:Q0,equations:[{id:"ball",html:Y(ce("beach-ball",ve("shaded")),J(":"),yt(.3),Le(J("("),ne("v"),J("⋅"),Pi,J(")"),J("("),ne("v"),J("⋅"),wr,J(")")),J("<"),Je("0"))+Y(ce("fault",ve("fault")),yt(.2),J("⊥"),Pi,J(","),yt(.5),ce("auxiliary",ve("auxiliary")),yt(.2),J("⊥"),wr)+Y(Dl,J(":"),yt(.2),ee("pLine","p-axis"),J(","),yt(.6),im,J(":"),yt(.2),ee("tLine","t-axis"))+`<small>${K(ne("v"))} is a direction leaving the earthquake. Swapping ${Me.n} and ${Me.sHat} gives the same ball: the seismic waves alone cannot tell which nodal plane slipped.</small>`,symbols:[Qe.ball,Qe.auxiliary,Qe.n,Qe.sHat,Qe.p,Qe.tAxis]}],prompt:"An earthquake’s beach ball has a shaded center and white sides. What kind of fault slipped?",choices:[{id:"thrust",label:"A thrust (reverse) fault",correct:!0,feedback:"Right. A thrust has T nearly vertical, so the center of the net (straight down) is in a shaded T quadrant, and P is nearly horizontal, at the white sides."},{id:"normal",label:"A normal fault",correct:!1,feedback:"Pick Normal: P is nearly vertical, so its beach ball has a white center and shaded sides, the reverse of this one."},{id:"strike-slip",label:"A strike-slip fault",correct:!1,feedback:"Pick Strike-slip: both nodal planes are vertical, so the ball is cut into four quadrants like a pie, with no shaded center."}]},{id:"pt-not-stress",label:"P and T are not σ1 and σ3",title:"P and T are not the principal stresses",activeLabel:"Kinematic axes vs stress axes",body:`It is tempting to read P as ${Me.s1} and T as ${Me.s3}. They are different things: P and T come from the fault’s slip alone. Tilt ${Me.s1} in the vertical plane across this fault’s strike (${Me.s2} stays along strike). The shear traction still points straight down the dip, so the slip, P, T, and the beach ball stay the same while ${Me.s1} wanders across the white quadrant. Only when ${Me.s1} crosses a nodal plane does the slip change. Friction (B6) favors faults about 25–30° from ${Me.s1}, not the 45° of P. So one fault allows a wide range of stress directions; finding the stress (stress inversion) needs many faults of different orientations.`,task:`Tilt ${Me.s1} and watch the beach ball. Find where the slip flips.`,visualKind:"fault",controls:["tilt"],labOptions:{stress:!0,slipSource:"stress",showStress:!0,showKinematic:!0,showSlipVector:!0,slipped:!0,panel:"net",net:{slip:!0,kinematic:!0,auxiliary:!0,ball:!0,axes:!0}},initialLabState:{strike:0,dip:60,regime:"normal",ratio:.5,tilt:0},equations:[{id:"angle",html:Y(ve("angle from"),yt(.3),ce("sigma-1",Ri(1)),yt(.3),ve("to"),yt(.3),Dl,pt,ee("angleS1P","p-axis"))+Y(qs,pt,ee("rake","rake"),J("→"),yt(.3),ee("slipName","slip"))+Y(ce("sigma-1",Ri(1)),J(":"),yt(.3),ee("s1Line","sigma-1"),J(","),yt(.6),Dl,J(":"),yt(.3),ee("pLine","p-axis"))+"<small>The fault strikes 000° and dips 60° east. Trend/plunge in degrees.</small>",symbols:[Qe.s1,Qe.p,Qe.lambda]}],prompt:`${Me.s1} tilts across a wide range, yet the beach ball does not change. What does that show?`,choices:[{id:"range",label:"One fault’s P and T fit a wide range of σ1 directions",correct:!0,feedback:"Right. P and T describe the slip, and a whole range of stress states produces the same slip on one fault. Here σ1 can lie anywhere between the fault plane and the auxiliary plane."},{id:"equal",label:"P is always exactly σ1",correct:!1,feedback:"Tilt σ1 and read the angle between σ1 and P: it changes while P stays put. They coincide only by chance."},{id:"no-effect",label:"Stress has no effect on slip",correct:!1,feedback:"It does: tilt σ1 past the fault plane (about 30° east) and the shear traction reverses, so the fault would slip the other way."}]},{id:"predict-rake",label:"Predict the rake",title:"Predict the slip from the stress",activeLabel:"Predicting the rake",body:`Put it together. ${Me.s
