its on the y axis. Moving parallel to y keeps the tip at the same x.`}]},{id:"magnitude-2d",label:"Length in 2D",title:"The length of a vector comes from a right triangle",activeLabel:"Magnitude from components",body:`The two components meet at a right angle (the small square marker), so the vector is the long side of a right triangle. Pythagoras gives its length, called the magnitude ${Cs}. The magnitude is always positive, whatever the signs of the components.`,task:`Work out ${Cs} for ${Hr} = (3, −4) before the scene shows it.`,visualKind:"vector-lab",dimension:2,controls:["components"],labOptions:{...aa,showTriangles:!0},initialLabState:{v:{x:3,y:-4,z:0}},revealAfterAnswer:["magnitude"],equations:[{id:"magnitude-2d",html:Y($n(hs),Ut,Cr(ni(ds),vi,ni(us)))+Y(Ut,Cr(ee("vx2","comp-x"),vi,ee("vy2","comp-y")),Ut,ee("magnitude","vector")),symbols:[Ve.v,Ve.vx,Ve.vy]}],prompt:`What is ${Cs} for ${Hr} = (3, −4)?`,answer:{value:5,tolerance:.01,correctFeedback:"Correct: √(3² + (−4)²) = √(9 + 16) = √25 = 5. Squaring removes the sign, so direction never makes a vector shorter.",wrong:[{value:7,feedback:"That adds the sizes 3 + 4. The components are at right angles, so they combine by Pythagoras, not by adding."},{value:-1,feedback:"3 + (−4) adds the signed components. A length is never negative: square each component first."},{value:1,feedback:"Adding or subtracting components does not give the length. Square each one, add, then take the square root."},{value:25,feedback:`25 is ${zo}, the sum of the squares. Take the square root.`}],fallbackFeedback:"Square each component, add the squares, then take the square root: √(3² + (−4)²)."}},{id:"jump-to-3d",label:"Jump to 3D",title:"In 3D the length takes two right triangles",activeLabel:"Adding the z axis",body:`Add a third axis, z, pointing up out of the x–y plane. The tip now also has a height, ${Nc}. Its length takes two right triangles. The first lies on the floor, from the origin to the point under the tip; its long side is d. The second stands on d and climbs straight up by ${Nc}. Put them together and the 2D formula gains one more term.`,task:`Press 3D to lift the vector off the page, and orbit to see both triangles. Then find ${Cs} for ${Hr} = (2, 3, 6).`,visualKind:"vector-lab",dimension:2,controls:["dimension","components"],labOptions:{...aa,showTriangles:!0},initialLabState:{v:{x:2,y:3,z:6}},revealAfterAnswer:["magnitude"],equations:[{id:"floor-diagonal",html:Y(ni(Bu),Ut,ni(ds),vi,ni(us),Ut,ee("dSquared","xy-diagonal")),symbols:[Ve.d,Ve.vx,Ve.vy]},{id:"stacked-triangles",html:Y(ni($n(hs)),Ut,ni(Bu),vi,ni(pr))+Y(Ut,ni(ds),vi,ni(us),vi,ni(pr)),symbols:[Ve.v,Ve.d,Ve.vz]},Uc],prompt:`What is ${Cs} for ${Hr} = (2, 3, 6)?`,answer:{value:7,tolerance:.01,correctFeedback:`Correct: d² = 4 + 9 = 13, then ${zo} = 13 + 36 = 49, so ${Cs} = 7. The same rule works in 2D and 3D; 3D just has one more square.`,wrong:[{value:11,feedback:"That adds the components 2 + 3 + 6. Use Pythagoras twice: square, add, square root."},{value:Math.sqrt(13),tolerance:.02,feedback:`That is d, the floor diagonal: you have the first triangle. Now climb ${Nc} = 6 with the second one.`},{value:49,feedback:`49 is ${zo}. Take the square root.`}],fallbackFeedback:`First the floor: d² = 2² + 3². Then climb: ${zo} = d² + 6². Take the square root at the end.`}},{id:"negative-components",label:"Negative components",title:"A sign gives a direction, not a size",activeLabel:"Reading signs from the picture",body:"A negative component means the tip lies on the negative side of that axis, where the axis is drawn dashed. For z, negative means below the floor. In the magnitude every component is squared, so a sign never makes a vector shorter.",task:"Point the vector toward −x, +y, and −z. A plain drag moves the tip across the floor. Hold Shift while dragging to move it up or down, or type the components.",visualKind:"vector-lab",dimension:3,controls:["components"],labOptions:aa,initialLabState:{v:{x:3,y:2,z:4}},goal:{text:"v points toward −x, +y, and −z (every component nonzero).",check:({v:i})=>i.x<0&&i.y>0&&i.z<0},equations:[Oc,Uc],prompt:"Which vector is longer: p = (−4, 0, 0) or q = (3, 0, 0)?",choices:[{id:"p",label:"p is longer",correct:!0,feedback:"Right. |p| = 4 and |q| = 3. The minus sign says only that p points along −x."},{id:"q",label:"q is longer",correct:!1,feedback:"A negative component is not a small one. |p| = √((−4)²) = 4, which is more than 3."},{id:"same",label:"They are the same length",correct:!1,feedback:"Their lengths are 4 and 3. Signs change the direction, not the length."}]},{id:"unit-vector",label:"Unit vectors",title:"A unit vector keeps only the direction",activeLabel:"Unit vector v̂ = v / |v|",body:`Divide a vector by its own length and you get a vector of length 1 that points the same way: the unit vector ${Gu} (read "v hat"). Its tip always lands on the sphere of radius 1 around the origin. Structural geology uses unit vectors for pure directions such as plane normals, lineations, and fold hinges, where only the direction matters.`,task:`Drag ${Hr} anywhere. ${Gu} follows its direction but never leaves the unit sphere.`,visualKind:"vector-lab",dimension:3,controls:["components"],labOptions:{...aa,showUnit:!0,view:"close"},initialLabState:{v:{x:2,y:-1,z:2}},equations:[{id:"unit-definition",html:Y($u,Ut,Mn(hs,$n(hs)),Ut,Mn(Ln(Ai(ds,us,pr)),ee("magnitude","vector")))+Y(Ut,ee("unit","unit-vector")),symbols:[Ve.unit,Ve.v,Ve.vx,Ve.vy,Ve.vz]},{id:"unit-length",html:Y($n($u),Ut,ee("unitMagnitude","unit-vector")),symbols:[Ve.unit]}],prompt:"Which of these could be a unit vector?",choices:[{id:"ones",label:"(1, 1, 0)",correct:!1,feedback:"Its length is √(1 + 1) = √2 ≈ 1.41, not 1."},{id:"six-eight",label:"(0.6, 0, −0.8)",correct:!0,feedback:"Right. 0.6² + 0² + (−0.8)² = 0.36 + 0.64 = 1. Each component of a unit vector lies between −1 and 1, and their squares add to exactly 1."},{id:"halves",label:"(0.5, 0.5, 0.5)",correct:!1,feedback:"Its length is √0.75 ≈ 0.87. Small components are not enough: the squares must add to exactly 1."}]},{id:"add-vectors",label:"Adding vectors",title:"Add vectors tip to tail, or component by component",activeLabel:"Vector addition",body:`To add b to a, start b where a ends. The sum ${ns} runs from the origin to the final tip. Now look along the axes: on each one, a’s part (solid bar) and b’s part (dashed bar) stack end to end, and the green dot marks their total. The two constructions always land on the same tip, because adding arrows tip to tail is the same as adding their matching components.`,task:`Predict ${ns}, then drag either round handle and check that each stack ends at a corner of the sum’s dashed box.`,visualKind:"vector-lab",dimension:3,controls:["components-a","components-b"],labOptions:{layout:"sum",showComponents:!1,showStacks:!0,draggable:["v","b"]},initialLabState:{v:{x:4,y:1,z:1},b:{x:-1,y:3,z:2}},revealAfterAnswer:["sum","stackX","stackY","stackZ"],equations:[{id:"sum-components",html:Y(o0,Ut,i0(Ic("x"),Ic("y"),Ic("z"))),symbols:[Ve.sum,Ve.stackX,Ve.stackY,Ve.stackZ]},{...Wu,symbols:[Ve.a,Ve.b]}],prompt:`a = (4, 1, 1) and b = (−1, 3, 2). What is ${ns}?`,choices:[{id:"right",label:"(3, 4, 3)",correct:!0,feedback:"Right: (4 + (−1), 1 + 3, 1 + 2) = (3, 4, 3). Check it against the stacks on each axis."},{id:"sign",label:"(5, 4, 3)",correct:!1,feedback:`Watch the sign of ${d0}: 4 + (−1) = 3. On the x axis, b’s dashed bar runs back toward zero.`},{id:"multiply",label:"(−4, 3, 2)",correct:!1,feedback:"That multiplies matching components. Addition adds them: (4 + (−1), 1 + 3, 1 + 2)."}]},{id:"aim-the-sum",label:"Aim the sum",title:"Use components to steer a sum",activeLabel:"Steering a + b",body:`Component thinking turns a geometric puzzle into arithmetic. For ${ns} to lie along the x axis, its y and z components must be zero. So b must cancel a’s y and z parts exactly, and anything left in x survives.`,task:`Drag b’s yellow handle (or type b’s components) until ${ns} lies along the x axis.`,visualKind:"vector-lab",dimension:3,controls:["components-a","components-b"],labOptions:{layout:"sum",showComponents:!1,showStacks:!0,draggable:["b"]},initialLabState:{v:{x:3,y:2,z:2},b:{x:1,y:1,z:1}},goal:{text:`${ns} lies along the x axis (y and z components zero, x not zero).`,check:({sum:i})=>i.y===0&&i.z===0&&i.x!==0},equations:[{...Wu,symbols:[Ve.a,Ve.b,Ve.stackX,Ve.stackY,Ve.stackZ]}],prompt:`With a = (3, 2, 2), which b makes ${ns} lie along the x axis?`,choices:[{id:"cancel",label:"b = (1, −2, −2)",correct:!0,feedback:`Right: ${ns} = (4, 0, 0). Now build it in the scene.`},{id:"copy",label:"b = (1, 2, 2)",correct:!1,feedback:`That doubles a’s y and z parts instead of canceling them: ${ns} = (4, 4, 4).`},{id:"cancel-x",label:"b = (−3, 0, 0)",correct:!1,feedback:"That cancels the x part and leaves (0, 2, 2), which is off the x axis."}]},{id:"scale-vector",label:"Scaling",title:"Scaling stretches, shrinks, or reverses a vector",activeLabel:"Scalar multiple c v",body:"Multiplying a vector by a number c multiplies every component by c. The arrow stays on the same line through the origin. It grows when c is greater than 1, shrinks when c is between 0 and 1, and flips to point the opposite way when c is negative. Its length is |c| times the original length.",task:"Slide c through 1, 0.5, 0, and −1. Watch the green arrow and its components.",visualKind:"vector-lab",dimension:3,controls:["scalar","components"],labOptions:{...aa,showScaled:!0},initialLabState:{v:{x:2,y:1,z:2},scalar:2},equations:[{id:"scaled-components",html:Y(Hu,Ut,Ln(Ai(Le(E("c"),ds),Le(E("c"),us),Le(E("c"),pr))))+Y(Ut,ee("scaled","scaled-vector")),symbols:[Ve.scaled,Ve.vx,Ve.vy,Ve.vz]},{id:"scaled-length",html:Y($n(Hu),Ut,$n(E("c")),$n(hs))+Y(Ut,ee("absC"),J("×"),ee("magnitude","vector"),Ut,ee("scaledMagnitude","scaled-vector")),symbols:[Ve.scaled,Ve.v]}],prompt:"What does multiplying by c = −1 do to a vector?",choices:[{id:"reverse",label:"Reverses its direction and keeps its length",correct:!0,feedback:"Right. −v has the same length and points the opposite way. Later this is how a push becomes a pull, or how a fault’s slip sense is reversed."},{id:"shorter",label:"Makes it shorter",correct:!1,feedback:`Slide c to −1: the length stays |−1| × ${Cs} = ${Cs}. Only the direction flips.`},{id:"zero",label:"Makes it zero",correct:!1,feedback:"Only c = 0 gives the zero vector. c = −1 flips the vector without shrinking it."}]},{id:"where-vectors-show-up",label:"Vectors in geology",title:"Where this shows up: three vectors from geology",activeLabel:"Vectors in structural geology",body:"Every directional quantity in structural geology is a vector: the force pushing on a rock face, the slip of one fault block past another, the line along a fold’s hinge. Each is an arrow with components, exactly like the vectors you just built. Here z still points up; lesson O1 moves to the geological frame of north, east, and down.",task:"Pick each example. The components and the magnitude work the same way every time.",visualKind:"vector-lab",dimension:3,controls:["context","components"],labOptions:{...aa,context:"rock-face"},initialLabState:{v:{x:.5,y:1,z:-3},context:"rock-face"},contexts:u0,equations:[{...Oc,html:`${Oc.html}<small>The rock, fault, and fold are illustrative sketches. The vector and its components are exact.</small>`},Uc]}]},f0=ce("vector",ne("v")),Ba=ce("vector",$n(ne("v"))),m0=ce("vector",Tn(ne("v"))),g0=ce("unit-vector",Tn(ne("v"))),ps=ce("comp-x",Ae(E("v"),E("x"))),fs=ce("comp-y",Ae(E("v"),E("y"))),Vr=ce("comp-z",Ae(E("v"),E("z"))),Ll=ce("comp-x-prime",Ks("v","x")),zh=ce("comp-y-prime",Ks("v","y")),fi=ce("angle-alpha",E("α")),Fc=ce("angle-beta",E("β")),zc=ce("angle-gamma",E("γ")),gs=ce("angle-theta",E("θ")),Bc=ce("elevation-angle",E("ε")),v0=ce("xy-diagonal",E("d")),x0=ce("curve-cos2",Le(es(E("cos"),Je("2")),E("θ"))),b0=ce("curve-sincos",Le(E("sin"),E("θ"),E("cos"),E("θ"))),Ye=J("="),gi=J("+"),ms=i=>Le(E("cos"),i),fr=i=>Le(E("sin"),i),$a=i=>es(i,Je("2")),Bo=i=>Le(es(E("cos"),Je("2")),i),qu=Mn(Je("1"),Je("2")),y0=es(E("tan"),Le(J("−"),Je("1"))),$o=i=>`<small>${i}</small>`,me={v:K(ne("v")),absv:K($n(ne("v"))),vhat:K(Tn(ne("v"))),vx:K(Ae(E("v"),E("x"))),vy:K(Ae(E("v"),E("y"))),vz:K(Ae(E("v"),E("z"))),vxp:K(Ks("v","x")),vyp:K(Ks("v","y")),alpha:K(E("α")),beta:K(E("β")),gamma:K(E("γ")),theta:K(E("θ")),eps:K(E("ε")),xp:K(E("x′")),yp:K(E("y′"))},xt={v:{symbol:ne("v")},absv:{symbol:$n(ne("v")),sceneRef:"vector",description:"Length of the white arrow"},vhatUnit:{symbol:Tn(ne("v")),sceneRef:"vector",description:"The white arrow: length 1, so its tip stays on the circle"},vhat:{symbol:Tn(ne("v")),sceneRef:"unit-vector",description:"Green dotted arrow of length 1 along v, ending on the unit sphere"},vx:{symbol:Ae(E("v"),E("x")),sceneRef:"comp-x",description:"Blue solid arrow along x: the side of the triangle next to α"},vy:{symbol:Ae(E("v"),E("y")),sceneRef:"comp-y",description:"Orange solid arrow parallel to y: the side opposite α"},vz:{symbol:Ae(E("v"),E("z")),sceneRef:"comp-z",description:"Pink arrow parallel to z: the vertical leg"},vxp:{symbol:Ks("v","x"),sceneRef:"comp-x-prime",description:"Blue dashed arrow along the turned axis x′"},vyp:{symbol:Ks("v","y"),sceneRef:"comp-y-prime",description:"Orange dashed arrow parallel to the turned axis y′"},alpha:{symbol:E("α"),sceneRef:"angle-alpha",description:"Blue arc: the angle from the +x axis to the arrow"},beta:{symbol:E("β"),sceneRef:"angle-beta",description:"Orange arc: the angle from the +y axis to the arrow"},gamma:{symbol:E("γ"),sceneRef:"angle-gamma",description:"Pink arc: the angle from the +z axis to the arrow"},theta:{symbol:E("θ"),sceneRef:"angle-theta",description:"Green arc: how far the dashed axes x′, y′ are turned from x, y"},eps:{symbol:E("ε"),sceneRef:"elevation-angle",description:"Violet arc: the angle between the floor and the arrow"},d:{symbol:E("d"),sceneRef:"xy-diagonal",description:"Gray dashed line on the floor: the arrow’s shadow"},cos2:{symbol:Le(es(E("cos"),Je("2")),E("θ")),sceneRef:"curve-cos2",description:"Blue solid curve in the plot"},sincos:{symbol:Le(E("sin"),E("θ"),E("cos"),E("θ")),sceneRef:"curve-sincos",description:"Pink dashed curve in the plot"}},_0={id:"rotate-x",html:Y(Ll,Ye,ps,ms(gs),gi,fs,fr(gs))+Y(Ye,ee("vxpSub","comp-x-prime"))+Y(Ye,ee("vxp","comp-x-prime")),symbols:[xt.vxp,xt.vx,xt.vy,xt.theta]},w0={id:"rotate-y",html:Y(zh,Ye,J("−"),ps,fr(gs),gi,fs,ms(gs))+Y(Ye,ee("vypSub","comp-y-prime"))+Y(Ye,ee("vyp","comp-y-prime")),symbols:[xt.vyp]},Gr={layout:"single",showComponents:!0,draggable:["v"]},$c={layout:"single",showComponents:!0,draggable:[],rotatedAxes:!0,showPrimedComponents:!0},Hc=Object.freeze([{id:"line-plunge",label:"A line and how steeply it plunges",usedIn:"O1",vector:{x:3,y:2,z:2.5},dimension:3,options:{showTriangles:!0,showElevation:!0}},{id:"tilted-plane",label:"A plane tilted inside a rock",usedIn:"S5",vector:{x:3,y:3.5,z:0},dimension:2,theta:30,options:{showComponents:!1,rotatedAxes:!0,showPrimedComponents:!0,planeTrace:!0}}]),S0={id:"M2",status:"built",steps:[{id:"unit-circle",label:"The unit circle",title:"A unit vector’s components are its cosine and sine",activeLabel:"The unit circle",body:`The white arrow has length 1 and makes an angle ${me.alpha} with the +x axis, measured counterclockwise. Its tip always lies on the circle of radius 1. The arrow and its two components form a right triangle whose longest side is 1. By the definitions of cosine and sine, the side along x is cos ${me.alpha} and the side along y is sin ${me.alpha}. So the components of a unit vector are simply (cos ${me.alpha}, sin ${me.alpha}).`,task:"Drag the tip around the circle, or use the angle slider. Watch the signs of the components change from quadrant to quadrant.",visualKind:"vector-lab",dimension:2,controls:["angle"],labOptions:{...Gr,polar:!0,fixedLength:1,showAngle:!0,showUnitCircle:!0,view:"close"},initialLabState:{v:Rn(1,40)},equations:[{id:"unit-components",html:Y(m0,Ye,Ln(Ai(ps,fs)),Ye,Ln(Ai(ms(fi),fr(fi))))+Y(Ye,ee("v","vector"))+Y(fi,Ye,ee("alpha","angle-alpha")),symbols:[xt.vhatUnit,xt.vx,xt.vy,xt.alpha]},{id:"unit-pythagoras",html:Y(Bo(fi),gi,Le(es(E("sin"),Je("2")),fi),Ye,Je("1"))+Y(ee("vx2","comp-x"),gi,ee("vy2","comp-y"),Ye,ee("sumSquares","vector"))+$o("Pythagoras on a triangle whose longest side is 1."),symbols:[]}],prompt:`Drag the tip to ${me.alpha} = 120°. Which component is negative?`,choices:[{id:"vx",label:`${me.vx}`,correct:!0,feedback:"Right: cos 120° = −0.5. Past 90° the tip is left of the y axis, so the x component is negative, while sin 120° ≈ 0.87 is still positive."},{id:"vy",label:`${me.vy}`,correct:!1,feedback:"sin α stays positive from 0° to 180°, because the tip is above the x axis. Drag to 120° and look at the blue arrow."},{id:"both",label:"Both",correct:!1,feedback:"Both are negative only in the third quadrant, from 180° to 270°. At 120° the tip is up and to the left."}]},{id:"length-and-angle",label:"Length and angle",title:"Components from a length and an angle",activeLabel:"Components from length and angle",body:`A vector of any length is a unit vector stretched by that length, so both components stretch too: ${me.vx} = ${me.absv} cos ${me.alpha} and ${me.vy} = ${me.absv} sin ${me.alpha}. This is the step you take whenever a measurement gives a size and a direction, such as a force of 5 kN pushing 30° above the horizontal. Set your calculator to degrees: cos 30 in radians is a completely different number.`,task:"Answer the question first. Then change the length and the angle and watch both components follow.",visualKind:"vector-lab",dimension:2,controls:["length","angle"],labOptions:{...Gr,polar:!0,showAngle:!0},initialLabState:{v:Rn(5,30)},revealAfterAnswer:["vx","vy"],equations:[{id:"polar-x",html:Y(ps,Ye,Ba,ms(fi),Ye,ee("vxSub","comp-x"),Ye,ee("vx","comp-x")),symbols:[xt.vx,xt.absv,xt.alpha]},{id:"polar-y",html:Y(fs,Ye,Ba,fr(fi),Ye,ee("vySub","comp-y"),Ye,ee("vy","comp-y")),symbols:[xt.vy]}],prompt:`A vector has length 5 and points 30° above the +x axis. What is ${me.vx}?`,answer:{value:4.33,tolerance:.02,correctFeedback:"Correct: 5 cos 30° = 5 × 0.866 ≈ 4.33. The x component goes with cosine because it is the side next to the angle.",wrong:[{value:2.5,feedback:"That is 5 sin 30°, the y component. The x component is the side next to the angle, so it goes with cosine."},{value:.87,tolerance:.01,feedback:"0.866 is cos 30° by itself. Multiply by the length: vx = 5 × 0.866."},{value:.77,tolerance:.01,feedback:"Your calculator is in radians: 5 cos(30 radians) ≈ 0.77. Switch it to degrees."},{value:5,feedback:"5 is the whole length. Only a vector lying along the x axis has vx = |v|."}],fallbackFeedback:"Use vx = |v| cos α with |v| = 5 and α = 30°, with the calculator in degrees."}},{id:"angle-from-components",label:"Back to the angle",title:"From components back to the angle: check the quadrant",activeLabel:"The angle from components",body:`Going backward, tan ${me.alpha} = ${me.vy}/${me.vx}. But the ratio cannot tell opposite directions apart: (3, 3) and (−3, −3) give the same ratio. A calculator’s tan⁻¹ key always answers between −90° and 90°, so for any vector pointing left (${me.vx} < 0) it is off by 180°. The fix is to look at the signs of the components: if ${me.vx} is negative, add 180°; if the result is still negative, add 360°. Programs do this in one step with a function called atan2.`,task:"Predict the angle first. Then drag the tip into each quadrant and compare the calculator’s answer with the true angle.",visualKind:"vector-lab",dimension:2,controls:["components"],labOptions:{...Gr,showAngle:!0},initialLabState:{v:{x:-3,y:3,z:0}},revealAfterAnswer:["atanNaive","alpha"],equations:[{id:"tan-ratio",html:Y(E("tan"),fi,Ye,Mn(fs,ps),Ye,ee("tanRatio","vector")),symbols:[xt.alpha,xt.vx,xt.vy]},{id:"quadrant",html:Y(y0,Ln(Mn(fs,ps)),Ye,ee("atanNaive"))+$o("What the calculator’s tan⁻¹ key returns.")+Y(fi,Ye,ee("alpha","angle-alpha"))+$o("The true angle, found with the quadrant (atan2)."),symbols:[]}],prompt:`What is ${me.alpha} for ${me.v} = (−3, 3), measured counterclockwise from +x? (degrees)`,answer:{value:135,tolerance:1,correctFeedback:"Correct. tan⁻¹(3/−3) gives −45°, but the vector points up and to the left, into the second quadrant, so α = −45° + 180° = 135°.",wrong:[{value:-45,feedback:"−45° is what tan⁻¹(3/−3) returns, but that direction points down and to the right. This vector points up and to the left: add 180°."},{value:45,feedback:"45° points up and to the right, the direction of (3, 3). Here vx is negative, so the vector points left."},{value:315,feedback:"315° is the same direction as −45°: down and to the right. That is (3, −3)."},{value:225,feedback:"225° points down and to the left, the direction of (−3, −3). Here vy is positive."}],fallbackFeedback:"Find tan⁻¹(vy/vx), then use the signs of vx and vy to put the angle in the right quadrant."}},{id:"direction-angles-3d",label:"Direction angles in 3D",title:"In 3D: one angle to each axis",activeLabel:"Direction angles and cosines",body:`In 3D a single angle is not enough. Instead, measure the angle from the vector to each axis: ${me.alpha} to x, ${me.beta} to y, and ${me.gamma} to z. These are the direction angles. The same right-triangle reasoning gives ${me.vx} = ${me.absv} cos ${me.alpha}, ${me.vy} = ${me.absv} cos ${me.beta}, and ${me.vz} = ${me.absv} cos ${me.gamma}. Divide by ${me.absv}: the direction cosines are exactly the components of the unit vector ${me.vhat}. Because ${me.vhat} has length 1, their squares add to 1. In the flat x–y plane, ${me.beta} = 90° − ${me.alpha}, so cos ${me.beta} = sin ${me.alpha}: the 2D formulas are a special case.`,task:"Drag the tip (Shift + drag moves it up or down). The three cosines change, but the sum of their squares stays 1.",visualKind:"vector-lab",dimension:3,controls:["components"],labOptions:{...Gr,showDirectionAngles:!0,showUnit:!0},initialLabState:{v:{x:2,y:3,z:6}},equations:[{id:"direction-cosines",html:Y(g0,Ye,Mn(f0,Ba),Ye,Ln(Ai(ms(fi),ms(Fc),ms(zc))))+Y(Ye,ee("unit","unit-vector"))+Y(Ln(Ai(fi,Fc,zc)),Ye,ee("directionAngles")),symbols:[xt.vhat,xt.alpha,xt.beta,xt.gamma]},{id:"cosine-identity",html:Y(Bo(fi),gi,Bo(Fc),gi,Bo(zc),Ye,Je("1"))+Y(ee("cosSquares"),Ye,ee("cosSquaresSum")),symbols:[]}],prompt:`Point ${me.v} straight up the z axis. What are its direction angles (${me.alpha}, ${me.beta}, ${me.gamma})?`,choices:[{id:"up",label:"(90°, 90°, 0°)",correct:!0,feedback:"Right. The vector lies along z, so it makes 0° with z and is perpendicular (90°) to x and y. The direction cosines are (0, 0, 1): the unit vector k̂."},{id:"flat",label:"(0°, 0°, 90°)",correct:!1,feedback:"A vector cannot make 0° with both x and y at once. Along z it is perpendicular to x and y, so those angles are 90°."},{id:"zeros",label:"(0°, 0°, 0°)",correct:!1,feedback:"The cosines would all be 1, and 1² + 1² + 1² = 3, not 1. A vector can lie along only one axis at a time."}]},{id:"rotate-axes",label:"Turn the axes",title:"Turn the axes, not the vector",activeLabel:"Rotating the axes",body:`Now keep the arrow still and turn the coordinate axes by an angle ${me.theta}. The turned axes are ${me.xp} and ${me.yp} (dashed). The arrow does not move. Only its description changes: its components in the new axes, ${me.vxp} and ${me.vyp}, are its projections onto ${me.xp} and ${me.yp}. Each new component collects a piece of both old ones, which is what the two equations say.`,task:`Predict first, then drag ${me.theta} to 30°.`,visualKind:"vector-lab",dimension:2,controls:["theta"],labOptions:$c,initialLabState:{v:{x:4,y:2,z:0},theta:0},revealAfterAnswer:["vxp","vyp"],equations:[_0,w0,{id:"theta",html:Y(gs,Ye,ee("theta","angle-theta")),symbols:[xt.theta]}],prompt:`You will turn the axes 30° counterclockwise. Will ${me.vxp} be larger or smaller than ${me.vx} = 4?`,choices:[{id:"larger",label:"Larger",correct:!0,feedback:"Right: v′x = 4 cos 30° + 2 sin 30° ≈ 4.46. The arrow points about 27° above x, so turning x′ by 30° swings it almost onto the arrow, and more of the arrow lies along it."},{id:"smaller",label:"Smaller",correct:!1,feedback:"Turning the axes counterclockwise moves x′ toward the arrow, which points about 27° above x. The projection onto x′ grows. Drag θ and watch the dashed blue arrow."},{id:"same",label:"The same",correct:!1,feedback:"The arrow does not change, but its projection onto a different axis does. Only its length stays the same."}]},{id:"same-arrow",label:"Same arrow, new numbers",title:"Same arrow, different description",activeLabel:"One arrow, many descriptions",body:`Every choice of axes gives different components, but they all describe one arrow. Its length is the same in every frame. Turning about the z axis leaves the z component alone: ${me.vz} does not change. One frame is special: turn ${me.xp} until it lies under the arrow, and the horizontal part of the vector is a single component, ${me.vyp} = 0. Stress uses the same idea. In S5 and S8 you will turn the axes until the shear components of stress vanish, and those special axes are the principal stress directions.`,task:"Reach the goal, then orbit the view: the arrow never moved.",visualKind:"vector-lab",dimension:3,controls:["theta","components"],labOptions:$c,initialLabState:{v:{x:4,y:2,z:3},theta:0},goal:{text:`Turn the axes until ${me.vyp} = 0 with ${me.vxp} positive.`,check:i=>Math.abs(i.primed.y)<.05&&i.primed.x>0},equations:[{id:"invariant",html:Y(Ba,Ye,Cr($a(ps),gi,$a(fs),gi,$a(Vr)))+Y(Ye,Cr($a(Ll),gi,$a(zh),gi,$a(Vr)),Ye,ee("magnitude","vector")),symbols:[xt.absv,xt.vx,xt.vy,xt.vz,xt.vxp,xt.vyp]},{id:"both-frames",html:Y(Ln(Ai(ps,fs,Vr)),Ye,ee("v","vector"))+Y(Ln(Ai(Ll,zh,Vr)),Ye,ee("primed"))+Y(gs,Ye,ee("theta","angle-theta")),symbols:[xt.theta]}]},{id:"double-angle",label:"Preview: double angles",title:"A preview: squares and products of sine and cosine",activeLabel:"Double-angle preview",body:`Project something twice and you get products such as cos²${me.theta} and sin ${me.theta} cos ${me.theta}. Stress does exactly that. In S2 a force is projected onto a tilted plane and spread over an area that grows as the plane tilts, which gives cos²${me.theta}. In S5 the shear stress on a tilted plane goes as sin ${me.theta} cos ${me.theta}. Both can be rewritten with the double angle 2${me.theta}, which is why the Mohr circle (S6) uses 2${me.theta}. You don’t need to derive these now; notice their shapes.`,task:`Sweep ${me.theta} from 0° to 180° and follow the dots on both curves.`,visualKind:"vector-lab",dimension:2,controls:["theta"],labOptions:{...$c,showComponents:!1,showUnitCircle:!0,view:"close",plot:"double-angle"},initialLabState:{v:{x:1,y:0,z:0},theta:30},equations:[{id:"cos-squared",html:Y(x0,Ye,qu,Ln(Je("1"),gi,E("cos"),Je("2"),E("θ")),Ye,ee("cos2","curve-cos2")),symbols:[xt.cos2]},{id:"sin-cos",html:Y(b0,Ye,qu,E("sin"),Je("2"),E("θ"),Ye,ee("sincos","curve-sincos"))+Y(gs,Ye,ee("theta","angle-theta")),symbols:[xt.sincos,xt.theta]}],prompt:`At which angle is sin ${me.theta} cos ${me.theta} largest?`,choices:[{id:"45",label:"45°",correct:!0,feedback:"Right: ½ sin 2θ is largest when 2θ = 90°. This is why the largest shear stress acts on planes at 45° to the principal stresses (S5)."},{id:"90",label:"90°",correct:!1,feedback:"At 90°, cos θ = 0, so the product is 0. It peaks halfway, where 2θ = 90°."},{id:"0",label:"0°",correct:!1,feedback:"At 0°, sin θ = 0, so the product is 0. It peaks at 45°, where 2θ = 90°."}]},{id:"where-trig-shows-up",label:"Trig in geology",title:"Where this shows up in geology",activeLabel:"Trigonometry in structural geology",body:`Field measurements are angles, and these relations turn them into vectors. A line in the field, such as a fold hinge, is recorded by its compass direction and by how steeply it plunges. Here z still points up, so its steepness is the angle ${me.eps} between the line and the floor: ${me.vz} = ${me.absv} sin ${me.eps} and its floor shadow is ${me.absv} cos ${me.eps}. O1 turns this into trend and plunge, with z pointing down. And whenever a plane is tilted inside a stressed rock (S5), the stress is described in axes turned to match the plane, with the rotation equations from step 5.`,task:"Pick each example.",visualKind:"vector-lab",dimension:3,controls:["context"],contexts:Hc,labOptions:{...Gr,draggable:[]},initialLabState:{v:Hc[0].vector,context:Hc[0].id},equations:[{id:"elevation",html:Y(Vr,Ye,Ba,fr(Bc),Ye,ee("vzFromElevation","comp-z"))+Y(v0,Ye,Ba,ms(Bc),Ye,ee("d","xy-diagonal"))+Y(Bc,Ye,ee("elevation","elevation-angle")),symbols:[xt.vz,xt.d,xt.eps]},{id:"plane-normal",html:Y(Ll,Ye,ps,ms(gs),gi,fs,fr(gs),Ye,ee("vxp","comp-x-prime"))+$o("For the tilted plane: the part of the vector along the plane’s normal x′. The rest, v′y, lies in the plane."),symbols:[xt.vxp,xt.theta]}]}]},M0=[{symbol:cc(ne("t")),sceneRef:"traction",description:"Grid of short arrows spread over the patch"},{symbol:ne("F"),sceneRef:"force",description:"White arrow with a round drag handle"},{symbol:E("A"),sceneRef:"area",description:"Shaded patch on the selected face"}],Xu=ce("traction",cc(ne("t"))),ju={id:"average-traction",html:Y(Xu,J("="),Mn(ce("force",ne("F")),ce("area",E("A"))))+Y($n(Xu),J("="),ee("tractionConversion"),J("="),ee("traction")),symbols:M0},Yu={showSurfaceNormal:!0,showArea:!0,showDistribution:!0,allowSurfaceSelection:!0,allowForceDrag:!0},T0={id:"S2",status:"seed",steps:[{id:"distribute-force-over-area",label:"Distribute the load",title:"A resultant force can stand for a load spread over an area",activeLabel:"Resultant and load distribution",body:"The white arrow is the resultant force. The small arrows show one idealized uniform distribution that produces it. Changing the area changes how concentrated the load is, without changing the resultant.",task:"Hold the force fixed and compare 50 cm² with 100 cm². Notice what changes—and what does not.",visualKind:"force-lab",quantity:"force",controls:["magnitude","area"],labOptions:Yu,initialLabState:{forceVector:{x:0,y:-5e3,z:0},surfaceNormal
